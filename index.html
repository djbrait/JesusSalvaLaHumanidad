        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: 2px solid #FFD700;
            image-rendering: pixelated;
            display: block;
        }
        #touch-controls {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            border-radius: 50%;

            border-color: #FFD700;
            box-shadow: 0 0 14px rgba(255,215,0,0.5), inset 0 0 8px rgba(255,215,0,0.1);

        /* Orientation overlay */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            font-size: 22px;
            text-align: center;
            padding: 30px;
        }
        #orientation-overlay .rotate-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: rotateHint 2s ease-in-out infinite;
        }
        @keyframes rotateHint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        /* Pause button stays fixed on top-right of screen */
        #btn-pause {
            position: fixed;
            width: 40px; height: 40px;
            top: env(safe-area-inset-top, 8px);
            right: 10px;
            font-size: 16px;
            border-radius: 8px;

        }
        /* Touch button sizes/positions set by JS for different screen sizes */
        @media (pointer: coarse), (max-width: 800px) {
            #touch-controls { display: block; }
        }

// ---- AUDIO ENGINE ----
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
}
function playSound(freq, duration, type = 'square', volume = 0.15) {
    if (!sfxEnabled) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxJump() { playSound(400, 0.15); setTimeout(() => playSound(600, 0.1), 50); }
function sfxHit() { playSound(200, 0.2, 'sawtooth', 0.2); }

let musicPlaying = false;
let musicInterval = null;
const MELODY_NOTES = [
    // Epic heroic loop
    [392, 0.15], [440, 0.15], [523, 0.3], [659, 0.15], [523, 0.15],
    [587, 0.3], [523, 0.15], [440, 0.15], [392, 0.3], [330, 0.15],

    [523, 0.15], [587, 0.15], [659, 0.3], [784, 0.3], [659, 0.15],
    [587, 0.15], [523, 0.3], [440, 0.15], [392, 0.15], [440, 0.4],
    [0, 0.2], [330, 0.15], [392, 0.15], [440, 0.15], [523, 0.15],
    [587, 0.3], [659, 0.3], [784, 0.4], [659, 0.2], [523, 0.3],
    [0, 0.3]
];
const BASS_NOTES = [
    [196, 0.6], [220, 0.6], [262, 0.6], [196, 0.6],
    [220, 0.6], [262, 0.6], [294, 0.6], [220, 0.6],
    [262, 0.6], [294, 0.6], [330, 0.6], [262, 0.6],
    [196, 0.6], [220, 0.6], [262, 0.6], [196, 0.6]
];

function startMusic() {
    if (musicPlaying || !musicEnabled) return;
    ensureAudio();
    musicPlaying = true;
    let melodyIdx = 0;
    let bassIdx = 0;
    let melodyNext = 0;
    let bassNext = 0;
    const startTime = audioCtx.currentTime;

    function scheduleMelody() {
        if (!musicPlaying) return;
        const now = audioCtx.currentTime - startTime;
        while (melodyNext < now + 0.5) {
            const [freq, dur] = MELODY_NOTES[melodyIdx % MELODY_NOTES.length];
            if (freq > 0) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, startTime + melodyNext);
                gain.gain.setValueAtTime(0.06, startTime + melodyNext);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + melodyNext + dur * 0.9);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime + melodyNext);
                osc.stop(startTime + melodyNext + dur);
            }
            melodyNext += dur;
            melodyIdx++;
        }
    }

    function scheduleBass() {
        if (!musicPlaying) return;
        const now = audioCtx.currentTime - startTime;
        while (bassNext < now + 0.5) {
            const [freq, dur] = BASS_NOTES[bassIdx % BASS_NOTES.length];
            if (freq > 0) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, startTime + bassNext);
                gain.gain.setValueAtTime(0.04, startTime + bassNext);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + bassNext + dur * 0.9);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime + bassNext);
                osc.stop(startTime + bassNext + dur);
            }
            bassNext += dur;
            bassIdx++;
        }
    }

    musicInterval = setInterval(() => {
        if (!musicPlaying) { clearInterval(musicInterval); return; }
        scheduleMelody();
        scheduleBass();
    }, 200);
    scheduleMelody();
    scheduleBass();
}

function stopMusic() {
    musicPlaying = false;
    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
}

// Pausar TODO el audio cuando el dispositivo se bloquea o la app pasa a segundo plano
let _musicWasPlaying = false;
let _appHidden = false;

function handleAppHidden() {
    if (_appHidden) return;
    _appHidden = true;
    _musicWasPlaying = musicPlaying;
    if (musicPlaying) stopMusic();
    // Cerrar AudioContext completamente para cortar osciladores ya programados
    if (audioCtx) {
        try { audioCtx.close(); } catch(e) {}
        audioCtx = null;
    }
}

function handleAppVisible() {
    if (!_appHidden) return;
    _appHidden = false;
    // AudioContext se re-crea automáticamente en ensureAudio() al necesitarse
    if (_musicWasPlaying && musicEnabled) startMusic();
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) handleAppHidden();
    else handleAppVisible();
});
window.addEventListener('pagehide', handleAppHidden);
window.addEventListener('pageshow', handleAppVisible);
window.addEventListener('blur', () => {
    // Solo en móvil: blur = cambio de app / pantalla bloqueada
    if ('ontouchstart' in window) handleAppHidden();
});
window.addEventListener('focus', () => {
    if ('ontouchstart' in window) handleAppVisible();
});

// ---- INPUT ----
const keys = {};
const touchKeys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true; e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

// Touch controls
function setupTouch(btnId, keyCode) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const start = (e) => { e.preventDefault(); touchKeys[keyCode] = true; btn.classList.add('active'); ensureAudio(); };
    const end = (e) => { e.preventDefault(); touchKeys[keyCode] = false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart', start, {passive:false});
    btn.addEventListener('touchend', end, {passive:false});
    btn.addEventListener('touchcancel', end, {passive:false});
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}
setupTouch('btn-left', 'ArrowLeft');
setupTouch('btn-right', 'ArrowRight');
setupTouch('btn-jump', 'Space');
setupTouch('btn-dash', 'ShiftLeft');
setupTouch('btn-z', 'KeyZ');
setupTouch('btn-x', 'KeyX');
setupTouch('btn-bonus-up', 'ArrowUp');
setupTouch('btn-bonus-down', 'ArrowDown');
document.getElementById('btn-pause')?.addEventListener('touchstart', (e) => { e.preventDefault(); togglePause(); ensureAudio(); }, {passive:false});
document.getElementById('btn-pause')?.addEventListener('mousedown', (e) => { e.preventDefault(); togglePause(); });

let shakeIntensity = 0;
let transitionAlpha = 0;
let transitionDir = 0; // 0=none, 1=fadeOut, -1=fadeIn
let transitionCallback = null;

// ---- PAUSE ----
let pauseInputDelay = 0;

function togglePause() {
    if (gameState === 'playing' || gameState === 'bossFight' || gameState === 'bonus' || gameState === 'tutorial') {
        previousState = gameState;
        gameState = 'paused';
        pauseSelection = 0;
        pauseInputDelay = 15; // ignore inputs for ~0.25s to prevent accidental selection
        // Clear all held keys so movement keys don't affect the menu
        for (const k in keys) keys[k] = false;
        for (const k in touchKeys) touchKeys[k] = false;
        stopMusic();
    } else if (gameState === 'paused') {
        pauseConfirm = null;
        gameState = previousState;
        startMusic();
    }
}
window.addEventListener('keydown', e => {
    if (e.code === 'KeyP') togglePause();
});

// ---- CAMERA ----
let camera = { x: 0, y: 0 };

// ---- MOBILE/PERFORMANCE DETECTION ----
const isMobileEarly = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
const PARTICLE_MULT = isMobileEarly ? 0.5 : 1;
const BG_DETAIL = isMobileEarly ? 0.5 : 1;
const MAX_PARTICLES = isMobileEarly ? 50 : 200;

// ---- PARTICLES ----
let particles = [];
function spawnParticles(x, y, color, count = 8, speed = 3) {
    const actual = Math.max(1, Math.round(count * PARTICLE_MULT));
    for (let i = 0; i < actual; i++) {
        if (particles.length >= MAX_PARTICLES) break;
        const angle = (Math.PI * 2 / actual) * i + Math.random() * 0.5;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed * (0.5 + Math.random()),
            vy: Math.sin(angle) * speed * (0.5 + Math.random()) - 1,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

// Level layout generator
function generateLevel(levelNum) {
    const platforms = [];
    const enemies = [];
    const coins = [];
    const width = 4000 + levelNum * 1000;
    
    // Ground
    for (let x = 0; x < width; x += TILE) {
        // Add gaps in ground
        const gapZones = levelNum === 0 ? [[1200,1320],[2400,2520]] :
                         levelNum === 1 ? [[1000,1160],[2000,2160],[3200,3360]] :
                         levelNum === 2 ? [[800,1000],[1600,1800],[2800,3000],[3800,4000]] :
                         levelNum === 3 ? [[900,1100],[1800,2000],[2700,2900],[3600,3800]] :
                         levelNum === 4 ? [[700,900],[1500,1700],[2500,2700],[3500,3700],[4500,4700]] :
                         [[600,840],[1400,1640],[2400,2640],[3400,3640],[4400,4640],[5200,5400]];
        let isGap = false;
        for (const [gs, ge] of gapZones) {
            if (x >= gs && x < ge) { isGap = true; break; }
        }
        if (!isGap) {
            platforms.push({ x, y: 500, w: TILE, h: TILE, type: 'ground' });
        }
    }
    
    // Floating platforms
    const platConfigs = [
        // Level 0
        [
            {x:200,y:380,w:3},{x:500,y:300,w:2},{x:800,y:350,w:4},{x:1100,y:280,w:3},
            {x:1300,y:400,w:2},{x:1600,y:320,w:3},{x:1900,y:260,w:2},{x:2200,y:380,w:4},
            {x:2500,y:300,w:3},{x:2800,y:350,w:2},{x:3100,y:280,w:3},{x:3400,y:400,w:2},
            {x:3700,y:320,w:4}
        ],
        // Level 1
        [

    }

    gameState = 'bossFight';

// ---- DRAWING FUNCTIONS ----

function drawChicoEstrella(x, y, w, h, facing, animFrame, attacking, invincible, isEvil = false, isRunning = false) {
    if (invincible > 0 && Math.floor(invincible / 3) % 2 === 0) return;
    
    ctx.save();
    ctx.translate(x + w/2, y + h/2);
    if (facing < 0) ctx.scale(-1, 1);
    
    const cx = -w/2, cy = -h/2;
    
    // Colors
    const skinColor = isEvil ? '#8B0000' : '#1a5c2a';
    const suitColor = isEvil ? '#FF4500' : '#00d4ff';
    const starColor = isEvil ? '#8B008B' : '#FFD700';
    const capeColor = isEvil ? '#4B0082' : '#FFD700';
    const bootColor = isEvil ? '#8B008B' : '#FFD700';
    const visorColor = isEvil ? '#FF0000' : '#00bfff';
    const hairColor = isEvil ? '#1a1a1a' : '#8B4513';
    const beltColor = isEvil ? '#4B0082' : '#DAA520';
    
    // Cape (behind body)
    ctx.fillStyle = capeColor;
    ctx.beginPath();
    const capeWave = Math.sin(animFrame * 0.15) * 3;
    ctx.moveTo(cx + w * 0.3, cy + h * 0.3);
    ctx.quadraticCurveTo(cx - 8 + capeWave, cy + h * 0.6, cx - 5 + capeWave, cy + h * 0.85);
    ctx.lineTo(cx + w * 0.2, cy + h * 0.8);
    ctx.closePath();
    ctx.fill();
    
    // Body (suit)
    ctx.fillStyle = suitColor;
    ctx.fillRect(cx + w * 0.2, cy + h * 0.33, w * 0.6, h * 0.35);
    
    // Legs with walking animation
    const legSwing = isRunning ? Math.sin(animFrame * 0.35) * 12 : 0;
    ctx.fillStyle = suitColor;
    // Left leg
    ctx.save();
    ctx.translate(cx + w * 0.33, cy + h * 0.65);
    ctx.rotate(legSwing * Math.PI / 180 * 2);
    ctx.fillRect(-w * 0.11, 0, w * 0.22, h * 0.22);
    // Left boot
    ctx.fillStyle = bootColor;
    ctx.fillRect(-w * 0.14, h * 0.18, w * 0.28, h * 0.15);
    ctx.restore();
    
    // Right leg
    ctx.fillStyle = suitColor;
    ctx.save();
    ctx.translate(cx + w * 0.67, cy + h * 0.65);
    ctx.rotate(-legSwing * Math.PI / 180 * 2);
    ctx.fillRect(-w * 0.11, 0, w * 0.22, h * 0.22);
    // Right boot
    ctx.fillStyle = bootColor;
    ctx.fillRect(-w * 0.14, h * 0.18, w * 0.28, h * 0.15);
    ctx.restore();
    
    // Belt
    ctx.fillStyle = beltColor;
    ctx.fillRect(cx + w * 0.18, cy + h * 0.62, w * 0.64, h * 0.06);
    // Belt buckle (star)
    ctx.fillStyle = starColor;
    ctx.beginPath();
    ctx.arc(cx + w * 0.5, cy + h * 0.65, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Star on chest
    ctx.fillStyle = starColor;
    drawStar(cx + w * 0.5, cy + h * 0.46, 10, 5, 5);
    
    // Arms
    ctx.fillStyle = suitColor;
    const armAngle = attacking ? -0.8 : Math.sin(animFrame * 0.15) * 0.3;
    ctx.save();
    ctx.translate(cx + w * 0.75, cy + h * 0.38);
    ctx.rotate(armAngle);
    ctx.fillRect(0, -3, 14, 6);
    // Glove
    ctx.fillStyle = bootColor;
    ctx.fillRect(12, -4, 6, 8);
    ctx.restore();
    
    // Left arm
    ctx.fillStyle = suitColor;
    ctx.save();
    ctx.translate(cx + w * 0.25, cy + h * 0.38);
    ctx.rotate(-armAngle * 0.5);
    ctx.fillRect(-14, -3, 14, 6);
    ctx.fillStyle = bootColor;
    ctx.fillRect(-18, -4, 6, 8);
    ctx.restore();
    
    // Head
    ctx.fillStyle = skinColor;
    const headW = w * 0.7;
    const headH = h * 0.28;
    ctx.fillRect(cx + w * 0.15, cy + h * 0.05, headW, headH);
    
    // Visor/mask
    ctx.fillStyle = visorColor;
    ctx.fillRect(cx + w * 0.1, cy + h * 0.06, headW + w * 0.1, headH * 0.45);
    // Pointy ears on visor
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.1, cy + h * 0.06);
    ctx.lineTo(cx + w * 0.02, cy + h * 0.12);
    ctx.lineTo(cx + w * 0.1, cy + h * 0.18);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.9, cy + h * 0.06);
    ctx.lineTo(cx + w * 0.98, cy + h * 0.12);
    ctx.lineTo(cx + w * 0.9, cy + h * 0.18);
    ctx.fill();
    
    // Hair (spiky brown)
    ctx.fillStyle = hairColor;
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.2, cy + h * 0.06);
    ctx.lineTo(cx + w * 0.3, cy - h * 0.08);
    ctx.lineTo(cx + w * 0.4, cy + h * 0.04);
    ctx.lineTo(cx + w * 0.5, cy - h * 0.1);
    ctx.lineTo(cx + w * 0.6, cy + h * 0.04);
    ctx.lineTo(cx + w * 0.7, cy - h * 0.06);
    ctx.lineTo(cx + w * 0.8, cy + h * 0.06);
    ctx.closePath();
    ctx.fill();
    
    // Smile
    ctx.strokeStyle = '#fff';

    if (attacking) {

        ctx.fillRect(cx + w * 0.58 - 2, cy + h * 0.09 - 2, 8, 11);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(cx + w * 0.33, cy + h * 0.09, 4, 7);

        ctx.fillRect(cx + w * 0.6, cy + h * 0.1, 2, 6);
    }

}

function drawStar(cx, cy, outerR, innerR, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = (Math.PI * 2 / (points * 2)) * i - Math.PI / 2;
        if (i === 0) ctx.moveTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        else ctx.lineTo(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
    }
    ctx.closePath();
    ctx.fill();
}

        (currentLevel === 4) ? false : true; // Level 4 (Heladería) is light
    const lineColor = isDarkBg ? '#ffffff' : '#111111';
    const lineAlpha = 0.85;

    ctx.globalAlpha = lineAlpha;
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6, 5]);

    // Cape (dashed outline)
    const capeWave = Math.sin(animFrame * 0.15) * 3;
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.3, cy + h * 0.3);
    ctx.quadraticCurveTo(cx - 8 + capeWave, cy + h * 0.6, cx - 5 + capeWave, cy + h * 0.85);
    ctx.lineTo(cx + w * 0.2, cy + h * 0.8);
    ctx.closePath();
    ctx.stroke();

    // Body (dashed rectangle outline)
    ctx.strokeRect(cx + w * 0.2, cy + h * 0.33, w * 0.6, h * 0.35);

    // Legs
    const legSwing = isRunning ? Math.sin(animFrame * 0.35) * 12 : 0;
    ctx.save();
    ctx.translate(cx + w * 0.33, cy + h * 0.65);
    ctx.rotate(legSwing * Math.PI / 180 * 2);
    ctx.strokeRect(-w * 0.11, 0, w * 0.22, h * 0.22);
    // Boot
    ctx.strokeRect(-w * 0.14, h * 0.18, w * 0.28, h * 0.15);
    ctx.restore();
    ctx.save();
    ctx.translate(cx + w * 0.67, cy + h * 0.65);
    ctx.rotate(-legSwing * Math.PI / 180 * 2);
    ctx.strokeRect(-w * 0.11, 0, w * 0.22, h * 0.22);
    ctx.strokeRect(-w * 0.14, h * 0.18, w * 0.28, h * 0.15);
    ctx.restore();

    // Belt
    ctx.strokeRect(cx + w * 0.18, cy + h * 0.62, w * 0.64, h * 0.06);

    // Head
    ctx.beginPath();
    ctx.arc(cx + w * 0.5, cy + h * 0.22, w * 0.28, 0, Math.PI * 2);
    ctx.stroke();

    // Eyes - small dashed circles
    ctx.setLineDash([2, 3]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx + w * 0.4, cy + h * 0.19, w * 0.06, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + w * 0.6, cy + h * 0.19, w * 0.06, 0, Math.PI * 2);
    ctx.stroke();

    // Star on chest (dashed)
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 2;
    const starCx = cx + w * 0.5;
    const starCy = cy + h * 0.47;
    const starR = w * 0.1;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const angle = -Math.PI / 2 + (i * 2 * Math.PI / 5);
        const angle2 = angle + Math.PI / 5;
        const ox = starCx + Math.cos(angle) * starR;
        const oy = starCy + Math.sin(angle) * starR;
        const ix = starCx + Math.cos(angle2) * starR * 0.4;
        const iy = starCy + Math.sin(angle2) * starR * 0.4;
        if (i === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.stroke();

    // Arms
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 2.5;
    const armSwing = attacking ? -30 : (isRunning ? Math.sin(animFrame * 0.35 + 1) * 15 : 0);
    ctx.save();
    ctx.translate(cx + w * 0.15, cy + h * 0.38);
    ctx.rotate(armSwing * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-w * 0.15, h * 0.25);
    ctx.stroke();
    // Hand
    ctx.beginPath();
    ctx.arc(-w * 0.15, h * 0.25, w * 0.05, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(cx + w * 0.85, cy + h * 0.38);
    ctx.rotate(-armSwing * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(w * 0.15, h * 0.25);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w * 0.15, h * 0.25, w * 0.05, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Attacking flash effect
    if (attacking) {
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx + w * 0.5, cy + h * 0.5, w * 0.7, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawShuriken(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
        const angle = (Math.PI / 2) * i;
        const tipX = cx + Math.cos(angle) * r;
        const tipY = cy + Math.sin(angle) * r;
        const leftA = angle - 0.5;
        const rightA = angle + 0.5;
        const innerR = r * 0.25;
        if (i === 0) ctx.moveTo(cx + Math.cos(leftA) * innerR, cy + Math.sin(leftA) * innerR);
        else ctx.lineTo(cx + Math.cos(leftA) * innerR, cy + Math.sin(leftA) * innerR);
        ctx.lineTo(tipX, tipY);
        ctx.lineTo(cx + Math.cos(rightA) * innerR, cy + Math.sin(rightA) * innerR);
    }
    ctx.closePath();
    ctx.fill();
}

function drawMagnate(x, y, w, h, facing, animFrame, attacking, invincible, isEvil = false, isRunning = false) {
    if (invincible > 0 && Math.floor(invincible / 3) % 2 === 0) return;
    ctx.save();
    ctx.translate(x + w/2, y + h/2);
    if (facing < 0) ctx.scale(-1, 1);
    const cx = -w/2, cy = -h/2;

    const orangeColor = '#FF8C00';
    const blueColor = '#87CEEB';
    const suitColor = '#4B0082';
    const capeColor = '#FF8C00';
    const bootColorL = '#FF8C00';
    const bootColorR = '#87CEEB';

    // Cape (orange, behind body)
    ctx.fillStyle = capeColor;
    ctx.beginPath();
    const capeWave = Math.sin(animFrame * 0.15) * 3;
    ctx.moveTo(cx + w * 0.3, cy + h * 0.3);
    ctx.quadraticCurveTo(cx - 10 + capeWave, cy + h * 0.6, cx - 7 + capeWave, cy + h * 0.85);
    ctx.lineTo(cx + w * 0.15, cy + h * 0.85);
    ctx.quadraticCurveTo(cx - 5 + capeWave, cy + h * 0.55, cx + w * 0.2, cy + h * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#CC6600';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Body (purple suit)
    ctx.fillStyle = suitColor;
    ctx.fillRect(cx + w * 0.2, cy + h * 0.33, w * 0.6, h * 0.35);
    ctx.strokeStyle = '#2E0054';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cx + w * 0.2, cy + h * 0.33, w * 0.6, h * 0.35);

    // V-neck pattern on suit
    ctx.strokeStyle = blueColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.28, cy + h * 0.33);
    ctx.lineTo(cx + w * 0.5, cy + h * 0.55);
    ctx.lineTo(cx + w * 0.72, cy + h * 0.33);
    ctx.stroke();
    // Diamond on chest
    ctx.fillStyle = '#6A5ACD';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.5, cy + h * 0.40);
    ctx.lineTo(cx + w * 0.55, cy + h * 0.46);
    ctx.lineTo(cx + w * 0.5, cy + h * 0.52);
    ctx.lineTo(cx + w * 0.45, cy + h * 0.46);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#9370DB';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Legs with walking animation
    const legSwing = isRunning ? Math.sin(animFrame * 0.35) * 12 : 0;
    // Left leg (orange)
    ctx.fillStyle = suitColor;
    ctx.save();
    ctx.translate(cx + w * 0.33, cy + h * 0.65);
    ctx.rotate(legSwing * Math.PI / 180 * 2);
    ctx.fillRect(-w * 0.11, 0, w * 0.22, h * 0.22);
    ctx.fillStyle = bootColorL;
    ctx.fillRect(-w * 0.14, h * 0.18, w * 0.28, h * 0.15);
    ctx.restore();
    // Right leg (blue)
    ctx.fillStyle = suitColor;
    ctx.save();
    ctx.translate(cx + w * 0.67, cy + h * 0.65);
    ctx.rotate(-legSwing * Math.PI / 180 * 2);
    ctx.fillRect(-w * 0.11, 0, w * 0.22, h * 0.22);
    ctx.fillStyle = bootColorR;
    ctx.fillRect(-w * 0.14, h * 0.18, w * 0.28, h * 0.15);
    ctx.restore();

    // Belt (purple)
    ctx.fillStyle = '#6A0DAD';
    ctx.fillRect(cx + w * 0.18, cy + h * 0.62, w * 0.64, h * 0.06);
    ctx.fillStyle = '#9370DB';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.5, cy + h * 0.62);
    ctx.lineTo(cx + w * 0.54, cy + h * 0.65);
    ctx.lineTo(cx + w * 0.5, cy + h * 0.68);
    ctx.lineTo(cx + w * 0.46, cy + h * 0.65);
    ctx.closePath();
    ctx.fill();

    // Arms
    const armAngle = attacking ? -0.8 : Math.sin(animFrame * 0.15) * 0.3;
    // Right arm (blue skin)
    ctx.fillStyle = suitColor;
    ctx.save();
    ctx.translate(cx + w * 0.75, cy + h * 0.38);
    ctx.rotate(armAngle);
    ctx.fillRect(0, -3, 14, 6);
    ctx.fillStyle = blueColor;
    ctx.fillRect(12, -4, 6, 8);
    ctx.restore();
    // Left arm (orange skin)
    ctx.fillStyle = suitColor;
    ctx.save();
    ctx.translate(cx + w * 0.25, cy + h * 0.38);
    ctx.rotate(-armAngle * 0.5);
    ctx.fillRect(-14, -3, 14, 6);
    ctx.fillStyle = orangeColor;
    ctx.fillRect(-18, -4, 6, 8);
    ctx.restore();

    // Head - split face (orange left, blue right)
    const headW = w * 0.7;
    const headH = h * 0.28;
    const headX = cx + w * 0.15;
    const headY = cy + h * 0.05;
    // Left half (orange)
    ctx.save();
    ctx.beginPath();
    ctx.rect(headX, headY, headW / 2, headH);
    ctx.clip();
    ctx.fillStyle = orangeColor;
    ctx.fillRect(headX, headY, headW, headH);
    ctx.restore();
    // Right half (blue)
    ctx.save();
    ctx.beginPath();
    ctx.rect(headX + headW / 2, headY, headW / 2, headH);
    ctx.clip();
    ctx.fillStyle = blueColor;
    ctx.fillRect(headX, headY, headW, headH);
    ctx.restore();

    // Pointed ears
    ctx.fillStyle = orangeColor;
    ctx.beginPath();
    ctx.moveTo(headX, headY + headH * 0.1);
    ctx.lineTo(headX - w * 0.08, headY - headH * 0.2);
    ctx.lineTo(headX + w * 0.05, headY + headH * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = blueColor;
    ctx.beginPath();
    ctx.moveTo(headX + headW, headY + headH * 0.1);
    ctx.lineTo(headX + headW + w * 0.08, headY - headH * 0.2);
    ctx.lineTo(headX + headW - w * 0.05, headY + headH * 0.3);
    ctx.closePath();
    ctx.fill();

    // Eyes (slanted, menacing)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.28, cy + h * 0.12);
    ctx.lineTo(cx + w * 0.42, cy + h * 0.10);
    ctx.lineTo(cx + w * 0.42, cy + h * 0.18);
    ctx.lineTo(cx + w * 0.28, cy + h * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.58, cy + h * 0.10);
    ctx.lineTo(cx + w * 0.72, cy + h * 0.12);
    ctx.lineTo(cx + w * 0.72, cy + h * 0.16);
    ctx.lineTo(cx + w * 0.58, cy + h * 0.18);
    ctx.closePath();
    ctx.fill();
    // Pupils
    ctx.fillStyle = '#000';
    ctx.fillRect(cx + w * 0.35, cy + h * 0.12, 3, 5);
    ctx.fillRect(cx + w * 0.62, cy + h * 0.12, 3, 5);

    // Smirk
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.38, cy + h * 0.26);
    ctx.quadraticCurveTo(cx + w * 0.5, cy + h * 0.30, cx + w * 0.65, cy + h * 0.24);
    ctx.stroke();

    // Fire/ice glow when attacking
    if (attacking) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#FF4500';
        ctx.beginPath();
        ctx.arc(cx + w * 0.25, cy + h * 0.45, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#00BFFF';
        ctx.beginPath();
        ctx.arc(cx + w * 0.75, cy + h * 0.45, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

function drawChicoGoloso(x, y, w, h, facing, animFrame, attacking, invincible, isEvil = false, isRunning = false) {
    if (invincible > 0 && Math.floor(invincible / 3) % 2 === 0) return;

    if (facing < 0) ctx.scale(-1, 1);
    const cx = -w/2, cy = -h/2;

    // Chico Goloso is slightly bigger - scale up 15%
    ctx.scale(1.15, 1.15);
    const ocx = cx / 1.15, ocy = cy / 1.15;

    // Legs (pink, thick)
    const legStep = isRunning ? Math.sin(animFrame * 0.3) * 6 : Math.sin(animFrame * 0.15) * 3;
    ctx.fillStyle = '#FFB6C1';
    ctx.fillRect(ocx + w * 0.15, ocy + h * 0.72 + legStep, w * 0.25, h * 0.28);
    ctx.fillRect(ocx + w * 0.55, ocy + h * 0.72 - legStep, w * 0.25, h * 0.28);
    // Cyan shoes
    ctx.fillStyle = '#00CED1';
    ctx.fillRect(ocx + w * 0.12, ocy + h * 0.92 + legStep, w * 0.3, h * 0.08);
    ctx.fillRect(ocx + w * 0.52, ocy + h * 0.92 - legStep, w * 0.3, h * 0.08);

    // Body (cyan shirt, round/fat)
    ctx.fillStyle = '#00CED1';
    ctx.beginPath();
    ctx.ellipse(ocx + w * 0.5, ocy + h * 0.52, w * 0.42, h * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();

    // Brown apron
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(ocx + w * 0.25, ocy + h * 0.38, w * 0.5, h * 0.34);
    // Apron straps
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ocx + w * 0.3, ocy + h * 0.38);
    ctx.lineTo(ocx + w * 0.35, ocy + h * 0.18);
    ctx.moveTo(ocx + w * 0.7, ocy + h * 0.38);
    ctx.lineTo(ocx + w * 0.65, ocy + h * 0.18);
    ctx.stroke();
    // Cookie on apron
    ctx.fillStyle = '#D2691E';
    ctx.beginPath();
    ctx.arc(ocx + w * 0.5, ocy + h * 0.52, w * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3E2723';
    ctx.fillRect(ocx + w * 0.46, ocy + h * 0.49, 3, 3);
    ctx.fillRect(ocx + w * 0.52, ocy + h * 0.54, 3, 3);

    // Arms (pink, thick)
    const armSwing = attacking ? -20 : Math.sin(animFrame * 0.15) * 5;
    ctx.fillStyle = '#FFB6C1';
    // Left arm
    ctx.save();
    ctx.translate(ocx + w * 0.12, ocy + h * 0.35);
    ctx.rotate((armSwing - 10) * Math.PI / 180);
    ctx.fillRect(-w * 0.1, 0, w * 0.18, h * 0.3);
    ctx.restore();
    // Right arm
    ctx.save();
    ctx.translate(ocx + w * 0.88, ocy + h * 0.35);
    ctx.rotate((-armSwing + 10) * Math.PI / 180);
    ctx.fillRect(-w * 0.08, 0, w * 0.18, h * 0.3);
    ctx.restore();

    // Head (pink, round, big)
    ctx.fillStyle = '#FFB6C1';
    ctx.beginPath();
    ctx.arc(ocx + w * 0.5, ocy + h * 0.15, w * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // Cyan cap
    ctx.fillStyle = '#00CED1';
    ctx.beginPath();
    ctx.ellipse(ocx + w * 0.5, ocy + h * 0.04, w * 0.34, h * 0.08, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(ocx + w * 0.18, ocy + h * 0.02, w * 0.64, h * 0.06);

    // Ears
    ctx.fillStyle = '#FFB6C1';
    ctx.beginPath();
    ctx.arc(ocx + w * 0.15, ocy + h * 0.14, w * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ocx + w * 0.85, ocy + h * 0.14, w * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(ocx + w * 0.35, ocy + h * 0.11, 4, 5);
    ctx.fillRect(ocx + w * 0.58, ocy + h * 0.11, 4, 5);

    // Eyebrows
    ctx.fillRect(ocx + w * 0.32, ocy + h * 0.08, 8, 2);
    ctx.fillRect(ocx + w * 0.56, ocy + h * 0.08, 8, 2);

    // Open mouth with tongue
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(ocx + w * 0.5, ocy + h * 0.22, w * 0.1, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath();
    ctx.ellipse(ocx + w * 0.5, ocy + h * 0.25, w * 0.05, h * 0.03, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cookie/soda glow when attacking
    if (attacking) {
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#D2691E';
        ctx.beginPath();
        ctx.arc(ocx + w * 0.85, ocy + h * 0.5, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

    ctx.fillRect(cx + w * 0.15, cy + h * 0.3, w * 0.35, h * 0.37);

    ctx.fillText('M', cx + w * 0.65, cy + h * 0.66);

    ctx.rotate((armSwing - 10) * Math.PI / 180);
    ctx.fillRect(-w * 0.06, 0, w * 0.14, h * 0.28);
    ctx.fillStyle = '#000';
    ctx.fillRect(-w * 0.06, h * 0.2, w * 0.14, h * 0.08);

    ctx.save();

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(-w * 0.08, h * 0.2, w * 0.14, h * 0.08);
