// ---- RESPONSIVE CANVAS ----
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
const isMobile = isTouchDevice;

// ---- FULLSCREEN FOR MOBILE ----
function requestFullscreen() {
    if (!isMobile) return;
    const el = document.documentElement;
    const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (rfs) {
        rfs.call(el).catch(() => {});
    }
    // Also try to lock orientation to landscape
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}
// Trigger fullscreen on first user interaction (touch/click)
if (isMobile) {
    const triggerFS = () => {
        requestFullscreen();
        document.removeEventListener('touchstart', triggerFS);
        document.removeEventListener('click', triggerFS);
    };
    document.addEventListener('touchstart', triggerFS, { once: true });
    document.addEventListener('click', triggerFS, { once: true });
}

// ---- ORIENTATION DETECTION ----
const orientationOverlay = document.getElementById('orientation-overlay');
function checkOrientation() {
    if (!isMobile) { 
        if (orientationOverlay) orientationOverlay.style.display = 'none';
        return; 
    }
    const isPortrait = window.innerHeight > window.innerWidth;
    if (orientationOverlay) {
        orientationOverlay.style.display = isPortrait ? 'flex' : 'none';
    }
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 100));
checkOrientation();

function resizeCanvas() {
    const ratio = 960 / 540;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const safeTop = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat') || '0');
    const safeBottom = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sab') || '0');
    
    const touchCtrl = document.getElementById('touch-controls');
    const showTouch = window.matchMedia('(pointer: coarse)').matches || vw <= 800;
    
    if (showTouch) {
        // Mobile/tablet: canvas fills entire screen, controls overlay on top
        canvas.style.width = vw + 'px';
        canvas.style.height = vh + 'px';
        canvas.style.marginTop = '0';
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.border = 'none';
        
        touchCtrl.style.display = 'block';
        
        // Button sizes relative to screen
        const btnSize = Math.max(52, Math.min(vh * 0.11, 72));
        const smallBtn = Math.max(46, btnSize * 0.85);
        const jumpBtn = Math.max(56, btnSize * 1.15);
        const pad = 16;
        
        const left = document.getElementById('btn-left');
        const right = document.getElementById('btn-right');
        const jump = document.getElementById('btn-jump');
        const dash = document.getElementById('btn-dash');
        const btnZ = document.getElementById('btn-z');
        const btnX = document.getElementById('btn-x');
        const bonusUp = document.getElementById('btn-bonus-up');
        const bonusDown = document.getElementById('btn-bonus-down');
        
        // D-pad left side
        function setBtnStyle(el, styles) {
            for (const [k, v] of Object.entries(styles)) el.style[k] = v;
        }
        setBtnStyle(left, {width:`${btnSize}px`,height:`${btnSize}px`,bottom:`${pad}px`,left:`${pad}px`,right:'',fontSize:`${btnSize*0.4}px`,color:'#fff',marginLeft:''});
        setBtnStyle(right, {width:`${btnSize}px`,height:`${btnSize}px`,bottom:`${pad}px`,left:`${pad + btnSize + 10}px`,right:'',fontSize:`${btnSize*0.4}px`,color:'#fff',marginLeft:''});
        setBtnStyle(dash, {width:`${smallBtn}px`,height:`${smallBtn}px`,bottom:`${pad + btnSize + 10}px`,left:`${pad}px`,right:'',fontSize:`${smallBtn*0.25}px`,color:'#00d4ff',marginLeft:''});
        
        // Action buttons right side
        setBtnStyle(jump, {width:`${jumpBtn}px`,height:`${jumpBtn}px`,bottom:`${pad + smallBtn + 10}px`,right:`${pad}px`,left:'',fontSize:`${jumpBtn*0.32}px`,color:'#ff4444',marginLeft:''});
        setBtnStyle(btnZ, {width:`${smallBtn}px`,height:`${smallBtn}px`,bottom:`${pad}px`,right:`${pad + smallBtn + 14}px`,left:'',fontSize:`${smallBtn*0.38}px`,color:'#00ff44',marginLeft:''});
        setBtnStyle(btnX, {width:`${smallBtn}px`,height:`${smallBtn}px`,bottom:`${pad}px`,right:`${pad}px`,left:'',fontSize:`${smallBtn*0.38}px`,color:'#FFD700',marginLeft:''});
        
        // Bonus buttons (centered, large)
        const bigBtn = Math.max(68, btnSize * 1.3);
        setBtnStyle(bonusUp, {width:`${bigBtn}px`,height:`${bigBtn}px`,bottom:`${pad + bigBtn + 14}px`,left:'50%',right:'',marginLeft:`-${bigBtn/2}px`,fontSize:`${bigBtn*0.4}px`});
        setBtnStyle(bonusDown, {width:`${bigBtn}px`,height:`${bigBtn}px`,bottom:`${pad}px`,left:'50%',right:'',marginLeft:`-${bigBtn/2}px`,fontSize:`${bigBtn*0.4}px`});
        
        _lastTouchLayout = '';
        updateTouchLayout();
    } else {
        // Desktop: center canvas, fill screen
        let cw = vw;
        let ch = cw / ratio;
        if (ch > vh) {
            ch = vh;
            cw = ch * ratio;
        }
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        canvas.style.marginTop = '';
        canvas.style.position = '';
        canvas.style.top = '';
        canvas.style.left = '';
        canvas.style.border = '2px solid #FFD700';
        touchCtrl.style.display = 'none';
    }
}

let _lastTouchLayout = '';
function updateTouchLayout() {
    const gameplayStates = ['playing', 'bossFight', 'tutorial', 'bonus', 'paused'];
    const isGameplay = gameplayStates.includes(gameState);
    const isBonus = gameState === 'bonus';
    const layoutKey = isGameplay ? (isBonus ? 'bonus' : 'normal') : 'hidden';
    if (layoutKey === _lastTouchLayout) return;
    _lastTouchLayout = layoutKey;
    
    const normalBtns = ['btn-left','btn-right','btn-jump','btn-dash','btn-z','btn-x'];
    const bonusBtns = ['btn-bonus-up','btn-bonus-down'];
    const pauseBtn = document.getElementById('btn-pause');
    
    if (!isGameplay) {
        for (const id of normalBtns) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }
        for (const id of bonusBtns) {
            const el = document.getElementById(id);
            if (el) el.style.display = 'none';
        }
        if (pauseBtn) pauseBtn.style.display = 'none';
    } else {
        for (const id of normalBtns) {
            const el = document.getElementById(id);
            if (el) el.style.display = isBonus ? 'none' : '';
        }
        for (const id of bonusBtns) {
            const el = document.getElementById(id);
            if (el) el.style.display = isBonus ? '' : 'none';
        }
        if (pauseBtn) pauseBtn.style.display = '';
    }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
resizeCanvas();

// ---- GAME LOOP (fixed timestep for consistent speed on all devices) ----
const FIXED_DT = 1000 / 60; // 16.67ms per logic tick (60fps target)
let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    let elapsed = timestamp - lastTime;
    lastTime = timestamp;
    // Clamp large gaps (e.g. tab switch) to avoid spiral of death
    if (elapsed > 200) elapsed = 200;
    accumulator += elapsed;

    while (accumulator >= FIXED_DT) {
        update();
        accumulator -= FIXED_DT;
    }
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// Registrar Service Worker con auto-actualización
if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });
  navigator.serviceWorker.register('sw.js')
    .then(reg => {
      console.log('SW registrado:', reg.scope);
      setInterval(() => reg.update(), 60000);
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('Nueva versión disponible, aplicando...');
            newWorker.postMessage('skipWaiting');
          }
        });
      });
    })
    .catch(err => console.error('SW error:', err));
}
