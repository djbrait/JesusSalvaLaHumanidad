    ctx.fillStyle = '#fff';
    ctx.fillRect(cx + w * 0.2, cy + h * 0.02, w * 0.3, h * 0.26);
    ctx.fillStyle = '#000';
    ctx.fillRect(cx + w * 0.5, cy + h * 0.02, w * 0.3, h * 0.26);

    // Spiky hair
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.2, cy + h * 0.04);
    ctx.lineTo(cx + w * 0.15, cy - h * 0.06);
    ctx.lineTo(cx + w * 0.3, cy + h * 0.02);
    ctx.lineTo(cx + w * 0.28, cy - h * 0.08);
    ctx.lineTo(cx + w * 0.4, cy);
    ctx.lineTo(cx + w * 0.5, cy - h * 0.05);
    ctx.lineTo(cx + w * 0.6, cy);
    ctx.lineTo(cx + w * 0.7, cy - h * 0.07);
    ctx.lineTo(cx + w * 0.8, cy + h * 0.04);
    ctx.lineTo(cx + w * 0.2, cy + h * 0.04);
    ctx.fill();

    // Glasses/visor (angular)
    ctx.fillStyle = '#333';
    ctx.fillRect(cx + w * 0.22, cy + h * 0.08, w * 0.56, h * 0.1);
    // Eye slots
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx + w * 0.28, cy + h * 0.1, w * 0.12, h * 0.06);
    ctx.fillRect(cx + w * 0.58, cy + h * 0.1, w * 0.12, h * 0.06);

    // Grin
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.35, cy + h * 0.22);
    ctx.lineTo(cx + w * 0.65, cy + h * 0.22);
    ctx.lineTo(cx + w * 0.55, cy + h * 0.26);
    ctx.lineTo(cx + w * 0.4, cy + h * 0.26);
    ctx.closePath();
    ctx.fill();

    // Magnet glow when attacking
    if (attacking) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#FF0000';
        ctx.beginPath();
        ctx.arc(cx + w * 0.85, cy + h * 0.45, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0000FF';
        ctx.beginPath();
        ctx.arc(cx + w * 0.15, cy + h * 0.45, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

function drawChicaMasa(x, y, w, h, facing, animFrame, attacking, invincible, isEvil = false, isRunning = false) {
    if (invincible > 0 && Math.floor(invincible / 3) % 2 === 0) return;
    ctx.save();
    ctx.translate(x + w/2, y + h/2);
    if (facing < 0) ctx.scale(-1, 1);
    const cx = -w/2, cy = -h/2;

    // Red cape
    const capeWave = Math.sin(animFrame * 0.15) * 4;
    ctx.fillStyle = '#FF0000';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.25, cy + h * 0.22);
    ctx.quadraticCurveTo(cx - 10 + capeWave, cy + h * 0.55, cx - 6 + capeWave, cy + h * 0.82);
    ctx.lineTo(cx + w * 0.2, cy + h * 0.78);
    ctx.closePath();
    ctx.fill();

    // Red boots
    const legStep = isRunning ? Math.sin(animFrame * 0.3) * 6 : Math.sin(animFrame * 0.15) * 3;
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(cx + w * 0.2, cy + h * 0.85 + legStep, w * 0.2, h * 0.15);
    ctx.fillRect(cx + w * 0.58, cy + h * 0.85 - legStep, w * 0.2, h * 0.15);

    // Yellow legs
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(cx + w * 0.22, cy + h * 0.68 + legStep, w * 0.16, h * 0.18);
    ctx.fillRect(cx + w * 0.6, cy + h * 0.68 - legStep, w * 0.16, h * 0.18);

    // Yellow body
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(cx + w * 0.18, cy + h * 0.3, w * 0.64, h * 0.4);

    // Dark red belt
    ctx.fillStyle = '#8B0000';
    ctx.fillRect(cx + w * 0.18, cy + h * 0.63, w * 0.64, h * 0.05);

    // Red lightning bolt on chest
    ctx.fillStyle = '#FF0000';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.52, cy + h * 0.32);
    ctx.lineTo(cx + w * 0.42, cy + h * 0.48);
    ctx.lineTo(cx + w * 0.52, cy + h * 0.46);
    ctx.lineTo(cx + w * 0.44, cy + h * 0.6);
    ctx.lineTo(cx + w * 0.56, cy + h * 0.44);
    ctx.lineTo(cx + w * 0.48, cy + h * 0.46);
    ctx.closePath();
    ctx.fill();

    // Red collar/neckpiece
    ctx.fillStyle = '#FF0000';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.3, cy + h * 0.28);
    ctx.lineTo(cx + w * 0.5, cy + h * 0.34);
    ctx.lineTo(cx + w * 0.7, cy + h * 0.28);
    ctx.lineTo(cx + w * 0.7, cy + h * 0.32);
    ctx.lineTo(cx + w * 0.5, cy + h * 0.38);
    ctx.lineTo(cx + w * 0.3, cy + h * 0.32);
    ctx.closePath();
    ctx.fill();

    // Arms (yellow with red gloves)
    const armSwing = attacking ? -30 : Math.sin(animFrame * 0.15) * 5;
    // Left arm
    ctx.fillStyle = '#FFD700';
    ctx.save();
    ctx.translate(cx + w * 0.12, cy + h * 0.32);
    ctx.rotate((armSwing - 10) * Math.PI / 180);
    ctx.fillRect(-w * 0.05, 0, w * 0.12, h * 0.22);
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(-w * 0.06, h * 0.18, w * 0.14, h * 0.1);
    ctx.restore();
    // Right arm (stretches when attacking with Z)
    ctx.fillStyle = '#FFD700';
    ctx.save();
    ctx.translate(cx + w * 0.88, cy + h * 0.32);
    ctx.rotate((-armSwing + 10) * Math.PI / 180);
    const armLen = attacking ? h * 0.35 : h * 0.22;
    ctx.fillRect(-w * 0.07, 0, w * 0.12, armLen);
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(-w * 0.08, armLen - h * 0.06, w * 0.14, h * 0.1);
    ctx.restore();

    // Head (blue face)
    ctx.fillStyle = '#1E90FF';
    ctx.beginPath();
    ctx.arc(cx + w * 0.5, cy + h * 0.14, w * 0.26, 0, Math.PI * 2);
    ctx.fill();

    // Orange hair (curly, big)
    ctx.fillStyle = '#FF8C00';
    ctx.beginPath();
    ctx.arc(cx + w * 0.5, cy + h * 0.06, w * 0.3, Math.PI, 0);
    ctx.fill();
    // Side curls
    ctx.beginPath();
    ctx.arc(cx + w * 0.15, cy + h * 0.1, w * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + w * 0.85, cy + h * 0.1, w * 0.12, 0, Math.PI * 2);
    ctx.fill();
    // Top poof
    ctx.beginPath();
    ctx.arc(cx + w * 0.5, cy - h * 0.02, w * 0.22, 0, Math.PI * 2);
    ctx.fill();

    // Red mask/visor
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(cx + w * 0.24, cy + h * 0.08, w * 0.52, h * 0.08);
    // Mask pointy sides
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.24, cy + h * 0.08);
    ctx.lineTo(cx + w * 0.18, cy + h * 0.12);
    ctx.lineTo(cx + w * 0.24, cy + h * 0.16);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.76, cy + h * 0.08);
    ctx.lineTo(cx + w * 0.82, cy + h * 0.12);
    ctx.lineTo(cx + w * 0.76, cy + h * 0.16);
    ctx.fill();

    // Eyes (white in mask)
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx + w * 0.32, cy + h * 0.1, w * 0.12, h * 0.05);
    ctx.fillRect(cx + w * 0.56, cy + h * 0.1, w * 0.12, h * 0.05);

    // Smile
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.35, cy + h * 0.2);
    ctx.quadraticCurveTo(cx + w * 0.5, cy + h * 0.27, cx + w * 0.65, cy + h * 0.2);
    ctx.lineTo(cx + w * 0.65, cy + h * 0.22);
    ctx.quadraticCurveTo(cx + w * 0.5, cy + h * 0.28, cx + w * 0.35, cy + h * 0.22);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawPlayerCharacter(x, y, w, h, facing, animFrame, attacking, invincible, isEvil = false, isRunning = false) {
    if (selectedSkin === 1 && unlockedSkins[1]) {
        drawChicaFugaz(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else if (selectedSkin === 2 && unlockedSkins[2]) {
        drawChicoLuminoso(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else if (selectedSkin === 3 && unlockedSkins[3]) {
        drawChicoInvisible(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else if (selectedSkin === 4 && unlockedSkins[4]) {
        drawMagnate(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else if (selectedSkin === 5 && unlockedSkins[5]) {
        drawChicoGoloso(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else if (selectedSkin === 6 && unlockedSkins[6]) {
        drawChicoIman(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else if (selectedSkin === 7 && unlockedSkins[7]) {
        drawChicaMasa(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    } else {
        drawChicoEstrella(x, y, w, h, facing, animFrame, attacking, invincible, isEvil, isRunning);
    }
}

function drawMocuson(b) {
    if (b.invincible > 0 && Math.floor(b.invincible / 3) % 2 === 0) return;
    const x = b.x - camera.x, y = b.y;
    const wobble = Math.sin(b.animTimer * 0.08) * 3;
    const W = b.w, H = b.h;
    const cx = x + W / 2;

    ctx.save();

    // -- Outline helper --
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;

    // -- Main body: ghost/slime shape widening toward bottom --
    ctx.fillStyle = '#a0e020';
    ctx.beginPath();
    // Head top (narrow, rounded)
    ctx.moveTo(cx - W * 0.22, y + H * 0.05);
    ctx.quadraticCurveTo(cx, y - H * 0.08, cx + W * 0.22, y + H * 0.05);
    // Right side widens
    ctx.quadraticCurveTo(cx + W * 0.35, y + H * 0.25, cx + W * 0.30, y + H * 0.38);
    // Right arm stub
    ctx.lineTo(cx + W * 0.65 + wobble, y + H * 0.32);
    ctx.quadraticCurveTo(cx + W * 0.72, y + H * 0.34, cx + W * 0.68, y + H * 0.40);
    ctx.lineTo(cx + W * 0.38, y + H * 0.45);
    // Right side down to base
    ctx.quadraticCurveTo(cx + W * 0.55, y + H * 0.65, cx + W * 0.58 + wobble, y + H);
    // Wavy bottom edge
    ctx.quadraticCurveTo(cx + W * 0.3, y + H * 0.95, cx, y + H + wobble);
    ctx.quadraticCurveTo(cx - W * 0.3, y + H * 0.95, cx - W * 0.58 - wobble, y + H);
    // Left side up
    ctx.quadraticCurveTo(cx - W * 0.55, y + H * 0.65, cx - W * 0.38, y + H * 0.45);
    // Left arm stub
    ctx.lineTo(cx - W * 0.68, y + H * 0.40);
    ctx.quadraticCurveTo(cx - W * 0.72, y + H * 0.34, cx - W * 0.65 - wobble, y + H * 0.32);
    ctx.lineTo(cx - W * 0.30, y + H * 0.38);
    ctx.quadraticCurveTo(cx - W * 0.35, y + H * 0.25, cx - W * 0.22, y + H * 0.05);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Lighter slime highlight
    ctx.fillStyle = '#b8f030';
    ctx.beginPath();
    ctx.ellipse(cx - W * 0.08, y + H * 0.35, W * 0.18, H * 0.20, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // -- Angry yellow eyes (slanted) --
    // Left eye
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.22, y + H * 0.18);
    ctx.quadraticCurveTo(cx - W * 0.13, y + H * 0.13, cx - W * 0.05, y + H * 0.20);
    ctx.quadraticCurveTo(cx - W * 0.13, y + H * 0.28, cx - W * 0.22, y + H * 0.22);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Right eye
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.22, y + H * 0.18);
    ctx.quadraticCurveTo(cx + W * 0.13, y + H * 0.13, cx + W * 0.05, y + H * 0.20);
    ctx.quadraticCurveTo(cx + W * 0.13, y + H * 0.28, cx + W * 0.22, y + H * 0.22);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // -- Big frowning yellow mouth --
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.22, y + H * 0.42);
    ctx.quadraticCurveTo(cx, y + H * 0.34, cx + W * 0.22, y + H * 0.42);
    ctx.quadraticCurveTo(cx, y + H * 0.48, cx - W * 0.22, y + H * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

function drawRomecio(b) {
    if (b.invincible > 0 && Math.floor(b.invincible / 3) % 2 === 0) return;
    const x = b.x - camera.x, y = b.y;
    const wave = Math.sin(b.animTimer * 0.06) * 4;
    const W = b.w, H = b.h;
    const cx = x + W / 2;

    ctx.save();
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;

    // -- Main t-shirt body (purple, slightly trapezoidal) --
    ctx.fillStyle = '#9C27B0';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.32, y + H * 0.12);  // top-left shoulder
    ctx.lineTo(cx + W * 0.32, y + H * 0.12);  // top-right shoulder
    ctx.lineTo(cx + W * 0.42, y + H);           // bottom-right
    ctx.lineTo(cx - W * 0.42, y + H);           // bottom-left
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Collar (dark purple neckline)
    ctx.fillStyle = '#4A148C';
    ctx.beginPath();
    ctx.ellipse(cx, y + H * 0.10, W * 0.12, H * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // -- Left sleeve (manga larga, curving down) --
    ctx.fillStyle = '#9C27B0';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.32, y + H * 0.12);
    ctx.quadraticCurveTo(cx - W * 0.65, y + H * 0.08 + wave * 0.5, cx - W * 0.72, y + H * 0.30);
    ctx.quadraticCurveTo(cx - W * 0.78, y + H * 0.42, cx - W * 0.65, y + H * 0.52 + wave);
    ctx.lineTo(cx - W * 0.58, y + H * 0.48 + wave);
    ctx.quadraticCurveTo(cx - W * 0.65, y + H * 0.38, cx - W * 0.60, y + H * 0.28);
    ctx.quadraticCurveTo(cx - W * 0.50, y + H * 0.18, cx - W * 0.32, y + H * 0.22);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // -- Right sleeve --
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.32, y + H * 0.12);
    ctx.quadraticCurveTo(cx + W * 0.65, y + H * 0.08 - wave * 0.5, cx + W * 0.72, y + H * 0.30);
    ctx.quadraticCurveTo(cx + W * 0.78, y + H * 0.42, cx + W * 0.65, y + H * 0.52 - wave);
    ctx.lineTo(cx + W * 0.58, y + H * 0.48 - wave);
    ctx.quadraticCurveTo(cx + W * 0.65, y + H * 0.38, cx + W * 0.60, y + H * 0.28);
    ctx.quadraticCurveTo(cx + W * 0.50, y + H * 0.18, cx + W * 0.32, y + H * 0.22);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // -- Green stains/patches --
    ctx.fillStyle = '#388E3C';
    // Stain on left chest area
    ctx.beginPath();
    ctx.ellipse(cx - W * 0.18, y + H * 0.30, W * 0.10, H * 0.07, 0.3, 0, Math.PI * 2);
    ctx.fill();
    // Stain on right side mid
    ctx.beginPath();
    ctx.ellipse(cx + W * 0.22, y + H * 0.50, W * 0.11, H * 0.08, -0.2, 0, Math.PI * 2);
    ctx.fill();
    // Stain on lower left
    ctx.beginPath();
    ctx.ellipse(cx - W * 0.15, y + H * 0.72, W * 0.12, H * 0.09, 0.1, 0, Math.PI * 2);
    ctx.fill();
    // Stain on lower right
    ctx.beginPath();
    ctx.ellipse(cx + W * 0.18, y + H * 0.80, W * 0.10, H * 0.07, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // Stain on left sleeve
    ctx.beginPath();
    ctx.ellipse(cx - W * 0.62, y + H * 0.44 + wave, W * 0.06, H * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    // Stain on right sleeve
    ctx.beginPath();
    ctx.ellipse(cx + W * 0.62, y + H * 0.44 - wave, W * 0.06, H * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();

    // -- Angry triangular eyes (beige/cream with red pupils) --
    // Left eye
    ctx.fillStyle = '#F5F0DC';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.22, y + H * 0.22);
    ctx.lineTo(cx - W * 0.08, y + H * 0.18);
    ctx.lineTo(cx - W * 0.10, y + H * 0.30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Left red pupil (vertical slit)
    ctx.strokeStyle = '#cc0000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.14, y + H * 0.21);
    ctx.lineTo(cx - W * 0.14, y + H * 0.28);
    ctx.stroke();

    // Right eye
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;
    ctx.fillStyle = '#F5F0DC';
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.22, y + H * 0.22);
    ctx.lineTo(cx + W * 0.08, y + H * 0.18);
    ctx.lineTo(cx + W * 0.10, y + H * 0.30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Right red pupil
    ctx.strokeStyle = '#cc0000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.14, y + H * 0.21);
    ctx.lineTo(cx + W * 0.14, y + H * 0.28);
    ctx.stroke();

    // -- Mouth with sharp teeth --
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;
    // Dark mouth opening
    ctx.fillStyle = '#2a0030';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.16, y + H * 0.38);
    ctx.quadraticCurveTo(cx, y + H * 0.48, cx + W * 0.16, y + H * 0.38);
    ctx.quadraticCurveTo(cx, y + H * 0.44, cx - W * 0.16, y + H * 0.38);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Sharp teeth (top row, pointing down)
    ctx.fillStyle = '#F5F0DC';
    const teethCount = 5;
    const mouthLeft = cx - W * 0.14;
    const mouthRight = cx + W * 0.14;
    const mouthW = mouthRight - mouthLeft;
    for (let i = 0; i < teethCount; i++) {
        const tx = mouthLeft + (mouthW / teethCount) * i;
        const tw = mouthW / teethCount;
        ctx.beginPath();
        ctx.moveTo(tx, y + H * 0.38);
        ctx.lineTo(tx + tw, y + H * 0.38);
        ctx.lineTo(tx + tw / 2, y + H * 0.43);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawCambiaFormas(b) {
    if (b.invincible > 0 && Math.floor(b.invincible / 3) % 2 === 0) return;
    const x = b.x - camera.x, y = b.y;
    const W = b.w, H = b.h;
    const cx = x + W / 2;
    const facing = player.x < b.x ? -1 : 1;
    const anim = b.animTimer;

    ctx.save();
    ctx.translate(cx, y + H / 2);
    if (facing < 0) ctx.scale(-1, 1);
    const lx = -W / 2, ly = -H / 2;

    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;

    // -- Orange cape (behind body) --
    ctx.fillStyle = '#FF8C00';
    ctx.beginPath();
    const capeWave = Math.sin(anim * 0.12) * 4;
    ctx.moveTo(lx + W * 0.30, ly + H * 0.28);
    ctx.quadraticCurveTo(lx - 10 + capeWave, ly + H * 0.55, lx - 6 + capeWave, ly + H * 0.80);
    ctx.lineTo(lx + W * 0.20, ly + H * 0.75);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // -- Legs (blue suit) --
    ctx.fillStyle = '#2850CC';
    // Left leg
    ctx.fillRect(lx + W * 0.24, ly + H * 0.65, W * 0.22, H * 0.22);
    // Right leg
    ctx.fillRect(lx + W * 0.54, ly + H * 0.65, W * 0.22, H * 0.22);

    // -- Orange boots --
    ctx.fillStyle = '#FF8C00';
    ctx.fillRect(lx + W * 0.20, ly + H * 0.84, W * 0.28, H * 0.16);
    ctx.fillRect(lx + W * 0.52, ly + H * 0.84, W * 0.28, H * 0.16);
    ctx.strokeRect(lx + W * 0.20, ly + H * 0.84, W * 0.28, H * 0.16);
    ctx.strokeRect(lx + W * 0.52, ly + H * 0.84, W * 0.28, H * 0.16);

    // -- Body (blue suit torso) --
    ctx.fillStyle = '#2850CC';
    ctx.fillRect(lx + W * 0.20, ly + H * 0.30, W * 0.60, H * 0.38);
    ctx.strokeRect(lx + W * 0.20, ly + H * 0.30, W * 0.60, H * 0.38);

    // -- Orange star on chest --
    ctx.fillStyle = '#FF8C00';
    drawStar(lx + W * 0.50, ly + H * 0.46, W * 0.17, W * 0.08, 5);

    // -- Orange belt --
    ctx.fillStyle = '#FF8C00';
    ctx.fillRect(lx + W * 0.18, ly + H * 0.62, W * 0.64, H * 0.06);
    ctx.strokeRect(lx + W * 0.18, ly + H * 0.62, W * 0.64, H * 0.06);
    // Belt buckle (star circle)
    ctx.fillStyle = '#CC7000';
    ctx.beginPath();
    ctx.arc(lx + W * 0.50, ly + H * 0.65, W * 0.06, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#FF8C00';
    drawStar(lx + W * 0.50, ly + H * 0.65, W * 0.04, W * 0.02, 5);

    // -- Arms (blue) --
    ctx.fillStyle = '#2850CC';
    const armAngle = Math.sin(anim * 0.12) * 0.25;
    // Right arm
    ctx.save();
    ctx.translate(lx + W * 0.78, ly + H * 0.35);
    ctx.rotate(armAngle);
    ctx.fillRect(0, -3, W * 0.22, H * 0.08);
    ctx.strokeRect(0, -3, W * 0.22, H * 0.08);
    // Orange glove
    ctx.fillStyle = '#FF8C00';
    ctx.fillRect(W * 0.18, -4, W * 0.10, H * 0.10);
    ctx.restore();

    // Left arm
    ctx.fillStyle = '#2850CC';
    ctx.save();
    ctx.translate(lx + W * 0.22, ly + H * 0.35);
    ctx.rotate(-armAngle);
    ctx.fillRect(-W * 0.22, -3, W * 0.22, H * 0.08);
    ctx.strokeRect(-W * 0.22, -3, W * 0.22, H * 0.08);
    // Orange glove
    ctx.fillStyle = '#FF8C00';
    ctx.fillRect(-W * 0.22 - W * 0.04, -4, W * 0.10, H * 0.10);
    ctx.restore();

    // -- Head (blue-gray skin, square-ish) --
    ctx.fillStyle = '#6B82A8';
    ctx.fillRect(lx + W * 0.28, ly, W * 0.44, H * 0.30);
    ctx.strokeRect(lx + W * 0.28, ly, W * 0.44, H * 0.30);

    // -- Brown spiky hair (3 spikes on top) --
    ctx.fillStyle = '#8B5E3C';
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.32, ly + H * 0.02);
    ctx.lineTo(lx + W * 0.36, ly - H * 0.10);
    ctx.lineTo(lx + W * 0.42, ly + H * 0.02);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.42, ly + H * 0.01);
    ctx.lineTo(lx + W * 0.50, ly - H * 0.14);
    ctx.lineTo(lx + W * 0.58, ly + H * 0.01);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.58, ly + H * 0.02);
    ctx.lineTo(lx + W * 0.64, ly - H * 0.10);
    ctx.lineTo(lx + W * 0.68, ly + H * 0.02);
    ctx.closePath();
    ctx.fill();

    // -- Blue visor (wide rectangle across eyes with ear spikes) --
    ctx.fillStyle = '#2850CC';
    ctx.fillRect(lx + W * 0.24, ly + H * 0.08, W * 0.52, H * 0.10);
    ctx.strokeRect(lx + W * 0.24, ly + H * 0.08, W * 0.52, H * 0.10);
    // Visor white eye slits
    ctx.fillStyle = '#fff';
    ctx.fillRect(lx + W * 0.38, ly + H * 0.10, W * 0.04, H * 0.06);
    ctx.fillRect(lx + W * 0.58, ly + H * 0.10, W * 0.04, H * 0.06);
    // Ear spikes (small triangles on visor sides)
    ctx.fillStyle = '#aab8cc';
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.24, ly + H * 0.10);
    ctx.lineTo(lx + W * 0.18, ly + H * 0.06);
    ctx.lineTo(lx + W * 0.24, ly + H * 0.16);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.76, ly + H * 0.10);
    ctx.lineTo(lx + W * 0.82, ly + H * 0.06);
    ctx.lineTo(lx + W * 0.76, ly + H * 0.16);
    ctx.closePath();
    ctx.fill();

    // -- Wide grin (white teeth showing) --
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(lx + W * 0.35, ly + H * 0.22);
    ctx.quadraticCurveTo(lx + W * 0.50, ly + H * 0.30, lx + W * 0.65, ly + H * 0.22);
    ctx.lineTo(lx + W * 0.65, ly + H * 0.24);
    ctx.quadraticCurveTo(lx + W * 0.50, ly + H * 0.28, lx + W * 0.35, ly + H * 0.24);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // -- Glowing aura --
    const glow = Math.sin(anim * 0.1) * 0.2 + 0.25;
    ctx.globalAlpha = glow;
    ctx.strokeStyle = '#FF4500';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, W * 0.75, H * 0.65, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.restore();
}

function drawMonstruoCama(b) {
    if (b.invincible > 0 && Math.floor(b.invincible / 3) % 2 === 0) return;
    const x = b.x - camera.x, y = b.y;
    const W = b.w, H = b.h;
    const cx = x + W / 2;
    const wobble = Math.sin(b.animTimer * 0.07) * 3;

    ctx.save();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;

    // Ghost body - widens at bottom with wavy edge
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.25, y + H * 0.15);
    ctx.quadraticCurveTo(cx, y - H * 0.05, cx + W * 0.25, y + H * 0.15);
    ctx.lineTo(cx + W * 0.45, y + H * 0.7);
    ctx.quadraticCurveTo(cx + W * 0.35, y + H * 0.9 + wobble, cx + W * 0.2, y + H);
    ctx.quadraticCurveTo(cx + W * 0.1, y + H * 0.92 - wobble, cx, y + H);
    ctx.quadraticCurveTo(cx - W * 0.1, y + H * 0.92 + wobble, cx - W * 0.2, y + H);
    ctx.quadraticCurveTo(cx - W * 0.35, y + H * 0.9 - wobble, cx - W * 0.45, y + H * 0.7);
    ctx.closePath();
    ctx.fill();

    // Devil horns
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.2, y + H * 0.18);
    ctx.quadraticCurveTo(cx - W * 0.35, y - H * 0.1, cx - W * 0.4, y - H * 0.05);
    ctx.quadraticCurveTo(cx - W * 0.25, y + H * 0.05, cx - W * 0.15, y + H * 0.2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.2, y + H * 0.18);
    ctx.quadraticCurveTo(cx + W * 0.35, y - H * 0.1, cx + W * 0.4, y - H * 0.05);
    ctx.quadraticCurveTo(cx + W * 0.25, y + H * 0.05, cx + W * 0.15, y + H * 0.2);
    ctx.closePath();
    ctx.fill();

    // Clawed hands
    ctx.fillStyle = '#222';
    // Left claw
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.45, y + H * 0.45);
    ctx.lineTo(cx - W * 0.65 + wobble, y + H * 0.4);
    ctx.lineTo(cx - W * 0.6, y + H * 0.35);
    ctx.lineTo(cx - W * 0.7 + wobble, y + H * 0.38);
    ctx.lineTo(cx - W * 0.55, y + H * 0.5);
    ctx.closePath();
    ctx.fill();
    // Right claw
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.45, y + H * 0.45);
    ctx.lineTo(cx + W * 0.65 - wobble, y + H * 0.4);
    ctx.lineTo(cx + W * 0.6, y + H * 0.35);
    ctx.lineTo(cx + W * 0.7 - wobble, y + H * 0.38);
    ctx.lineTo(cx + W * 0.55, y + H * 0.5);
    ctx.closePath();
    ctx.fill();

    // Yellow glowing eyes - angry triangular
    ctx.fillStyle = '#FFD700';
    // Left eye
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.22, y + H * 0.28);
    ctx.lineTo(cx - W * 0.08, y + H * 0.22);
    ctx.lineTo(cx - W * 0.08, y + H * 0.34);
    ctx.closePath();
    ctx.fill();
    // Right eye
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.22, y + H * 0.28);
    ctx.lineTo(cx + W * 0.08, y + H * 0.22);
    ctx.lineTo(cx + W * 0.08, y + H * 0.34);
    ctx.closePath();
    ctx.fill();

    // Glow effect around eyes
    ctx.globalAlpha = 0.3 + Math.sin(b.animTimer * 0.1) * 0.15;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(cx - W * 0.14, y + H * 0.28, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + W * 0.14, y + H * 0.28, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Jagged teeth mouth
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.2, y + H * 0.48);
    ctx.lineTo(cx - W * 0.12, y + H * 0.55);
    ctx.lineTo(cx - W * 0.05, y + H * 0.48);
    ctx.lineTo(cx + W * 0.05, y + H * 0.55);
    ctx.lineTo(cx + W * 0.12, y + H * 0.48);
    ctx.lineTo(cx + W * 0.2, y + H * 0.55);
    ctx.lineTo(cx + W * 0.2, y + H * 0.48);
    ctx.quadraticCurveTo(cx, y + H * 0.42, cx - W * 0.2, y + H * 0.48);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawMaelado(b) {
    if (b.invincible > 0 && Math.floor(b.invincible / 3) % 2 === 0) return;
    const x = b.x - camera.x, y = b.y;
    const W = b.w, H = b.h;
    const cx = x + W / 2;
    const wobble = Math.sin(b.animTimer * 0.06) * 2;

    ctx.save();
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;

    // Legs
    // Left leg (light blue)
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(cx - W * 0.25, y + H * 0.72, W * 0.18, H * 0.2);
    // Right leg (pink)
    ctx.fillStyle = '#FFB6C1';
    ctx.fillRect(cx + W * 0.07, y + H * 0.72, W * 0.18, H * 0.2);
    // Boots (brown waffle)
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(cx - W * 0.28, y + H * 0.88, W * 0.24, H * 0.12);
    ctx.fillRect(cx + W * 0.04, y + H * 0.88, W * 0.24, H * 0.12);

    // Waffle cone body (trapezoid)
    ctx.fillStyle = '#D2A050';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.2, y + H * 0.28);
    ctx.lineTo(cx + W * 0.2, y + H * 0.28);
    ctx.lineTo(cx + W * 0.35, y + H * 0.75);
    ctx.lineTo(cx - W * 0.35, y + H * 0.75);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Crosshatch pattern on cone
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
        const yy = y + H * 0.32 + i * H * 0.085;
        ctx.beginPath();
        ctx.moveTo(cx - W * 0.3 + i * 2, yy);
        ctx.lineTo(cx + W * 0.3 - i * 2, yy);
        ctx.stroke();
    }
    for (let i = 0; i < 4; i++) {
        const xx = cx - W * 0.2 + i * W * 0.13;
        ctx.beginPath();
        ctx.moveTo(xx, y + H * 0.3);
        ctx.lineTo(xx + (i % 2 === 0 ? 5 : -5), y + H * 0.7);
        ctx.stroke();
    }

    // Arms (waffle texture)
    ctx.fillStyle = '#D2A050';
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    // Left arm
    ctx.fillRect(cx - W * 0.55, y + H * 0.38 + wobble, W * 0.22, H * 0.08);
    ctx.strokeRect(cx - W * 0.55, y + H * 0.38 + wobble, W * 0.22, H * 0.08);
    // Right arm
    ctx.fillRect(cx + W * 0.33, y + H * 0.38 - wobble, W * 0.22, H * 0.08);
    ctx.strokeRect(cx + W * 0.33, y + H * 0.38 - wobble, W * 0.22, H * 0.08);
    // Hands (brown)
    ctx.fillStyle = '#8B6914';
    ctx.beginPath(); ctx.arc(cx - W * 0.58, y + H * 0.42 + wobble, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + W * 0.58, y + H * 0.42 - wobble, 6, 0, Math.PI * 2); ctx.fill();

    // Ice cream scoop head (white)
    ctx.fillStyle = '#FFFAFA';
    ctx.beginPath();
    ctx.arc(cx, y + H * 0.2, W * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ccc';
    ctx.stroke();
    // Swirl on ice cream
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, y + H * 0.2, W * 0.12, 0, Math.PI * 1.5);
    ctx.stroke();

    // Cherry on top
    ctx.fillStyle = '#FF0000';
    ctx.beginPath();
    ctx.arc(cx, y + H * 0.05, 6, 0, Math.PI * 2);
    ctx.fill();
    // Cherry stem
    ctx.strokeStyle = '#228B22';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, y + H * 0.02);
    ctx.quadraticCurveTo(cx + 5, y - H * 0.02, cx + 3, y - H * 0.04);
    ctx.stroke();

    // Angry eyes (yellow)
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(cx - W * 0.12, y + H * 0.18, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + W * 0.12, y + H * 0.18, 5, 0, Math.PI * 2); ctx.fill();
    // Pupils
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx - W * 0.12, y + H * 0.19, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + W * 0.12, y + H * 0.19, 2, 0, Math.PI * 2); ctx.fill();
    // Angry brows
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - W * 0.2, y + H * 0.13); ctx.lineTo(cx - W * 0.06, y + H * 0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + W * 0.2, y + H * 0.13); ctx.lineTo(cx + W * 0.06, y + H * 0.15); ctx.stroke();

    // Red open mouth
    ctx.fillStyle = '#CC0000';
    ctx.beginPath();
    ctx.ellipse(cx, y + H * 0.26, W * 0.1, H * 0.04, 0, 0, Math.PI);
    ctx.fill();

    ctx.restore();
}

function drawTimbroso(b) {
    if (b.invincible > 0 && Math.floor(b.invincible / 3) % 2 === 0) return;
    const x = b.x - camera.x, y = b.y;
    const W = b.w, H = b.h;
    const cx = x + W / 2;
    const bounce = Math.sin(b.animTimer * 0.1) * 3;

    ctx.save();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;

    // Spring/coil legs (zigzag)
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    // Left leg
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - W * 0.2, y + H * 0.7 + i * H * 0.06);
        ctx.lineTo(cx - W * 0.12, y + H * 0.73 + i * H * 0.06);
        ctx.lineTo(cx - W * 0.2, y + H * 0.76 + i * H * 0.06);
        ctx.stroke();
    }
    // Right leg
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + W * 0.2, y + H * 0.7 + i * H * 0.06);
        ctx.lineTo(cx + W * 0.12, y + H * 0.73 + i * H * 0.06);
        ctx.lineTo(cx + W * 0.2, y + H * 0.76 + i * H * 0.06);
        ctx.stroke();
    }

    // Yellow shoes
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(cx - W * 0.28, y + H * 0.92, W * 0.2, H * 0.08);
    ctx.fillRect(cx + W * 0.08, y + H * 0.92, W * 0.2, H * 0.08);

    // Brown box body (trapezoid)
    ctx.fillStyle = '#8B6914';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.3, y + H * 0.38);
    ctx.lineTo(cx + W * 0.3, y + H * 0.38);
    ctx.lineTo(cx + W * 0.35, y + H * 0.7);
    ctx.lineTo(cx - W * 0.35, y + H * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5a3a1a';
    ctx.stroke();
    // Emblem: 3 yellow dots
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(cx - 8, y + H * 0.54, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, y + H * 0.54, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 8, y + H * 0.54, 3, 0, Math.PI * 2); ctx.fill();

    // Wire/coil arms
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    // Left arm coil
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.3, y + H * 0.45);
    for (let i = 0; i < 3; i++) {
        ctx.lineTo(cx - W * 0.4 - i * 4, y + H * 0.43 + i * 6);
        ctx.lineTo(cx - W * 0.35 - i * 4, y + H * 0.46 + i * 6);
    }
    ctx.stroke();
    // Right arm coil
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.3, y + H * 0.45);
    for (let i = 0; i < 3; i++) {
        ctx.lineTo(cx + W * 0.4 + i * 4, y + H * 0.43 + i * 6);
        ctx.lineTo(cx + W * 0.35 + i * 4, y + H * 0.46 + i * 6);
    }
    ctx.stroke();
    // Yellow ball hands
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(cx - W * 0.52, y + H * 0.58, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + W * 0.52, y + H * 0.58, 6, 0, Math.PI * 2); ctx.fill();

    // Yellow bell-shaped head
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.25, y + H * 0.38);
    ctx.quadraticCurveTo(cx - W * 0.35, y + H * 0.18, cx - W * 0.15, y + H * 0.05);
    ctx.quadraticCurveTo(cx, y - H * 0.02 + bounce, cx + W * 0.15, y + H * 0.05);
    ctx.quadraticCurveTo(cx + W * 0.35, y + H * 0.18, cx + W * 0.25, y + H * 0.38);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#B8860B';
    ctx.stroke();

    // 6 angry eyes (3 pairs vertically)
    ctx.fillStyle = '#800000';
    const eyeXL = cx - W * 0.1, eyeXR = cx + W * 0.1;
    for (let i = 0; i < 3; i++) {
        const eyeY = y + H * 0.12 + i * H * 0.07;
        ctx.beginPath(); ctx.arc(eyeXL, eyeY, 3 - i * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(eyeXR, eyeY, 3 - i * 0.5, 0, Math.PI * 2); ctx.fill();
    }

    // Brown X-stitched nose/mouth
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 5, y + H * 0.3);
    ctx.lineTo(cx + 5, y + H * 0.36);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 5, y + H * 0.3);
    ctx.lineTo(cx - 5, y + H * 0.36);
    ctx.stroke();

    ctx.restore();
}

function drawEnemy(e) {
    if (!e.alive) return;
    const x = e.x - camera.x, y = e.y;
    
    if (e.type === 'slime' || e.type === 'toxic' || e.type === 'shadow') {
        const color = e.type === 'slime' ? '#4CAF50' : e.type === 'toxic' ? '#76ff03' : '#5C005C';
        const eyeColor = e.type === 'shadow' ? '#ff0000' : '#fff';
        const bounce = Math.abs(Math.sin(e.animTimer * 0.1)) * 5;
        
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x + e.w/2, y + e.h - bounce/2, e.w/2, e.h/2 + bounce/2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = eyeColor;
        ctx.beginPath(); ctx.arc(x + e.w * 0.3, y + e.h * 0.4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + e.w * 0.7, y + e.h * 0.4, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x + e.w * 0.3, y + e.h * 0.42, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + e.w * 0.7, y + e.h * 0.42, 2, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'bat') {
        const wingFlap = Math.sin(e.animTimer * 0.2) * 0.5;
        ctx.fillStyle = '#333';
        // Body
        ctx.beginPath();
        ctx.ellipse(x + e.w/2, y + e.h/2, 8, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // Wings
        ctx.save();
        ctx.translate(x + e.w/2 - 8, y + e.h/2);
        ctx.rotate(wingFlap);
        ctx.fillRect(-15, -3, 15, 8);
        ctx.restore();
        ctx.save();
        ctx.translate(x + e.w/2 + 8, y + e.h/2);
        ctx.rotate(-wingFlap);
        ctx.fillRect(0, -3, 15, 8);
        ctx.restore();
        // Eyes
        ctx.fillStyle = '#ff0';
        ctx.beginPath(); ctx.arc(x + e.w * 0.35, y + e.h * 0.35, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + e.w * 0.65, y + e.h * 0.35, 3, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'shirt') {
        // Remera sucia poseída - dirty possessed t-shirt
        const sway = Math.sin(e.animTimer * 0.08) * 3;
        const hover = Math.sin(e.animTimer * 0.12) * 2;
        
        // T-shirt body
        ctx.fillStyle = '#6a4c93';
        ctx.fillRect(x + 4, y + 8 + hover, 22, 20);
        
        // Sleeves
        ctx.fillRect(x - 4, y + 8 + hover, 10, 12);
        ctx.fillRect(x + 24, y + 8 + hover, 10, 12);
        
        // Collar
        ctx.fillStyle = '#5a3c83';
        ctx.beginPath();
        ctx.arc(x + 15, y + 8 + hover, 6, Math.PI, 0);
        ctx.fill();
        
        // Dirt stains
        ctx.fillStyle = '#3d2a1a';
        ctx.beginPath(); ctx.arc(x + 10, y + 18 + hover, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 22, y + 22 + hover, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#4a3520';
        ctx.beginPath(); ctx.arc(x + 17, y + 24 + hover, 2, 0, Math.PI * 2); ctx.fill();
        
        // Evil glowing eyes on the chest
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(x + 10 + sway * 0.3, y + 15 + hover, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 20 + sway * 0.3, y + 15 + hover, 3, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        
        // Evil mouth
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x + 15, y + 21 + hover, 4, 0.1, Math.PI - 0.1);
        ctx.stroke();
    } else if (e.type === 'ghost') {
        // Fantasma
        const float = Math.sin(e.animTimer * 0.06) * 4;
        const alpha = 0.6 + Math.sin(e.animTimer * 0.04) * 0.2;
        
        ctx.save();
        ctx.globalAlpha = alpha;
        
        // Ghost body
        ctx.fillStyle = '#d0d8e8';
        ctx.beginPath();
        ctx.arc(x + e.w/2, y + 6 + float, 13, Math.PI, 0);
        ctx.lineTo(x + e.w/2 + 13, y + 22 + float);
        // Wavy bottom
        for (let i = 0; i < 5; i++) {
            const wx = x + e.w/2 + 13 - i * 6.5;
            const wy = y + 22 + float + (i % 2 === 0 ? 5 : 0);
            ctx.lineTo(wx, wy);
        }
        ctx.closePath();
        ctx.fill();
        
        // Glow
        ctx.shadowColor = '#aabbff';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#c8d0e0';
        ctx.beginPath();
        ctx.arc(x + e.w/2, y + 8 + float, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Dark hollow eyes
        ctx.fillStyle = '#1a1a3a';
        ctx.beginPath(); ctx.ellipse(x + e.w * 0.35, y + 8 + float, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + e.w * 0.65, y + 8 + float, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
        
        // Glowing pupils
        ctx.fillStyle = '#00ffff';
        ctx.beginPath(); ctx.arc(x + e.w * 0.35, y + 9 + float, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + e.w * 0.65, y + 9 + float, 1.5, 0, Math.PI * 2); ctx.fill();
        
        // Open mouth
        ctx.fillStyle = '#1a1a3a';
        ctx.beginPath();
        ctx.ellipse(x + e.w/2, y + 16 + float, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    } else if (e.type === 'evilice') {
        // Helado malvado
        const wobble = Math.sin(e.animTimer * 0.1) * 2;
        
        // Cone (waffle)
        ctx.fillStyle = '#D2A048';
        ctx.beginPath();
        ctx.moveTo(x + e.w/2 - 10, y + 14);
        ctx.lineTo(x + e.w/2 + 10, y + 14);
        ctx.lineTo(x + e.w/2, y + e.h);
        ctx.closePath();
        ctx.fill();
        // Waffle pattern
        ctx.strokeStyle = '#B8862D';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x + e.w/2 - 6, y + 18); ctx.lineTo(x + e.w/2 + 6, y + 18);
        ctx.moveTo(x + e.w/2 - 4, y + 24); ctx.lineTo(x + e.w/2 + 4, y + 24);
        ctx.stroke();
        
        // Ice cream scoop
        const scoopColor = ['#FF69B4', '#88DDFF', '#90EE90', '#FFA500'][Math.floor(e.startX / 300) % 4];
        ctx.fillStyle = scoopColor;
        ctx.beginPath();
        ctx.arc(x + e.w/2 + wobble, y + 10, 12, 0, Math.PI * 2);
        ctx.fill();
        
        // Dripping
        ctx.fillStyle = scoopColor;
        ctx.beginPath();
        ctx.ellipse(x + e.w/2 - 6, y + 16, 2, 4 + Math.sin(e.animTimer * 0.15) * 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + e.w/2 + 7, y + 18, 2, 3 + Math.sin(e.animTimer * 0.12) * 2, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Evil eyes
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 4;
        ctx.beginPath(); ctx.arc(x + e.w/2 - 4 + wobble, y + 8, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + e.w/2 + 4 + wobble, y + 8, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        
        // Evil grin
        ctx.strokeStyle = '#880000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x + e.w/2 + wobble, y + 12, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();
        // Teeth
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + e.w/2 - 3 + wobble, y + 12, 2, 2);
        ctx.fillRect(x + e.w/2 + 1 + wobble, y + 12, 2, 2);
    } else if (e.type === 'note') {
        // Nota musical malvada
        const float = Math.sin(e.animTimer * 0.07) * 3;
        const pulse = 1 + Math.sin(e.animTimer * 0.1) * 0.1;
        const noteColors = ['#FF4444', '#FF8800', '#FFDD00', '#44FF44', '#4488FF', '#AA44FF'];
        const noteColor = noteColors[Math.floor(e.startX / 250) % noteColors.length];
        
        ctx.save();
        ctx.translate(x + e.w/2, y + e.h/2 + float);
        ctx.scale(pulse, pulse);
        
        // Note head (filled oval)
        ctx.fillStyle = noteColor;
        ctx.beginPath();
        ctx.ellipse(-2, 4, 6, 4.5, -0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // Stem
        ctx.strokeStyle = noteColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(3, 4);
        ctx.lineTo(3, -12);
        ctx.stroke();
        
        // Flag
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(3, -12);
        ctx.quadraticCurveTo(10, -8, 6, -4);
        ctx.stroke();
        
        // Evil face on the note head
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(-4, 3, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 3, 1.5, 0, Math.PI * 2); ctx.fill();
        // Angry eyebrows
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-6, 0.5); ctx.lineTo(-3, 1.5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(2, 1.5); ctx.lineTo(5, 0.5); ctx.stroke();
        // Evil grin
        ctx.beginPath();
        ctx.arc(-2, 6, 3, 0.1, Math.PI - 0.1);
        ctx.stroke();
        
        // Glow effect
        ctx.shadowColor = noteColor;
        ctx.shadowBlur = 8;
        ctx.strokeStyle = noteColor;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.ellipse(-2, 4, 8, 6, -0.3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        ctx.restore();
    }
}

function drawCoin(c) {
    if (c.collected) return;
    const x = c.x - camera.x;
    const bob = Math.sin(c.animTimer * 0.08) * 4;
    const stretch = 0.5 + Math.abs(Math.cos(c.animTimer * 0.05)) * 0.5;
    
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.ellipse(x, c.y + bob, 8 * stretch, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFA000';
    ctx.beginPath();
    ctx.ellipse(x, c.y + bob, 4 * stretch, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Star shape inside
    ctx.fillStyle = '#FFF9C4';
    ctx.save();
    ctx.translate(x, c.y + bob);
    ctx.scale(stretch, 1);
    drawStar(0, 0, 4, 2, 5);
    ctx.restore();
}

function drawProjectile(p) {
    const x = p.x - camera.x;
    if (p.type === 'snot') {
        ctx.fillStyle = '#66BB6A';
        ctx.beginPath();
        ctx.ellipse(x, p.y, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#81C784';
        ctx.beginPath();
        ctx.arc(x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    } else if (p.type === 'cloth') {
        ctx.fillStyle = '#7E57C2';
        ctx.save();
        ctx.translate(x, p.y);
        ctx.rotate(p.angle || 0);
        ctx.fillRect(-10, -3, 20, 6);
        ctx.restore();
    } else if (p.type === 'darkstar') {
        ctx.fillStyle = '#FF0000';
        drawStar(x, p.y, 10, 5, 5);
        ctx.fillStyle = '#FF4500';
        drawStar(x, p.y, 6, 3, 5);
    } else if (p.type === 'shadow') {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#2a002a';
        ctx.beginPath();
        ctx.arc(x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#4B0082';
        ctx.beginPath();
        ctx.arc(x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    } else if (p.type === 'icecream') {
        ctx.fillStyle = '#FFB6C1';
        ctx.beginPath();
        ctx.arc(x, p.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.arc(x + 2, p.y + 2, 4, 0, Math.PI * 2);
        ctx.fill();
    } else if (p.type === 'soundwave') {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        ctx.globalAlpha = Math.max(0.2, p.life / 60);
        const r = (60 - p.life) * 0.5 + 5;
        ctx.beginPath();
        ctx.arc(x, p.y, r, -0.5, 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, p.y, r + 4, -0.4, 0.4);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
}

// ---- BACKGROUND DRAWING ----
function drawBackground(theme, levelNum) {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, theme.sky1);
    grad.addColorStop(1, theme.sky2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Parallax buildings/elements
    const parallax = camera.x * 0.3;
    
    if (levelNum === 0) {
        // Buenos Aires buildings
        const buildingCount = Math.round(15 * BG_DETAIL);
        ctx.fillStyle = '#1a1a2e';
        for (let i = 0; i < buildingCount; i++) {
            const bx = i * 120 - parallax % 120 - 60;
            const bh = 100 + Math.sin(i * 2.5) * 60;
            ctx.fillRect(bx, canvas.height - bh - 40, 80, bh + 40);
            // Windows
            ctx.fillStyle = '#FFD700';
            for (let wy = 0; wy < bh - 20; wy += 25) {
                for (let wx = 10; wx < 70; wx += 20) {
                    if (Math.sin(i * 3 + wy + wx) > 0) {
                        ctx.fillRect(bx + wx, canvas.height - bh - 30 + wy, 8, 10);
                    }
                }
            }
            ctx.fillStyle = '#1a1a2e';
        }
        // Stars
        ctx.fillStyle = '#fff';
        const starCount0 = Math.round(50 * BG_DETAIL);
        for (let i = 0; i < starCount0; i++) {
            const sx = (i * 137 + parallax * 0.1) % canvas.width;
            const sy = (i * 73) % (canvas.height * 0.4);
            const twinkle = Math.sin(Date.now() * 0.003 + i) * 0.5 + 0.5;
            ctx.globalAlpha = twinkle;
            ctx.fillRect(sx, sy, 2, 2);
        }
        ctx.globalAlpha = 1;
    } else if (levelNum === 1) {
        // Toxic waste background
        ctx.fillStyle = '#2a2a10';
        const junkCount = Math.round(12 * BG_DETAIL);
        for (let i = 0; i < junkCount; i++) {
            const bx = i * 140 - parallax % 140 - 70;
            const bh = 60 + Math.sin(i * 1.8) * 40;
            ctx.fillRect(bx, canvas.height - bh - 40, 100, bh + 40);
        }
        // Toxic barrels
        ctx.fillStyle = '#555';
        const barrelCount = Math.round(8 * BG_DETAIL);
        for (let i = 0; i < barrelCount; i++) {
            const bx = i * 200 - (parallax * 0.5) % 200;
            ctx.fillRect(bx, canvas.height - 80, 30, 40);
            ctx.fillStyle = '#76ff03';
            ctx.fillRect(bx + 5, canvas.height - 70, 20, 5);
            ctx.fillStyle = '#555';
        }
        // Toxic fumes
        if (!isMobileEarly) {
            ctx.fillStyle = 'rgba(118, 255, 3, 0.1)';
            for (let i = 0; i < 6; i++) {
                const fx = i * 250 - (parallax * 0.2) % 250;
                const fy = canvas.height - 100 - Math.sin(Date.now() * 0.002 + i) * 30;
                ctx.beginPath();
                ctx.ellipse(fx, fy, 50, 25, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    } else if (levelNum === 2) {
        // Mirror dimension - space/cosmic
        // Swirling nebula (skip radial gradients on mobile — expensive)
        if (!isMobileEarly) {
            for (let i = 0; i < 5; i++) {
                const nx = (i * 250 - parallax * 0.15) % (canvas.width + 200) - 100;
                const ny = 100 + i * 80;
                const grad2 = ctx.createRadialGradient(nx, ny, 10, nx, ny, 100);
                grad2.addColorStop(0, `rgba(255, 0, 128, 0.15)`);
                grad2.addColorStop(0.5, `rgba(128, 0, 255, 0.08)`);
                grad2.addColorStop(1, 'transparent');
                ctx.fillStyle = grad2;
                ctx.fillRect(nx - 100, ny - 100, 200, 200);
            }
        }
        // Stars
        ctx.fillStyle = '#fff';
        const starCount2 = Math.round(80 * BG_DETAIL);
        for (let i = 0; i < starCount2; i++) {
            const sx = (i * 97 + parallax * 0.05) % canvas.width;
            const sy = (i * 53) % canvas.height;
            const size = 1 + (i % 3);
            const twinkle = Math.sin(Date.now() * 0.005 + i * 0.7) * 0.5 + 0.5;
            ctx.globalAlpha = twinkle;
            ctx.fillRect(sx, sy, size, size);
        }
        ctx.globalAlpha = 1;
        
        // Floating platforms glow
        ctx.fillStyle = 'rgba(255, 64, 129, 0.05)';
        for (let i = 0; i < 10; i++) {
            const px = i * 180 - (parallax * 0.4) % 180;
            ctx.beginPath();
            ctx.ellipse(px, canvas.height - 150 + Math.sin(Date.now() * 0.001 + i) * 20, 40, 15, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (levelNum === 3) {
        // Dark bedroom - bed outlines, moonlight window
        ctx.fillStyle = '#0a0a12';
        for (let i = 0; i < 8; i++) {
            const bx = i * 200 - parallax % 200 - 100;
            ctx.fillRect(bx, canvas.height - 120, 150, 120);
        }
        // Beds
        ctx.fillStyle = '#1a1a2a';
        for (let i = 0; i < 5; i++) {
            const bx = i * 300 - (parallax * 0.4) % 300;
            ctx.fillRect(bx, canvas.height - 90, 120, 30);
            ctx.fillRect(bx, canvas.height - 100, 30, 15);
        }
        // Moon window
        ctx.fillStyle = '#1a1a30';
        ctx.fillRect(canvas.width * 0.7, 40, 80, 100);
        ctx.fillStyle = '#FFD700';
        ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.001) * 0.1;
        ctx.beginPath();
        ctx.arc(canvas.width * 0.74, 70, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        // Shadow silhouettes
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 6; i++) {
            const sx = i * 250 - (parallax * 0.2) % 250;
            ctx.beginPath();
            ctx.ellipse(sx, canvas.height - 50, 30, 50, 0, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (levelNum === 4) {
        // Ice cream shop - pastel decorations, cones
        // Pastel buildings
        const colors4 = ['#ffe0e8', '#e0ffe0', '#e0e8ff', '#fff0d0'];
        for (let i = 0; i < 12; i++) {
            const bx = i * 130 - parallax % 130 - 60;
            const bh = 80 + Math.sin(i * 2) * 40;
            ctx.fillStyle = colors4[i % colors4.length];
            ctx.globalAlpha = 0.4;
            ctx.fillRect(bx, canvas.height - bh - 40, 90, bh + 40);
        }
        ctx.globalAlpha = 1;
        // Ice cream cones in background
        for (let i = 0; i < 6; i++) {
            const cx2 = i * 220 - (parallax * 0.3) % 220;
            // Cone
            ctx.fillStyle = '#D2A050';
            ctx.beginPath();
            ctx.moveTo(cx2 - 10, canvas.height - 100);
            ctx.lineTo(cx2 + 10, canvas.height - 100);
            ctx.lineTo(cx2, canvas.height - 60);
            ctx.closePath();
            ctx.fill();
            // Scoop
            ctx.fillStyle = '#FFB6C1';
            ctx.beginPath();
            ctx.arc(cx2, canvas.height - 108, 12, 0, Math.PI * 2);
            ctx.fill();
        }
    } else {
        // School building - desks, bells, windows
        ctx.fillStyle = '#5a3a1a';
        for (let i = 0; i < 10; i++) {
            const bx = i * 150 - parallax % 150 - 70;
            const bh = 100 + Math.sin(i * 1.5) * 50;
            ctx.fillRect(bx, canvas.height - bh - 40, 110, bh + 40);
            // Windows
            ctx.fillStyle = '#FFD700';
            ctx.globalAlpha = 0.5;
            for (let wy = 0; wy < bh - 20; wy += 30) {
                for (let wx = 15; wx < 90; wx += 25) {
                    ctx.fillRect(bx + wx, canvas.height - bh - 30 + wy, 12, 14);
                }
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#5a3a1a';
        }
        // Desks in foreground
        ctx.fillStyle = '#654321';
        for (let i = 0; i < 6; i++) {
            const dx = i * 240 - (parallax * 0.5) % 240;
            ctx.fillRect(dx, canvas.height - 70, 60, 8);
            ctx.fillRect(dx + 5, canvas.height - 62, 5, 22);
            ctx.fillRect(dx + 50, canvas.height - 62, 5, 22);
        }
        // Bells
        ctx.fillStyle = '#FFD700';
        for (let i = 0; i < 4; i++) {
            const bx = i * 280 - (parallax * 0.15) % 280 + 100;
            ctx.beginPath();
            ctx.arc(bx, 50, 12, 0, Math.PI);
            ctx.fill();
            ctx.fillRect(bx - 1, 35, 2, 15);
        }
    }
}

function drawPlatform(p, theme) {
    const x = p.x - camera.x;
    if (x < -TILE * 4 || x > canvas.width + TILE) return;
    
    if (p.type === 'ground') {
        ctx.fillStyle = theme.ground;
        ctx.fillRect(x, p.y, p.w, p.h);
        ctx.fillStyle = theme.accent;
        ctx.fillRect(x, p.y, p.w, 3);
    } else if (p.type === 'moving') {
        // Moving platform - distinct look with glow
        ctx.fillStyle = '#8B6914';
        ctx.fillRect(x, p.y, p.w, p.h);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x, p.y, p.w, 3);
        ctx.fillRect(x, p.y + p.h - 3, p.w, 3);
        // Arrow indicators
        const m = p.move;
        const isVertical = Math.abs(m.endY - m.startY) > 5;
        ctx.fillStyle = 'rgba(255,215,0,0.5)';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(isVertical ? '↕' : '↔', x + p.w / 2, p.y + p.h / 2 + 5);
        ctx.textAlign = 'left';
        // Glow effect
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x - 2, p.y - 2, p.w + 4, p.h + 4);
        ctx.globalAlpha = 1;
        ctx.restore();
    } else {
        ctx.fillStyle = theme.platform;
        ctx.fillRect(x, p.y, p.w, p.h);
        ctx.fillStyle = theme.accent;
        ctx.fillRect(x, p.y, p.w, 3);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x + 2, p.y + p.h - 3, p.w - 4, 3);
    }
}

// ---- UI ----
function drawUI() {
    // Health bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 160, 25);
    ctx.fillStyle = '#333';
    ctx.fillRect(12, 12, 156, 21);
    const hpRatio = player.hp / player.maxHp;
    const hpColor = hpRatio > 0.5 ? '#4CAF50' : hpRatio > 0.25 ? '#FF9800' : '#f44336';
    ctx.fillStyle = hpColor;
    ctx.fillRect(12, 12, 156 * hpRatio, 21);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`♥ ${player.hp}/${player.maxHp}`, 20, 28);
    
    // Lives as stars (top right)
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(canvas.width - 140, 8, 132, 28);
    for (let i = 0; i < MAX_LIVES; i++) {
        const sx = canvas.width - 132 + i * 26;
        if (i < lives) {
            ctx.fillStyle = '#FFD700';
        } else {
            ctx.fillStyle = '#444';
        }
        drawStar(sx + 10, 22, 10, 4, 5);
    }
    
    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Arial';
    ctx.fillText(`Puntos: ${score}`, canvas.width - 132, 52);
    
    // Level name
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px Arial';
    const lvlText = `Nivel ${currentLevel + 1}: ${LEVEL_THEMES[currentLevel].name}`;
    ctx.fillText(lvlText, canvas.width / 2 - ctx.measureText(lvlText).width / 2, 20);
    
    // Power-up indicators
    if (player.giantTimer > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, 60, 100, 14);
        ctx.fillStyle = '#4169E1';
        ctx.fillRect(12, 62, 96 * (player.giantTimer / 480), 10);
        ctx.fillStyle = '#aac';
        ctx.font = '9px Arial';
        ctx.fillText('💍 GIGANTE', 14, 71);
    }
    if (player.flyTimer > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, player.giantTimer > 0 ? 76 : 60, 100, 14);
        ctx.fillStyle = '#9C27B0';
        const barY = player.giantTimer > 0 ? 78 : 62;
        ctx.fillRect(12, barY, 96 * (player.flyTimer / 480), 10);
        ctx.fillStyle = '#c8a';
        ctx.font = '9px Arial';
        ctx.fillText('💍 VUELO', 14, barY + 9);
    }
    
    // Dash cooldown indicator
    if (player.dashCooldown > 0) {
        const dashY = player.giantTimer > 0 && player.flyTimer > 0 ? 92 : 
                       player.giantTimer > 0 || player.flyTimer > 0 ? 76 : 60;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, dashY, 100, 14);
        ctx.fillStyle = '#00d4ff';
        ctx.fillRect(12, dashY + 2, 96 * (1 - player.dashCooldown / 45), 10);
        ctx.fillStyle = '#8df';
        ctx.font = '9px Arial';
        ctx.fillText('Mayús DASH', 14, dashY + 10);
    }
    
    // Boss health bar
    if (boss && boss.alive) {
        const bossBarW = 300;
        const bx = canvas.width / 2 - bossBarW / 2;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(bx - 2, canvas.height - 42, bossBarW + 4, 30);
        ctx.fillStyle = '#333';
        ctx.fillRect(bx, canvas.height - 40, bossBarW, 26);
        ctx.fillStyle = '#f44336';
        ctx.fillRect(bx, canvas.height - 40, bossBarW * (boss.hp / boss.maxHp), 26);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(boss.name, bx + bossBarW/2 - ctx.measureText(boss.name).width/2, canvas.height - 22);
    }
    
    // Controls hint (hide on touch devices)
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '10px Arial';
    ctx.fillText('← → Mover | ESPACIO Saltar (x2) | Mayús Dash | Z Rayo | X Estrella | P Pausa', 10, canvas.height - 8);
    
    // Progress bar (distance to boss)
    if (gameState === 'playing') {
        const progress = Math.max(0, Math.min(1, (player.x + player.w / 2) / level.bossZone));
        const barW = 200, barH = 6;
        const barX = canvas.width / 2 - barW / 2;
        const barY = 28;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
        ctx.fillStyle = '#333';
        ctx.fillRect(barX, barY, barW, barH);
        const barColor = progress < 0.5 ? '#00d4ff' : progress < 0.8 ? '#FFD700' : '#f44336';
        ctx.fillStyle = barColor;
        ctx.fillRect(barX, barY, barW * progress, barH);
        // Boss icon at end
        ctx.fillStyle = '#f44336';
        ctx.font = '10px Arial';
        ctx.fillText('💀', barX + barW + 4, barY + 6);
        // Player dot on bar
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(barX + barW * progress, barY + barH / 2, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ---- DRAW POWER-UPS ----
function drawPowerUp(pu) {
    if (pu.collected) return;
    const x = pu.x - camera.x;
    const bob = Math.sin(pu.animTimer * 0.06) * 5;
    const glow = Math.sin(pu.animTimer * 0.1) * 0.3 + 0.6;
    
    ctx.save();
    ctx.globalAlpha = glow;
    
    // Ring base (silver)
    ctx.strokeStyle = '#C0C0C0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(x, pu.y + bob, 12, 14, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // Ring shine
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x - 4, pu.y + bob - 6, 3, 0, Math.PI * 0.8);
    ctx.stroke();
    
    if (pu.type === 'giant') {
        // Lapis lazuli gem (blue stone)
        ctx.fillStyle = '#1a237e';
        ctx.beginPath();
        ctx.moveTo(x, pu.y + bob - 16);
        ctx.lineTo(x + 7, pu.y + bob - 10);
        ctx.lineTo(x + 4, pu.y + bob - 4);
        ctx.lineTo(x - 4, pu.y + bob - 4);
        ctx.lineTo(x - 7, pu.y + bob - 10);
        ctx.closePath();
        ctx.fill();
        // Gold flecks in lapis
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x - 2, pu.y + bob - 12, 1, 1);
        ctx.fillRect(x + 3, pu.y + bob - 8, 1, 1);
        ctx.fillRect(x - 1, pu.y + bob - 6, 1, 1);
    } else {
        // Violet spiral gem
        ctx.strokeStyle = '#9C27B0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 4; a += 0.2) {
            const r = 2 + a * 1.2;
            const px = x + Math.cos(a + pu.animTimer * 0.05) * r * 0.5;
            const py = pu.y + bob - 10 + Math.sin(a + pu.animTimer * 0.05) * r * 0.5;
            if (a === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.stroke();
    }
    
    ctx.globalAlpha = 1;
    ctx.restore();
}

// ---- DRAW HAMBURGER ----
function drawBurger(b) {
    if (b.collected) return;
    const x = b.x - camera.x;
    const bob = Math.sin(b.animTimer * 0.07) * 3;
    const y = b.y + bob;
    
    // Top bun
    ctx.fillStyle = '#D4A030';
    ctx.beginPath();
    ctx.ellipse(x, y - 6, 14, 8, 0, Math.PI, 0);
    ctx.fill();
    // Sesame seeds
    ctx.fillStyle = '#FFF8DC';
    ctx.fillRect(x - 6, y - 11, 3, 2);
    ctx.fillRect(x + 3, y - 12, 3, 2);
    ctx.fillRect(x - 1, y - 13, 3, 2);
    // Lettuce
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath();
    for (let i = -12; i < 12; i += 4) {
        ctx.lineTo(x + i, y - 6 + Math.sin(i * 0.8) * 2);
    }
    ctx.lineTo(x + 12, y - 4);
    ctx.lineTo(x - 12, y - 4);
    ctx.fill();
    // Patty
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(x - 12, y - 4, 24, 5);
    // Cheese
    ctx.fillStyle = '#FFC107';
    ctx.beginPath();
    ctx.moveTo(x - 13, y - 4);
    ctx.lineTo(x + 13, y - 4);
    ctx.lineTo(x + 11, y);
    ctx.lineTo(x + 6, y - 2);
    ctx.lineTo(x, y + 1);
    ctx.lineTo(x - 6, y - 2);
    ctx.lineTo(x - 11, y);
    ctx.closePath();
    ctx.fill();
    // Bottom bun
    ctx.fillStyle = '#D4A030';
    ctx.fillRect(x - 12, y + 1, 24, 5);
    ctx.beginPath();
    ctx.ellipse(x, y + 6, 12, 4, 0, 0, Math.PI);
    ctx.fill();
    
    // Glow effect
    ctx.save();
    ctx.globalAlpha = Math.sin(b.animTimer * 0.1) * 0.15 + 0.15;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(x, y - 3, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
}

// ---- COLLISION ----
function rectCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function playerPlatformCollision() {
    player.onGround = false;
    player._ridingPlatform = null;
    player.wallSliding = false;
    player.wallDir = 0;
    for (const p of level.platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            // Landing on top
            if (player.vy >= 0 && player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy + 2) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                player.jumpsLeft = player.maxJumps;
                if (p.move) player._ridingPlatform = p;
            }
            // Hitting bottom
            else if (player.vy < 0 && player.y < p.y + p.h && player.y > p.y) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
        // Side collision + wall slide detection
        if (player.y + player.h > p.y + 4 && player.y < p.y + p.h - 4) {
            if (player.x + player.w > p.x && player.x + player.w < p.x + 12 &&
                (player.vx > 0 || (isKeyDown('ArrowRight') || isKeyDown('KeyD')))) {
                player.x = p.x - player.w;
                player.vx = 0;
                if (!player.onGround && player.vy > 0) {
                    player.wallSliding = true;
                    player.wallDir = -1; // wall is to the right, jump left
                }
            } else if (player.x < p.x + p.w && player.x > p.x + p.w - 12 &&
                       (player.vx < 0 || (isKeyDown('ArrowLeft') || isKeyDown('KeyA')))) {
                player.x = p.x + p.w;
                player.vx = 0;
                if (!player.onGround && player.vy > 0) {
                    player.wallSliding = true;
                    player.wallDir = 1; // wall is to the left, jump right
                }
            }
        }
    }
    // Wall slide: slow down fall
    if (player.wallSliding) {
        player.vy = Math.min(player.vy, 2);
        player.jumpsLeft = 1; // allow wall jump
    }
    // Carry player with moving platform
    if (player._ridingPlatform && player._ridingPlatform.move) {
        const m = player._ridingPlatform.move;
        player.x += m.dx;
        player.y += m.dy;
    }
}

function isChicoInvisibleAndHidden() {
    return selectedSkin === 3 && unlockedSkins[3] && !player.invisibleVisible;
}

function damagePlayer(dmg) {
    if (player.invincible > 0 || player.dead) return;
    player.hp -= dmg;
    player.invincible = 60;
    sfxHit();
    shakeTimer = 10;
    shakeIntensity = 5;
    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff0000', 6);
    
    if (player.hp <= 0) {
        player.dead = true;
        sfxDeath();
        lives--;
        if (lives <= 0) {
            setTimeout(() => {
                gameState = 'gameOver'; gameOverTimer = 0; stopMusic();
                for (const k in keys) keys[k] = false;
                // Go directly to game over options
            }, 1000);
        } else {
            setTimeout(() => {
                if (gameState === 'bossFight') {
                    player = createPlayer();
                    player.x = level.bossZone - 100;
                } else {
                    player = createPlayer();
                    // Respawn at last checkpoint
                    if (savedCheckpoint.level === currentLevel && savedCheckpoint.x > 80) {
                        player.x = savedCheckpoint.x;
                    }
                }
            }, 1500);
        }
    }
}

// ---- UPDATE FUNCTIONS ----

// Find nearest enemy or boss to auto-aim projectiles
function findNearestTarget() {
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    
    // During boss fight, always aim at the boss
    if (gameState === 'bossFight' && boss && boss.alive) {
        const bx = boss.x + boss.w / 2;
        const by = boss.y + boss.h / 2;
        const len = Math.sqrt((bx - px) ** 2 + (by - py) ** 2);
        if (len > 0) return { dx: (bx - px) / len, dy: (by - py) / len };
        return { dx: player.facing, dy: 0 };
    }
    
    let bestDist = Infinity;
    let bestDx = player.facing;
    let bestDy = 0;
    
    // Check enemies
    for (const e of level.enemies) {
        if (!e.alive) continue;
        const ex = e.x + e.w / 2;
        const ey = e.y + e.h / 2;
        const dist = Math.sqrt((ex - px) ** 2 + (ey - py) ** 2);
        if (dist < bestDist) {
            bestDist = dist;
            bestDx = ex - px;
            bestDy = ey - py;
        }
    }
    // Check boss
    if (boss && boss.alive) {
        const bx = boss.x + boss.w / 2;
        const by = boss.y + boss.h / 2;
        const dist = Math.sqrt((bx - px) ** 2 + (by - py) ** 2);
        if (dist < bestDist) {
            bestDx = bx - px;
            bestDy = by - py;
        }
    }
    // Normalize
    const len = Math.sqrt(bestDx * bestDx + bestDy * bestDy);
    if (len > 0) {
        bestDx /= len;
        bestDy /= len;
    } else {
        bestDx = player.facing;
        bestDy = 0;
    }
    return { dx: bestDx, dy: bestDy };
}

function updateMovingPlatforms() {
    for (const p of level.platforms) {
        if (!p.move) continue;
        const m = p.move;
        m.prevX = p.x;
        m.prevY = p.y;
        m.t += m.speed * m.dir;
        if (m.t >= 1) { m.t = 1; m.dir = -1; }
        else if (m.t <= 0) { m.t = 0; m.dir = 1; }
        p.x = m.startX + (m.endX - m.startX) * m.t;
        p.y = m.startY + (m.endY - m.startY) * m.t;
        m.dx = p.x - m.prevX;
        m.dy = p.y - m.prevY;
    }
}

function updatePlayer() {
    if (player.dead) {
        player.vy += GRAVITY;
        player.y += player.vy;
        return;
    }
    
    // Movement
    const speed = 4;
    const accel = 0.5;
    const friction = 0.8;
    
    if (isKeyDown('ArrowLeft') || isKeyDown('KeyA')) {
        player.vx = Math.max(player.vx - accel, -speed);
        player.facing = -1;
        player.runTimer++;
        player.isRunning = true;
    } else if (isKeyDown('ArrowRight') || isKeyDown('KeyD')) {
        player.vx = Math.min(player.vx + accel, speed);
        player.facing = 1;
        player.runTimer++;
        player.isRunning = true;
    } else {
        player.vx *= friction;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
        player.runTimer = 0;
        player.isRunning = false;
    }
    
    // Jump (double jump + wall jump)
    if (player.wallJumpCooldown > 0) player.wallJumpCooldown--;
    if ((isKeyDown('Space') || isKeyDown('ArrowUp') || isKeyDown('KeyW')) && (player.jumpsLeft > 0 || player.wallSliding)) {
        if (!player._jumpPressed) {
            if (player.wallSliding && player.wallJumpCooldown === 0) {
                // Wall jump: push away from wall
                player.vy = -11;
                player.vx = player.wallDir * 6;
                player.facing = player.wallDir;
                player.wallSliding = false;
                player.wallJumpCooldown = 10;
                sfxJump();
                spawnParticles(player.x + (player.wallDir < 0 ? player.w : 0), player.y + player.h / 2, '#00d4ff', 5, 2);
            } else {
                player.vy = player.jumpsLeft === player.maxJumps ? -12 : -10;
                player.jumpsLeft--;
                sfxJump();
                if (player.jumpsLeft === player.maxJumps - 2) {
                    spawnParticles(player.x + player.w/2, player.y + player.h, '#00d4ff', 5, 2);
                }
            }
            player._jumpPressed = true;
        }
    } else {
        player._jumpPressed = false;
    }
    
    // Flying power-up: hold jump to float
    if (player.flyTimer > 0 && (isKeyDown('Space') || isKeyDown('ArrowUp') || isKeyDown('KeyW'))) {
        if (player.vy > -2) player.vy = -3;
        player.flyTimer--;
    }
    
    // Dash ability (Shift key)
    if (player.dashCooldown > 0) player.dashCooldown--;
    if (player.dashTimer > 0) {
        player.dashTimer--;
        player.vx = player.dashDir * 14;
        player.vy = 0;
        player.isDashing = true;
        player.invincible = Math.max(player.invincible, 2);
        // Dash trail particles
        player.dashTrailTimer++;
        if (player.dashTrailTimer % 2 === 0) {
            spawnParticles(
                player.x + player.w / 2 - player.dashDir * 10,
                player.y + player.h / 2,
                '#00d4ff', 2, 1.5
            );
        }
        if (player.dashTimer === 0) {
            player.isDashing = false;
            player.vx = player.dashDir * 4;
        }
    }
    if ((isKeyDown('ShiftLeft') || isKeyDown('ShiftRight')) && player.dashCooldown === 0 && !player.isDashing) {
        player.dashTimer = 8;
        player.dashCooldown = 45;
        player.dashDir = player.facing;
        player.isDashing = true;
        player.dashTrailTimer = 0;
        sfxJump();
    }
    
    // Running particle trail
    if (player.isRunning && player.onGround && Math.abs(player.vx) > 3) {
        if (Math.random() < 0.3) {
            particles.push({
                x: player.x + player.w / 2 - player.facing * 5,
                y: player.y + player.h - 2,
                vx: -player.facing * (0.5 + Math.random()),
                vy: -Math.random() * 1.5,
                life: 15 + Math.random() * 10,
                maxLife: 25,
                color: '#aaa',
                size: 2 + Math.random() * 2
            });
        }
    }
    
    // Giant power-up timer
    if (player.giantTimer > 0) {
        player.giantTimer--;
        player.w = player.baseW * 2;
        player.h = player.baseH * 2;
        if (player.giantTimer === 0) {
            player.w = player.baseW;
            player.h = player.baseH;
        }
    }
    
    // Z Attack: Eye laser / Chico Invisible: lanza un yunque / Magnate: rayo de fuego
    if (player.attackCooldown > 0) player.attackCooldown--;
    if ((isKeyDown('KeyZ') || isKeyDown('KeyJ')) && player.attackCooldown === 0) {
        if (selectedSkin === 3 && unlockedSkins[3]) {
            // Chico Invisible: lanza martillos dirigidos al enemigo más cercano
            player.attacking = true;
            player.attackTimer = 15;
            player.attackCooldown = 20;
            sfxAttack();
            const isGiant = player.giantTimer > 0;
            const aimHammer = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aimHammer.dx >= 0 ? player.w + 2 : -22),
                y: player.y + player.h * 0.1,
                vx: aimHammer.dx * 8,
                vy: aimHammer.dy * 8,
                type: 'hammer',
                life: 60,
                damage: isGiant ? 4 : 2,
                w: isGiant ? 28 : 20, h: isGiant ? 28 : 20,
                rotation: 0
            });
        } else if (selectedSkin === 4 && unlockedSkins[4]) {
            // Magnate: rayo de fuego por las manos al enemigo más cercano
            player.attacking = true;
            player.attackTimer = 15;
            player.attackCooldown = 6;
            sfxFire();
            const isGiant = player.giantTimer > 0;
            const aim = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aim.dx >= 0 ? player.w + 2 : -12),
                y: player.y + player.h * 0.35,
                vx: aim.dx * 9,
                vy: aim.dy * 9,
                type: 'fireRay',
                life: 45,
                damage: isGiant ? 3 : 2,
                w: isGiant ? 30 : 18, h: isGiant ? 10 : 6
            });
        } else if (selectedSkin === 5 && unlockedSkins[5]) {
            // Chico Goloso: lanza cookies al enemigo más cercano
            player.attacking = true;
            player.attackTimer = 15;
            player.attackCooldown = 10;
            sfxCookie();
            const isGiant = player.giantTimer > 0;
            const aim = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aim.dx >= 0 ? player.w + 2 : -14),

            });
        } else if (selectedSkin === 6 && unlockedSkins[6]) {
            // Chico Imán: lanza taza de té de metal al enemigo más cercano

            player.attackTimer = 15;
            player.attackCooldown = 12;
            sfxTeaCup();
            const isGiant = player.giantTimer > 0;

            playerProjectiles.push({
                x: player.x + (aim.dx >= 0 ? player.w + 2 : -14),
                y: player.y + player.h * 0.3,
                vx: aim.dx * 8,
                vy: aim.dy * 8,
                type: 'teaCup',
                life: 50,
                damage: isGiant ? 3 : 2,
                w: isGiant ? 22 : 14, h: isGiant ? 22 : 14
            });
        } else if (selectedSkin === 7 && unlockedSkins[7]) {
            // Chica Masa: brazo elástico al enemigo más cercano
            player.attacking = true;
            player.attackTimer = 20;
            player.attackCooldown = 14;
            sfxStretchArm();
            const isGiant = player.giantTimer > 0;
            const aim = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aim.dx >= 0 ? player.w + 2 : -8),
                y: player.y + player.h * 0.35,
                vx: aim.dx * 10,
                vy: aim.dy * 10,
                type: 'stretchArm',
                life: 30,
                damage: isGiant ? 4 : 3,
                w: isGiant ? 28 : 18, h: isGiant ? 14 : 8
            });
        } else {
            player.attacking = true;
            player.attackTimer = 15;
            player.attackCooldown = 4;
            sfxLaser();
            const isGiant = player.giantTimer > 0;
            const aim = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aim.dx >= 0 ? player.w + 2 : -8),
                y: player.y + player.h * 0.2,
                vx: aim.dx * 10,
                vy: aim.dy * 10,
                type: 'laser',
                life: 40,
                damage: isGiant ? 3 : 1,
                w: isGiant ? 35 : 20, h: isGiant ? 8 : 4
            });
        }
    }
    if (player.attackTimer > 0) {
        player.attackTimer--;
        if (player.attackTimer === 0) player.attacking = false;
    }
    
    // X Attack: Ninja star / Chico Invisible: alternar visibilidad / Magnate: rayo de hielo
    if (player.invisibleToggleCooldown > 0) player.invisibleToggleCooldown--;
    if (selectedSkin === 3 && unlockedSkins[3]) {
        // Chico Invisible: X alterna visibilidad
        if ((isKeyDown('KeyX') || isKeyDown('KeyK'))) {
            if (!player._xTogglePressed) {
                player._xTogglePressed = true;
                player.invisibleVisible = !player.invisibleVisible;
                player.invisibleToggleCooldown = 20;
                if (player.invisibleVisible) {
                    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#888888', 10, 3);
                    playSound(500, 0.15, 'square', 0.1);

                    playSound(300, 0.15, 'triangle', 0.1);

    } else if (selectedSkin === 4 && unlockedSkins[4]) {

        if ((isKeyDown('KeyX') || isKeyDown('KeyK')) && player.attackCooldown === 0) {

            playerProjectiles.push({
