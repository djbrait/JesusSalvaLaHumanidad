<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif; touch-action: none;

        #touch-controls { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; }
        .touch-btn { position: absolute; pointer-events: auto; border-radius: 50%;
            background: rgba(0,0,0,0.85); border: 3px solid rgba(255,255,255,0.5);

        .touch-btn:active, .touch-btn.active { background: rgba(0,0,0,0.95); border-color: #FFD700;

        #orientation-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; flex-direction: column; align-items: center;
            justify-content: center; color: #FFD700; font-size: 22px; text-align: center; padding: 30px; }
        .rotate-icon { font-size: 64px; margin-bottom: 20px; animation: rotateHint 2s ease-in-out infinite; }
        @keyframes rotateHint { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
        @media (pointer: coarse), (max-width: 800px) { #touch-controls { display: block; } }
    </style>
</head>

<script>
// ============================================================
// JESUS SALVA A LA HUMANIDAD - v1.3
// Plataformas 2D - Liberá almas poseídas con agua bendita
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 960; canvas.height = 540;
const GAME_VERSION = 'v1.3';

// ---- AUDIO ----
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playTone(freq, dur, type, vol, delay) {
    if (!sfxEnabled) return;
    ensureAudio();
    type = type || 'sine'; vol = vol || 0.12; delay = delay || 0;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + dur);
}
function sfxJump()      { playTone(440,0.12); playTone(660,0.1,'sine',0.1,0.07); }
function sfxHolyWater() { [1000,1400,1800].forEach(function(f,i){ playTone(f,0.1,'sine',0.08,i*0.05); }); }
function sfxConvert()   { [600,800,1000,1300,1600].forEach(function(f,i){ playTone(f,0.25,'sine',0.1,i*0.07); }); }
function sfxHit()       { playTone(200,0.2,'sawtooth',0.18); }
function sfxBossHit()   { playTone(130,0.3,'sawtooth',0.22); }
function sfxDeath()     { [300,220,150,90].forEach(function(f,i){ playTone(f,0.2,'sawtooth',0.14,i*0.15); }); }
function sfxVictory()   { [523,659,784,880,1047].forEach(function(f,i){ playTone(f,0.4,'sine',0.14,i*0.18); }); }
function sfxAngel()     { [392,494,587,659,784,987,1175].forEach(function(f,i){ playTone(f,0.6,'sine',0.12,i*0.13); }); }
function sfxDash()      { playTone(600,0.08,'square',0.08); playTone(400,0.06,'square',0.07,0.05); }
function sfxFireball()  { playTone(180,0.15,'sawtooth',0.1); playTone(260,0.1,'sawtooth',0.08,0.05); }
function sfxPortal()    { [300,400,500,600,700].forEach(function(f,i){ playTone(f,0.3,'sine',0.09,i*0.09); }); }
function sfxCheckpoint(){ [600,800,1000].forEach(function(f,i){ playTone(f,0.2,'sine',0.1,i*0.08); }); }
function sfxPickup()    { playTone(800,0.1,'sine',0.1); playTone(1200,0.15,'sine',0.12,0.08); }

// ---- MUSIC ----
var musicPlaying = false, musicInterval = null;
var sfxEnabled = true, musicEnabled = true;
var EARTH_MELODY = [
    [523,0.3],[659,0.3],[784,0.3],[659,0.15],[523,0.15],[440,0.4],[0,0.2],
    [523,0.15],[587,0.15],[659,0.3],[784,0.3],[880,0.3],[784,0.15],[659,0.15],[523,0.4],[0,0.2],
    [392,0.15],[440,0.15],[523,0.3],[659,0.3],[784,0.2],[659,0.15],[523,0.15],[440,0.4],[0,0.3],
    [330,0.15],[392,0.15],[440,0.3],[523,0.3],[659,0.4],[523,0.15],[440,0.15],[392,0.5],[0,0.3]
];
var HELL_MELODY = [
    [220,0.2],[233,0.2],[220,0.2],[196,0.5],[0,0.1],
    [185,0.2],[196,0.2],[220,0.7],[0,0.2],
    [220,0.15],[246,0.15],[261,0.3],[246,0.15],[220,0.15],[207,0.3],[196,0.7],[0,0.4],
    [165,0.2],[175,0.2],[185,0.2],[196,0.3],[220,0.5],[196,0.15],[175,0.15],[165,0.6],[0,0.4]
];
function startMusic(hell) {
    if (musicPlaying || !musicEnabled) return;
    ensureAudio(); musicPlaying = true;
    var melody = hell ? HELL_MELODY : EARTH_MELODY, idx = 0, nextTime = 0;
    var st = audioCtx.currentTime;
    function sched() {
        if (!musicPlaying) return;
        var now = audioCtx.currentTime - st;
        while (nextTime < now + 0.5) {
            var note = melody[idx % melody.length], f = note[0], d = note[1];
            if (f > 0) {
                var osc = audioCtx.createOscillator(), g = audioCtx.createGain();
                osc.type = hell ? 'sawtooth' : 'sine'; osc.frequency.value = f;
                g.gain.setValueAtTime(0.07, st+nextTime);
                g.gain.exponentialRampToValueAtTime(0.001, st+nextTime+d*0.9);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(st+nextTime); osc.stop(st+nextTime+d);
            }
            nextTime += d; idx++;
        }
    }
    musicInterval = setInterval(function(){ if (!musicPlaying) clearInterval(musicInterval); else sched(); }, 200);
    sched();
}
function stopMusic() {
    musicPlaying = false;
    if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
}
var _musicWas = false, _appHid = false;
function onAppHide() {
    if (_appHid) return; _appHid = true; _musicWas = musicPlaying; stopMusic();
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
}
function onAppShow() {
    if (!_appHid) return; _appHid = false;
    if (_musicWas && musicEnabled) startMusic(gameState === 'bossFight');
}
document.addEventListener('visibilitychange', function(){ document.hidden ? onAppHide() : onAppShow(); });
window.addEventListener('pagehide', onAppHide); window.addEventListener('pageshow', onAppShow);
window.addEventListener('blur',  function(){ if ('ontouchstart' in window) onAppHide(); });
window.addEventListener('focus', function(){ if ('ontouchstart' in window) onAppShow(); });

// ---- INPUT ----
var keys = {}, touchKeys = {};
window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyZ','KeyX',
         'ShiftLeft','ShiftRight','KeyP','Escape','Enter'].indexOf(e.code) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
function setupTouch(id, code) {
    var btn = document.getElementById(id); if (!btn) return;
    var on  = function(e){ e.preventDefault(); touchKeys[code]=true;  btn.classList.add('active'); ensureAudio(); };
    var off = function(e){ e.preventDefault(); touchKeys[code]=false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart',  on,  {passive:false});
    btn.addEventListener('touchend',    off, {passive:false});
    btn.addEventListener('touchcancel', off, {passive:false});
    btn.addEventListener('mousedown', on); btn.addEventListener('mouseup', off); btn.addEventListener('mouseleave', off);
}
setupTouch('btn-left','ArrowLeft'); setupTouch('btn-right','ArrowRight');
setupTouch('btn-jump','Space');     setupTouch('btn-dash','ShiftLeft');
setupTouch('btn-z','KeyZ');         setupTouch('btn-x','KeyX');
setupTouch('btn-down','ArrowDown');
var btnPause = document.getElementById('btn-pause');
if (btnPause) {
    btnPause.addEventListener('touchstart', function(e){ e.preventDefault(); togglePause(); ensureAudio(); }, {passive:false});
    btnPause.addEventListener('mousedown',  function(e){ e.preventDefault(); togglePause(); });
}
function isDown(code){ return !!(keys[code] || touchKeys[code]); }

// ---- CONSTANTS ----
var TILE=40, GRAV=0.55, JUMP=-13, MSPD=4.5, DSPD=10, DDUR=10, WSPD=9;
var LEVEL_W=5200, BOSS_X=4500, HELL_X=3600;

// ---- STATE ----
var gameState='title', prevState='playing', pauseSel=0, pauseDelay=0;
var storyLines=[], storyIdx=0, storyTimer=0;
var titleSel=0, settSel=0, fc=0;
var transAlpha=0, transDir=0, transCb=null;
var gameOverTimer=0, shakeTimer=0, shakeAmt=4;
var flashT=0, flashC='#fff';
var score=0, lives=5, MAX_LIVES=5;
var comboCount=0, comboTimer=0, bossTriggered=false;
var savedCP={x:80};

// ---- PARTICLES ----
var particles=[];
var isMob = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
var MAX_PART=isMob?60:220, PMULT=isMob?0.5:1;
function spawnPart(x,y,color,n,spd) {
    n=n||8; spd=spd||3;
    var cnt=Math.max(1,Math.round(n*PMULT));
    for (var i=0;i<cnt&&particles.length<MAX_PART;i++) {
        var a=(Math.PI*2/cnt)*i+Math.random()*0.5;
        particles.push({x:x,y:y,vx:Math.cos(a)*spd*(0.5+Math.random()),vy:Math.sin(a)*spd*(0.5+Math.random())-1,life:30+Math.random()*20,maxLife:50,color:color,size:2+Math.random()*3});
    }
}
function spawnHoly(x,y) {
    for (var i=0;i<Math.round(10*PMULT)&&particles.length<MAX_PART;i++) {
        var a=Math.random()*Math.PI*2, s=1+Math.random()*4;
        var h=Math.round(195+Math.random()*30);
        var l=Math.round(68+Math.random()*22);
        particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:40+Math.random()*20,maxLife:60,color:'hsl('+h+',100%,'+l+'%)',size:3+Math.random()*3});
    }
}
function spawnConvert(x,y) {
    for (var i=0;i<Math.round(18*PMULT)&&particles.length<MAX_PART;i++) {
        var a=Math.random()*Math.PI*2, s=1+Math.random()*5;
        particles.push({x:x+Math.random()*30,y:y-Math.random()*50,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:50+Math.random()*30,maxLife:80,color:Math.random()<0.5?'#FFD700':'#ffffff',size:2+Math.random()*5});
    }
}

// ---- CAMERA ----
var camera={x:0,y:0};

// ---- LEVEL ----
var level=null, playerProj=[], bossProj=[];
function makeLevel() {
    var platforms=[], enemies=[], coins=[];
    var gaps=[[1080,1220],[2180,2340],[3060,3200],[4080,4180]];
    for (var x=0;x<LEVEL_W;x+=TILE) {
        var inGap=false;
        for (var g=0;g<gaps.length;g++) { if (x>=gaps[g][0]&&x<gaps[g][1]){inGap=true;break;} }
        if (!inGap) platforms.push({x:x,y:500,w:TILE,h:TILE,type:'ground',hell:x>=HELL_X});
    }
    var plats=[
        {x:180,y:380,w:3},{x:430,y:300,w:2},{x:700,y:360,w:3},{x:950,y:280,w:2},
        {x:1200,y:400,w:3},{x:1450,y:315,w:2},{x:1720,y:250,w:3},{x:1980,y:375,w:2},
        {x:2230,y:295,w:3},{x:2490,y:205,w:2},{x:2750,y:345,w:3},{x:3010,y:265,w:2},
        {x:3290,y:205,w:3},{x:3540,y:345,w:2},
        {x:3800,y:375,w:2},{x:4040,y:295,w:3},{x:4280,y:215,w:2}
    ];
    for (var pi=0;pi<plats.length;pi++) {
        var p=plats[pi];
        for (var wi=0;wi<p.w;wi++) {
            var hx=p.x+wi*TILE;
            platforms.push({x:hx,y:p.y,w:TILE,h:TILE,type:'platform',hell:hx>=HELL_X});
        }
    }
    var movs=[
        {x:580,y:345,w:120,ex:580,ey:215,spd:0.007},{x:1320,y:360,w:100,ex:1520,ey:360,spd:0.006},
        {x:2060,y:305,w:120,ex:2060,ey:175,spd:0.008},{x:2900,y:345,w:100,ex:3100,ey:345,spd:0.007},
        {x:3660,y:315,w:120,ex:3660,ey:185,spd:0.009}
    ];
    for (var mi=0;mi<movs.length;mi++) {
        var m=movs[mi];
        platforms.push({x:m.x,y:m.y,w:m.w,h:TILE,type:'moving',hell:m.x>=HELL_X,
            move:{sx:m.x,sy:m.y,ex:m.ex,ey:m.ey,spd:m.spd,t:0,dir:1,dx:0,dy:0,px:m.x,py:m.y}});
    }
    var ePos=[300,530,780,1030,1340,1600,1870,2120,2410,2680,2950,3220,3480,3730,3980,4150,4350];
    for (var ei=0;ei<ePos.length;ei++) {
        var ex=ePos[ei];
        enemies.push({x:ex,y:460,w:28,h:46,vx:1.1+Math.random()*0.6,vy:0,
            startX:ex,range:115,animTimer:Math.random()*100,
            hp:1,alive:true,converted:false,convertTimer:0,
            hell:ex>=HELL_X,gender:Math.random()<0.5?'m':'f',hitFlash:0});
    }
    for (var cx=160;cx<LEVEL_W-220;cx+=135+Math.random()*65) {
        var pp=null;
        for (var pj=0;pj<plats.length;pj++){if(Math.abs(plats[pj].x+plats[pj].w*TILE/2-cx)<60){pp=plats[pj];break;}}
        coins.push({x:cx,y:pp?pp.y-42:462-Math.random()*90,collected:false,anim:Math.random()*100});
    }
    var health=[
        {x:680,y:462,collected:false,anim:0},
        {x:2620,y:462,collected:false,anim:0},
        {x:4050,y:462,collected:false,anim:0}
    ];
    var checkpoints=[
        {x:Math.floor(LEVEL_W*0.45),y:460,active:false,anim:0},
        {x:BOSS_X-220,y:460,active:false,anim:0}
    ];
    return {platforms:platforms,enemies:enemies,coins:coins,health:health,checkpoints:checkpoints,width:LEVEL_W,bossZone:BOSS_X};
}

// ---- PLAYER ----
var player=null;
function makePlayer(startX) {
    startX=startX||80;
    return {x:startX,y:400,vx:0,vy:0,w:28,h:50,onGround:false,facing:1,
        hp:5,maxHp:5,invincible:0,attackTimer:0,attackCD:0,
        animTimer:0,dead:false,jumpsLeft:2,maxJumps:2,
        dashCD:0,dashTimer:0,isDashing:false,dashDir:1,
        shieldCD:0,faith:0,maxFaith:100,haloT:0,crouching:false,
        _jh:false,_dh:false,_xh:false};
}

// ---- BOSS ----
var boss=null;
function makeBoss() {
    return {name:'EL DIABLO',x:4700,y:360,w:80,h:120,
        hp:30,maxHp:30,vx:1.5,vy:0,facing:-1,
        phase:1,attackTimer:0,attackCD:90,
        animTimer:0,invincible:0,alive:true,onGround:false,
        flyT:0,defeated:false,transforming:false,transformT:0};
}

// ---- TRANSITIONS ----
function fadeOut(cb){ transDir=1; transAlpha=0; transCb=cb; }
function fadeIn(){ transDir=-1; transAlpha=1; }

// ---- GAME START ----
function startLevel() {
    level=makeLevel(); player=makePlayer(savedCP.x); boss=null;
    bossTriggered=false; playerProj=[]; bossProj=[]; particles=[]; blessingWaves=[];
    camera.x=0; camera.y=0; gameState='playing';
    stopMusic(); setTimeout(function(){ startMusic(false); }, 100);
}
function startBoss() {
    boss=makeBoss(); bossProj=[];
    gameState='bossFight'; sfxPortal();
    stopMusic(); setTimeout(function(){ startMusic(true); }, 100);
}
function resetGame(keep) {
    lives=MAX_LIVES; if (!keep) score=0;
    savedCP={x:80}; bossTriggered=false;
    startLevel(); fadeIn();
}

// ---- PHYSICS ----
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function updMovPlats() {
    for (var i=0;i<level.platforms.length;i++) {
        var p=level.platforms[i]; if (p.type!=='moving'||!p.move) continue;
        var m=p.move; m.px=p.x; m.py=p.y;
        m.t+=m.spd*m.dir;
        if (m.t>=1){m.t=1;m.dir=-1;} if (m.t<=0){m.t=0;m.dir=1;}
        p.x=m.sx+(m.ex-m.sx)*m.t; p.y=m.sy+(m.ey-m.sy)*m.t;
        m.dx=p.x-m.px; m.dy=p.y-m.py;
    }
}
function resolvePlat() {
    player.onGround=false;
    for (var i=0;i<level.platforms.length;i++) {
        var p=level.platforms[i]; if (!rectHit(player,p)) continue;
        var ox=Math.min(player.x+player.w,p.x+p.w)-Math.max(player.x,p.x);
        var oy=Math.min(player.y+player.h,p.y+p.h)-Math.max(player.y,p.y);
        if (ox<oy) {
            player.x=player.x<p.x?p.x-player.w:p.x+p.w; player.vx=0;
        } else {
            if (player.y<p.y) {
                player.y=p.y-player.h; player.vy=0; player.onGround=true; player.jumpsLeft=player.maxJumps;
                if (p.type==='moving'&&p.move) player.x+=p.move.dx;
            } else { player.y=p.y+p.h; player.vy=0; }
        }
    }
}

// ---- PLAYER UPDATE ----
function updPlayer() {
    if (player.dead) return;
    player.haloT++; player.animTimer++;
    if (player.dashTimer>0){player.dashTimer--;player.isDashing=true;player.vx=player.dashDir*DSPD;}
    else player.isDashing=false;
    if (player.dashCD>0)   player.dashCD--;
    if (player.shieldCD>0) player.shieldCD--;
    if (player.invincible>0) player.invincible--;
    if (player.attackCD>0)   player.attackCD--;
    if (player.attackTimer>0)player.attackTimer--;
    if (comboTimer>0) comboTimer--; else comboCount=0;
    if (!player.isDashing) {
        if      (isDown('ArrowLeft')) {player.vx=-MSPD;player.facing=-1;}
        else if (isDown('ArrowRight')){player.vx= MSPD;player.facing= 1;}
        else player.vx*=0.78;
        var wantJump=isDown('Space')||isDown('ArrowUp');
        if (wantJump&&!player._jh&&player.jumpsLeft>0&&!player.crouching) {
            player.vy=JUMP; player.jumpsLeft--; player._jh=true; sfxJump();
            spawnPart(player.x+player.w/2,player.y+player.h,'#87CEEB',6,2);
        }
        if (!wantJump) player._jh=false;
        if (isDown('ArrowDown')&&player.onGround&&!player.crouching) {
            player.crouching=true; player.y+=20; player.h=30;
        } else if (!isDown('ArrowDown')&&player.crouching) {
            player.crouching=false; player.y-=20; player.h=50;
        }
        if ((isDown('ShiftLeft')||isDown('ShiftRight'))&&player.dashCD<=0&&!player._dh) {
            player.dashTimer=DDUR; player.dashDir=player.facing;
            player.dashCD=35; player._dh=true; sfxDash();
            spawnPart(player.x+player.w/2,player.y+player.h/2,'#aaddff',5,2);
        }
        if (!isDown('ShiftLeft')&&!isDown('ShiftRight')) player._dh=false;
        if (isDown('KeyZ')&&player.attackCD<=0) {
            throwWater(); player.attackCD=18; player.attackTimer=10;
        }
        if (isDown('KeyX')&&player.shieldCD<=0&&player.faith>=30&&!player._xh) {
            castBlessing(); player.shieldCD=140; player._xh=true;
        }
        if (!isDown('KeyX')) player._xh=false;
    }
    player.vy+=GRAV; player.x+=player.vx; player.y+=player.vy;
    if (player.x<0) player.x=0;
    if (player.x+player.w>level.width) player.x=level.width-player.w;
    resolvePlat();
    if (player.y>585){killPlayer();return;}
    if (player.invincible<=0) {
        for (var i=0;i<level.enemies.length;i++) {
            var e=level.enemies[i];
            if (!e.alive||e.converted) continue;
            if (rectHit(player,e)){hurtPlayer();break;}
        }
    }
    for (var ci=0;ci<level.coins.length;ci++) {
        var c=level.coins[ci];
        if (!c.collected&&Math.abs(player.x-c.x)<30&&Math.abs(player.y+player.h/2-c.y)<35) {
            c.collected=true; score+=10; sfxPickup();
            spawnPart(c.x,c.y,'#FFD700',5,2);
        }
    }
    for (var hi=0;hi<level.health.length;hi++) {
        var h=level.health[hi];
        if (!h.collected&&Math.abs(player.x-h.x)<32&&Math.abs(player.y+player.h/2-h.y)<35) {
            h.collected=true;
            if (player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+2);sfxPickup();spawnPart(h.x,h.y,'#90EE90',8,2);}
        }
    }
    for (var cpi=0;cpi<level.checkpoints.length;cpi++) {
        var cp=level.checkpoints[cpi];
        if (!cp.active&&Math.abs(player.x-cp.x)<55) {
            cp.active=true; savedCP.x=cp.x; sfxCheckpoint();
            spawnPart(cp.x,cp.y-25,'#FFD700',10,3);
        }
    }
    if (gameState==='playing'&&player.x>=level.bossZone&&!bossTriggered) {
        bossTriggered=true; fadeOut(function(){startBoss();fadeIn();});
    }
}
function getNearestEnemy() {
    var nearest=null, minDist=700;
    var px=player.x+player.w/2, py=player.y+player.h/2;
    if (level) {
        for (var i=0;i<level.enemies.length;i++) {
            var e=level.enemies[i]; if (!e.alive||e.converted||e.praying) continue;
            var d=Math.abs(e.x+e.w/2-px)+Math.abs(e.y+e.h/2-py);
            if (d<minDist){minDist=d;nearest=e;}
        }
    }
    if (boss&&boss.alive&&!boss.defeated) {
        var bd=Math.abs(boss.x+boss.w/2-px)+Math.abs(boss.y+boss.h/2-py);
        if (bd<minDist){minDist=bd;nearest=boss;}
    }
    return nearest;
}
function throwWater() {
    sfxHolyWater();
    var ox=player.x+(player.facing===1?player.w:0), oy=player.y+player.h*0.4;
    var vx=player.facing*WSPD, vy=-0.8;
    var target=getNearestEnemy();
    if (target) {
        var tx=target.x+target.w/2, ty=target.y+target.h/2;
        var ddx=tx-ox, ddy=ty-oy;
        var dist=Math.sqrt(ddx*ddx+ddy*ddy)||1;
        vx=ddx/dist*WSPD; vy=ddy/dist*WSPD;
        player.facing=vx>0?1:-1;
    }
    playerProj.push({x:ox,y:oy,vx:vx,vy:vy,w:12,h:12,alive:true,anim:0});
}

function updEnemies() {

        if (e.y>=460){e.y=460;e.vy=0;}

// ---- PROJECTILE UPDATE ----
function updProj() {
    for (var i=playerProj.length-1;i>=0;i--) {
        var p=playerProj[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.anim++;
        if (p.x<camera.x-60||p.x>camera.x+1020||p.y>585){playerProj.splice(i,1);continue;}
        var hit=false;
        for (var j=0;j<level.enemies.length;j++) {
            var e=level.enemies[j]; if (!e.alive||e.converted) continue;
            if (p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y) {
                e.hp--; e.hitFlash=15; spawnHoly(e.x+e.w/2,e.y+e.h/2);
                if (e.hp<=0) {
                    e.converted=true; e.convertTimer=0;
                    spawnConvert(e.x+e.w/2,e.y+e.h/2); sfxConvert();
                    score+=50; comboCount++; comboTimer=120;
                    player.faith=Math.min(player.maxFaith,player.faith+22);
                }
                playerProj.splice(i,1); hit=true; break;
            }
        }
        if (hit) continue;
        if (boss&&boss.alive&&!boss.defeated&&boss.invincible<=0) {
            if (p.x<boss.x+boss.w&&p.x+p.w>boss.x&&p.y<boss.y+boss.h&&p.y+p.h>boss.y) {
                boss.hp--; boss.invincible=18; spawnHoly(boss.x+boss.w/2,boss.y+boss.h/2);
                sfxBossHit(); shakeTimer=5; score+=20; playerProj.splice(i,1);
                if (boss.hp<=20&&boss.phase===1){boss.phase=2;boss.attackCD=60;}
                if (boss.hp<=10&&boss.phase===2){boss.phase=3;boss.attackCD=40;}
                if (boss.hp<=0) {
                    boss.defeated=true; boss.transforming=true; boss.transformT=0;
                    stopMusic(); sfxAngel(); spawnConvert(boss.x+boss.w/2,boss.y+boss.h/2);
                    setTimeout(function(){gameState='victory';sfxVictory();},3200);
                }
            }
        }
    }
    for (var bi=bossProj.length-1;bi>=0;bi--) {
        var bp=bossProj[bi];
        bp.x+=bp.vx; bp.y+=bp.vy; bp.vy+=0.18; bp.anim++;
        if (bp.y>590||bp.x<camera.x-120||bp.x>camera.x+1080){bossProj.splice(bi,1);continue;}
        if (player&&!player.dead&&player.invincible<=0) {
            if (bp.x<player.x+player.w&&bp.x+bp.w>player.x&&bp.y<player.y+player.h&&bp.y+bp.h>player.y) {
                hurtPlayer(); bossProj.splice(bi,1);
            }
        }
    }
}

// ---- BOSS UPDATE ----
function updBoss() {
    if (!boss||!boss.alive) return;
    boss.animTimer++; if (boss.invincible>0) boss.invincible--;
    if (boss.defeated){boss.transformT++;return;}
    if (boss.attackTimer>0) boss.attackTimer--;
    var ph=boss.phase, aL=BOSS_X+40, aR=LEVEL_W-80;
    if (ph===1) {
        boss.x+=boss.vx; boss.vy+=GRAV; boss.y+=boss.vy;
        if (boss.y>=375){boss.y=375;boss.vy=0;boss.onGround=true;}
        if (boss.x<aL||boss.x+boss.w>aR) boss.vx*=-1;
    } else {
        boss.flyT++;
        boss.x+=boss.vx*(ph===3?2.1:1.5);
        boss.y+=Math.sin(boss.flyT*(ph===3?0.08:0.05))*(ph===3?3:2);
        boss.y=Math.max(150,Math.min(400,boss.y));
        if (boss.x<aL||boss.x+boss.w>aR) boss.vx*=-1;
    }
    if (player) boss.facing=player.x<boss.x+boss.w/2?-1:1;
    if (boss.attackTimer<=0&&player) {
        var cnt=ph===1?1:ph===2?2:3;
        var cx=boss.x+boss.w/2, cy=boss.y+boss.h/3;
        var dx=(player.x+player.w/2)-cx, dy=(player.y+player.h/2)-cy;
        var dist=Math.sqrt(dx*dx+dy*dy)||1, spd=3.5+ph;
        for (var f=0;f<cnt;f++) {
            var spread=(f-(cnt-1)/2)*0.35;
            bossProj.push({x:cx,y:cy,vx:(dx/dist)*spd+spread,vy:(dy/dist)*spd-0.8,w:16,h:16,anim:0});
        }
        sfxFireball(); boss.attackTimer=boss.attackCD;
    }
    if (player&&!player.dead&&player.invincible<=0&&rectHit(player,boss)) hurtPlayer();
}

// ---- MASTER UPDATE ----
function update() {
    fc++;
    for (var i=particles.length-1;i>=0;i--) {
        var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--;
        if (p.life<=0) particles.splice(i,1);
    }
    if (transDir===1){transAlpha+=0.05;if(transAlpha>=1){transAlpha=1;transDir=0;if(transCb){transCb();transCb=null;}}}
    else if (transDir===-1){transAlpha-=0.05;if(transAlpha<=0){transAlpha=0;transDir=0;}}
    if (shakeTimer>0) shakeTimer--;
    if (flashT>0) flashT--;
    if      (gameState==='title')    updTitle();
    else if (gameState==='story')    updStory();
    else if (gameState==='settings') updSettings();
    else if (gameState==='paused')   updPause();
    else if (gameState==='playing')  {
        updMovPlats(); updPlayer(); updEnemies(); updProj(); updCamera();
        for (var ci=0;ci<level.coins.length;ci++) level.coins[ci].anim++;
        for (var hi=0;hi<level.health.length;hi++) level.health[hi].anim++;
        for (var cpi=0;cpi<level.checkpoints.length;cpi++) level.checkpoints[cpi].anim++;
    }
    else if (gameState==='bossFight'){updMovPlats();updPlayer();updBoss();updProj();updCamera();}
    else if (gameState==='gameOver') {
        gameOverTimer++;
        if (gameOverTimer>100&&(isDown('Space')||isDown('Enter')||isDown('KeyZ'))) resetGame();
    }
    else if (gameState==='victory') {
        if (isDown('Space')||isDown('Enter')){gameState='title';stopMusic();}
    }
}

// ---- DRAW HELPERS ----
function lerpN(a,b,t){return a+(b-a)*t;}
function lerpC(c1,c2,t){
    var r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
    var r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
    return 'rgb('+Math.round(lerpN(r1,r2,t))+','+Math.round(lerpN(g1,g2,t))+','+Math.round(lerpN(b1,b2,t))+')';
}

function drawPalmBg(x,groundY,t,seed) {

        ctx.fillRect(p.x-camera.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
}
function drawBlessingWaves() {
    for (var i=blessingWaves.length-1;i>=0;i--) {
        var w=blessingWaves[i];
        w.r+=w.maxR/w.life; w.life--;
        if (w.life<=0){blessingWaves.splice(i,1);continue;}
        var alpha=w.life/40*0.7;
        ctx.globalAlpha=alpha;
        ctx.strokeStyle='#FFD700'; ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(w.x-camera.x,w.y,w.r,0,Math.PI*2);ctx.stroke();
        ctx.strokeStyle='rgba(255,255,200,0.5)'; ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(w.x-camera.x,w.y,w.r*0.7,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=1;
    }
}

// ---- MASTER DRAW ----
function draw() {
    ctx.clearRect(0,0,960,540);
    var st=gameState;
    if (st==='title') { drawTitle(); return; }
    if (st==='story') { drawStory(); return; }
    if (st==='settings') { drawSettings(); return; }
    if (st==='gameOver') { drawGameOver(); return; }
    if (st==='victory') { drawVictory(); return; }
    drawBg();
    drawPlatforms();
    drawCoins();
    drawHealth();
    drawCheckpoints();
    for (var ei=0;ei<level.enemies.length;ei++) drawPossessed(level.enemies[ei]);
    if (boss) drawDevil(boss);
    drawWater();
    drawFireballs();
    drawParticles();
    drawJesus(player.x-camera.x+player.w/2,player.y,player.facing,player.animTimer,player.attackTimer,player.invincible,0,player.faith,player.onGround,player.crouching);
    drawBlessingWaves();
    if (st==='paused') drawPause();
    if (st==='playing'||st==='bossFight'||st==='paused') { drawHUD(); drawBossHUD(); }
    if (transAlpha>0) { ctx.fillStyle='rgba(0,0,0,'+transAlpha+')'; ctx.fillRect(0,0,960,540); }
    drawVersion();
}

// ---- GAME LOOP ----
var lastTime=0;
function gameLoop(ts) {
    requestAnimationFrame(gameLoop);
    var dt=ts-lastTime; lastTime=ts;
    if (dt>80) dt=80;
    fc++;
    update();
    draw();
}

// ---- CANVAS RESIZE ----
function resizeCanvas() {
    var ww=window.innerWidth, wh=window.innerHeight;
    var sc=Math.min(ww/960,wh/540);
    canvas.style.width=(960*sc)+'px'; canvas.style.height=(540*sc)+'px';
    var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
    var cRect=canvas.getBoundingClientRect();
    var sz=Math.round(60*sc);
    var pad=Math.max(10,Math.round(12*sc));
    var cBot=Math.max(0,Math.round(wh-cRect.bottom));
    function showBtn(id,left,bottom,right,size) {
        var el=document.getElementById(id); if(!el) return;
        var s=size||sz;
        el.style.display=isTouch?'flex':'none';
        el.style.width=s+'px'; el.style.height=s+'px';
        el.style.bottom=(cBot+bottom)+'px';
        if(left!=null){el.style.left=left+'px';el.style.right='';}
        else{el.style.right=right+'px';el.style.left='';}
    }
    showBtn('btn-left',  pad,           pad,        null);
    showBtn('btn-right', pad*2+sz,      pad,        null);
    showBtn('btn-down',  pad+Math.round(sz/2), pad*2+sz, null);
    showBtn('btn-jump',  null, pad,               pad);
    showBtn('btn-z',     null, pad,               pad*2+sz);
    showBtn('btn-x',     null, pad,               pad*3+sz*2);
    showBtn('btn-dash',  null, pad*2+sz,          pad);
    var pEl=document.getElementById('btn-pause'); if(!pEl) return;
    var pSz=Math.round(44*sc);
    pEl.style.display=isTouch?'flex':'none';
    pEl.style.width=pSz+'px'; pEl.style.height=pSz+'px';
    pEl.style.right=pad+'px';
    pEl.style.top=(cRect.top>0?cRect.top:0)+pad+'px';
    pEl.style.bottom=''; pEl.style.left='';
}
window.addEventListener('resize',resizeCanvas);
window.addEventListener('load', function(){ setTimeout(resizeCanvas, 200); });
resizeCanvas();

// ---- CANVAS TOUCH PARA MENUS ----
function canvasTouchToGame(clientX, clientY) {
    var r=canvas.getBoundingClientRect();
    return {x:(clientX-r.left)*(960/r.width), y:(clientY-r.top)*(540/r.height)};
}
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault(); ensureAudio();
    var t=e.touches[0];
    var p=canvasTouchToGame(t.clientX, t.clientY);
    handleMenuTouch(p.x, p.y);
}, {passive:false});
canvas.addEventListener('click', function(e) {
    var p=canvasTouchToGame(e.clientX, e.clientY);
    handleMenuTouch(p.x, p.y);
});
function handleMenuTouch(cx, cy) {
    if (gameState==='title') {
        // Opciones en y=230,298,366 (alto ~46px cada una)
        var opts=[230,298,366];
        for (var i=0;i<opts.length;i++) {
            if (cy>=opts[i]-32&&cy<=opts[i]+18&&cx>=280&&cx<=680) {
                titleSel=i; _te=false;
                touchKeys['Enter']=true;
                setTimeout(function(){touchKeys['Enter']=false;},180);
                return;
            }
        }
        // tap fuera de opciones: confirmar seleccion actual
        touchKeys['Space']=true;
        setTimeout(function(){touchKeys['Space']=false;},180);
    } else if (gameState==='story'||gameState==='gameOver'||gameState==='victory') {
        touchKeys['Space']=true;
        setTimeout(function(){touchKeys['Space']=false;},180);
    } else if (gameState==='paused') {
        var popts=[215,280,345];
        for (var j=0;j<popts.length;j++) {
            if (cy>=popts[j]-28&&cy<=popts[j]+18&&cx>=280&&cx<=680) {
                pauseSel=j; _pen=false;
                touchKeys['Enter']=true;
                setTimeout(function(){touchKeys['Enter']=false;},180);
                return;
            }
        }
    } else if (gameState==='settings') {
        var sopts=[200,270];
        for (var k=0;k<sopts.length;k++) {
            if (cy>=sopts[k]-28&&cy<=sopts[k]+18&&cx>=280&&cx<=680) {
                settSel=k; _see=false;
                touchKeys['Enter']=true;
                setTimeout(function(){touchKeys['Enter']=false;},180);
                return;
            }
        }
        if (cy>380&&cy<420) { gameState='title'; }
    }
}

}
window.addEventListener('orientationchange',function(){setTimeout(checkOrientation,150);});

        navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW:',e);});

}
requestAnimationFrame(gameLoop);
