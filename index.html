                life: 40,
                damage: isGiant2 ? 3 : 2,
                w: isGiant2 ? 26 : 16, h: isGiant2 ? 10 : 6
            });
        }
    } else if (selectedSkin === 6 && unlockedSkins[6]) {
        // Chico Imán: lanza cuchillos al enemigo más cercano
        if ((isKeyDown('KeyX') || isKeyDown('KeyK')) && player.attackCooldown === 0) {
            player.attackCooldown = 8;
            sfxKnife();
            const isGiant2 = player.giantTimer > 0;
            const aim2 = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aim2.dx >= 0 ? player.w + 2 : -10),
                y: player.y + player.h * 0.35,
                vx: aim2.dx * 10,
                vy: aim2.dy * 10,
                type: 'knife',
                life: 45,
                damage: isGiant2 ? 4 : 2,
                w: isGiant2 ? 24 : 14, h: isGiant2 ? 8 : 4,
                rotation: 0
            });
        }
    } else if (selectedSkin === 7 && unlockedSkins[7]) {
        // Chica Masa: lanza hojas de papel con filo al enemigo más cercano
        if ((isKeyDown('KeyX') || isKeyDown('KeyK')) && player.attackCooldown === 0) {
            player.attackCooldown = 7;
            sfxPaper();
            const isGiant2 = player.giantTimer > 0;
            const aim2 = findNearestTarget();
            playerProjectiles.push({
                x: player.x + (aim2.dx >= 0 ? player.w + 2 : -10),
                y: player.y + player.h * 0.3,
                vx: aim2.dx * 9,
                vy: aim2.dy * 9,
                type: 'paperSheet',
                life: 50,
                damage: isGiant2 ? 3 : 2,
                w: isGiant2 ? 22 : 14, h: isGiant2 ? 18 : 10,
                rotation: 0
            });
        }
    } else if ((isKeyDown('KeyX') || isKeyDown('KeyK')) && player.attackCooldown === 0) {
        player.attackCooldown = 6;
        sfxNinjaStar();
        const isGiant2 = player.giantTimer > 0;
        const aim2 = findNearestTarget();
        playerProjectiles.push({
            x: player.x + (aim2.dx >= 0 ? player.w : -10),
            y: player.y + player.h * 0.35,
            vx: aim2.dx * 7,
            vy: aim2.dy * 7,
            type: 'ninjaStar',
            life: 60,
            damage: isGiant2 ? 4 : 2,
            w: isGiant2 ? 24 : 16, h: isGiant2 ? 24 : 16,
            rotation: 0
        });
    }
    
    // Gravity
    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;
    
    // Apply velocity
    player.x += player.vx;
    player.y += player.vy;
    
    // Platform collision
    playerPlatformCollision();
    
    // Boundaries
    if (player.x < 0) player.x = 0;
    if (gameState === 'bossFight') {
        if (player.x > level.bossZone + 680) player.x = level.bossZone + 680;
    }
    
    // Fall death
    if (player.y > canvas.height + 50) {
        damagePlayer(player.hp);
    }
    
    // Invincibility timer
    if (player.invincible > 0) player.invincible--;
    
    // Animation
    player.animTimer++;
    if (Math.abs(player.vx) > 0.5) {
        player.animFrame += 0.15;
    }
    
    // Star power regen
    // Star power regen (disabled - X attacks are direct now)
    
    // Check boss zone entry
    if (gameState === 'playing' && player.x > level.bossZone) {
        startBossFight();
    }
}

function updateEnemies() {
    for (const e of level.enemies) {
        if (!e.alive) continue;
        e.animTimer++;
        
        // Movement pattern
        if (e.type === 'bat' || e.type === 'ghost' || e.type === 'note') {
            e.x += e.vx;
            e.y += Math.sin(e.animTimer * 0.05) * 1.5;
            if (Math.abs(e.x - e.startX) > e.range) e.vx *= -1;
        } else {
            e.x += e.vx;
            if (Math.abs(e.x - e.startX) > e.range) e.vx *= -1;
        }
        
        // Check collision with player
        if (player.dead) continue;
        
        // Player projectile hits enemy
        for (let pi = playerProjectiles.length - 1; pi >= 0; pi--) {
            const p = playerProjectiles[pi];
            if (!isChicoInvisibleAndHidden() && rectCollision({x:p.x,y:p.y,w:p.w,h:p.h}, e)) {
                e.alive = false;
                score += 100;
                sfxBossHit();
                spawnParticles(e.x + e.w/2, e.y + e.h/2, p.type === 'laser' ? '#00ff00' : p.type === 'hammer' ? '#888' : p.type === 'fireRay' ? '#FF4500' : p.type === 'iceRay' ? '#00BFFF' : p.type === 'cookie' ? '#D2691E' : p.type === 'sodaLiquid' ? '#7CFC00' : p.type === 'teaCup' ? '#C0C0C0' : p.type === 'knife' ? '#C0C0C0' : p.type === 'stretchArm' ? '#FF0000' : p.type === 'paperSheet' ? '#f5f5f5' : '#FFD700', 8);
                player.starPower = Math.min(player.maxStarPower, player.starPower + 10);
                spawnDrop(e.x + e.w/2, e.y + e.h/2);
                addCombo();
                playerProjectiles.splice(pi, 1);
                break;
            }
        }
        if (!e.alive) continue;
        
        // Enemy damages player
        if (rectCollision(player, e)) {
            // Jump on top = kill
            if (player.vy > 0 && player.y + player.h < e.y + e.h * 0.5) {
                if (!isChicoInvisibleAndHidden()) {
                    e.alive = false;
                    player.vy = -8;
                    score += 100;
                    sfxCoin();
                    spawnParticles(e.x + e.w/2, e.y + e.h/2, '#FFD700', 6);
                    player.starPower = Math.min(player.maxStarPower, player.starPower + 10);
                    spawnDrop(e.x + e.w/2, e.y + e.h/2);
                    addCombo();
                } else {
                    player.vy = -8;
                }
            } else {
                if (!isChicoInvisibleAndHidden()) {
                    damagePlayer(1);
                }
            }
        }
    }
}

function updateCoins() {
    for (const c of level.coins) {
        if (c.collected) continue;
        c.animTimer++;
        
        if (Math.abs(player.x + player.w/2 - c.x) < 20 && Math.abs(player.y + player.h/2 - c.y) < 20) {
            c.collected = true;
            score += 50;
            totalCoins += 50;
            saveMarketData();
            sfxCoin();
            spawnParticles(c.x, c.y, '#FFD700', 5, 2);
            player.starPower = Math.min(player.maxStarPower, player.starPower + 5);
        }
    }
}

function updatePowerUps() {
    for (const pu of level.powerUps) {
        if (pu.collected) continue;
        pu.animTimer++;
        const pickupRange = player.giantTimer > 0 ? 35 : 22;
        if (Math.abs(player.x + player.w/2 - pu.x) < pickupRange && Math.abs(player.y + player.h/2 - pu.y) < pickupRange) {
            pu.collected = true;
            sfxWin();
            if (pu.type === 'giant') {
                player.giantTimer = 480; // 8 seconds
                player.w = player.baseW * 2;
                player.h = player.baseH * 2;
                player.y -= player.baseH; // push up so not stuck in ground
                spawnParticles(pu.x, pu.y, '#1a237e', 10, 3);
            } else if (pu.type === 'fly') {
                player.flyTimer = 480; // 8 seconds
                spawnParticles(pu.x, pu.y, '#9C27B0', 10, 3);
            }
            score += 200;
            totalCoins += 200;
            saveMarketData();
        }
    }
}

function updateBurgers() {
    for (const b of level.burgers) {
        if (b.collected) continue;
        b.animTimer++;
        const pickupRange = player.giantTimer > 0 ? 35 : 22;
        if (Math.abs(player.x + player.w/2 - b.x) < pickupRange && Math.abs(player.y + player.h/2 - b.y) < pickupRange) {
            b.collected = true;
            player.hp = player.maxHp;
            sfxCoin();
            sfxWin();
            spawnParticles(b.x, b.y, '#4CAF50', 8, 2);
            spawnParticles(b.x, b.y, '#FFC107', 6, 3);
            score += 100;
        }
    }
}

function spawnDrop(x, y) {
    const roll = Math.random();
    if (roll < 0.25) {
        level.drops.push({ x, y, vy: -3, type: 'heart', life: 300, animTimer: 0 });
    } else if (roll < 0.5) {
        level.drops.push({ x, y, vy: -3, type: 'star', life: 300, animTimer: 0 });
    }
}

function updateDrops() {
    for (let i = level.drops.length - 1; i >= 0; i--) {
        const d = level.drops[i];
        d.animTimer++;
        d.vy += 0.15;
        d.y += d.vy;
        d.life--;
        // Land on ground
        if (d.y > 490) { d.y = 490; d.vy = 0; }
        // Collect
        if (Math.abs(player.x + player.w/2 - d.x) < 20 && Math.abs(player.y + player.h/2 - d.y) < 20) {
            if (d.type === 'heart') {
                player.hp = Math.min(player.maxHp, player.hp + 1);
                spawnParticles(d.x, d.y, '#f44336', 5, 2);
            } else {
                player.starPower = Math.min(player.maxStarPower, player.starPower + 25);
                spawnParticles(d.x, d.y, '#FFD700', 5, 2);
            }
            sfxCoin();
            level.drops.splice(i, 1);
            continue;
        }
        if (d.life <= 0) { level.drops.splice(i, 1); }
    }
}

function drawDrops() {
    for (const d of level.drops) {
        const x = d.x - camera.x;
        const bob = Math.sin(d.animTimer * 0.1) * 2;
        const blink = d.life < 60 && Math.floor(d.life / 4) % 2 === 0;
        if (blink) continue;
        if (d.type === 'heart') {
            ctx.fillStyle = '#f44336';
            ctx.font = '16px Arial';
            ctx.fillText('♥', x - 6, d.y + bob + 6);
        } else {
            ctx.fillStyle = '#FFD700';
            drawStar(x, d.y + bob, 7, 3, 5);
        }
    }
}

function updateCheckpoints() {
    for (const cp of level.checkpoints) {
        cp.animTimer++;
        if (cp.activated) continue;
        if (Math.abs(player.x + player.w/2 - cp.x) < 30 && Math.abs(player.y + player.h/2 - cp.y) < 40) {
            cp.activated = true;
            savedCheckpoint = { level: currentLevel, score: score, x: cp.x };
            sfxWin();
            spawnParticles(cp.x, cp.y - 20, '#FFD700', 10, 3);
            spawnParticles(cp.x, cp.y - 20, '#00d4ff', 8, 2);
        }
    }
}

function drawCheckpoints() {
    for (const cp of level.checkpoints) {
        const x = cp.x - camera.x;
        if (x < -40 || x > canvas.width + 40) continue;
        // Flag pole
        ctx.fillStyle = '#888';
        ctx.fillRect(x - 2, cp.y - 50, 4, 55);
        // Flag
        if (cp.activated) {
            ctx.fillStyle = '#FFD700';
            const wave = Math.sin(cp.animTimer * 0.08) * 3;
            ctx.beginPath();
            ctx.moveTo(x + 2, cp.y - 48);
            ctx.lineTo(x + 25 + wave, cp.y - 40);
            ctx.lineTo(x + 2, cp.y - 30);
            ctx.closePath();
            ctx.fill();
            // Star on flag
            ctx.fillStyle = '#fff';
            drawStar(x + 12, cp.y - 39, 5, 2, 5);
            // Glow
            ctx.save();
            ctx.globalAlpha = Math.sin(cp.animTimer * 0.1) * 0.15 + 0.15;
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x, cp.y - 35, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
        } else {
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.moveTo(x + 2, cp.y - 48);
            ctx.lineTo(x + 20, cp.y - 40);
            ctx.lineTo(x + 2, cp.y - 30);
            ctx.closePath();
            ctx.fill();
        }
        // Base
        ctx.fillStyle = '#666';
        ctx.fillRect(x - 6, cp.y + 2, 12, 6);
    }
}

function updateCombo() {
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer === 0) comboCount = 0;
    }
}

function addCombo() {
    comboCount++;
    comboTimer = 120; // 2 seconds to chain
    if (comboCount > 1) {
        score += comboCount * 25; // bonus points for combos
    }
}

function updateBoss() {
    if (!boss || !boss.alive) return;
    boss.animTimer++;
    if (boss.invincible > 0) boss.invincible--;
    
    // Spawn boss burgers one at a time
    if (bossBurgerCount < bossBurgerMax) {
        bossBurgerTimer++;
        if (bossBurgerTimer >= bossBurgerInterval) {
            bossBurgerTimer = 0;
            bossBurgerCount++;
            const bz = level.bossZone;
            level.burgers.push({
                x: bz + 80 + Math.random() * 520,
                y: 460,
                collected: false,
                animTimer: Math.random() * 100
            });
        }
    }
    
    // Phase updates based on HP
    if (boss.hp < boss.maxHp * 0.3) boss.phase = 2;
    else if (boss.hp < boss.maxHp * 0.6) boss.phase = 1;
    
    const speedMult = 1 + boss.phase * 0.3;
    
    // Boss AI by type
    if (boss.type === 'mocuson') {
        // Move towards player
        if (player.x > boss.x + 20) boss.x += boss.vx * speedMult;
        else if (player.x < boss.x - 20) boss.x -= boss.vx * speedMult;
        
        // Attack: shoot snot balls
        boss.attackTimer++;
        const cooldown = boss.attackCooldown - boss.phase * 20;
        if (boss.attackTimer >= cooldown) {
            boss.attackTimer = 0;
            const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
            boss.projectiles.push({
                x: boss.x + boss.w/2, y: boss.y + boss.h * 0.5,
                vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4,
                type: 'snot', life: 120
            });
            if (boss.phase >= 1) {
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h * 0.3,
                    vx: Math.cos(angle - 0.3) * 3.5, vy: Math.sin(angle - 0.3) * 3.5,
                    type: 'snot', life: 120
                });
            }
            if (boss.phase >= 2) {
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h * 0.7,
                    vx: Math.cos(angle + 0.3) * 3.5, vy: Math.sin(angle + 0.3) * 3.5,
                    type: 'snot', life: 120
                });
            }
        }
    } else if (boss.type === 'romecio') {
        // Romecio lunges
        const dist = player.x - boss.x;
        boss.x += Math.sign(dist) * boss.vx * speedMult * 0.7;
        
        // Slam attack when close
        boss.attackTimer++;
        if (boss.attackTimer >= boss.attackCooldown - boss.phase * 15) {
            boss.attackTimer = 0;
            // Throw cloth scraps
            for (let i = 0; i < 2 + boss.phase; i++) {
                const angle = Math.random() * Math.PI * 2;
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + 20,
                    vx: Math.cos(angle) * (3 + Math.random() * 2),
                    vy: -4 - Math.random() * 3,
                    type: 'cloth', life: 90,
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }
        
        // Body slam damage when close (but NOT if player is above = jumping on)
        if (rectCollision(player, {x: boss.x, y: boss.y, w: boss.w, h: boss.h})) {
            if (!(player.vy > 0 && player.y + player.h < boss.y + boss.h * 0.5)) {
                if (!isChicoInvisibleAndHidden()) damagePlayer(1);
            }
        }
    } else if (boss.type === 'cambiaformas') {
        // Chase player (no teleport)
        const dx = player.x - boss.x;
        const dy = player.y - boss.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d > 0) {
            boss.x += (dx/d) * boss.vx * speedMult;
        }
        
        // Shoot dark stars
        boss.attackTimer++;
        if (boss.attackTimer >= boss.attackCooldown - boss.phase * 12) {
            boss.attackTimer = 0;
            const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
            for (let i = 0; i < 1 + boss.phase; i++) {
                const spread = (i - boss.phase/2) * 0.4;
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                    vx: Math.cos(angle + spread) * 5,
                    vy: Math.sin(angle + spread) * 5,
                    type: 'darkstar', life: 100
                });
            }
        }
        
        // Body collision (not when jumping on top)
        if (rectCollision(player, {x: boss.x, y: boss.y, w: boss.w, h: boss.h})) {
            if (!(player.vy > 0 && player.y + player.h < boss.y + boss.h * 0.5)) {
                if (!isChicoInvisibleAndHidden()) damagePlayer(1);
            }
        }
    } else if (boss.type === 'monstruocama') {
        // Chase player aggressively
        const dx = player.x - boss.x;
        const dy = player.y - boss.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d > 0) {
            boss.x += (dx/d) * boss.vx * speedMult;
        }
        
        // Shoot shadow projectiles
        boss.attackTimer++;
        if (boss.attackTimer >= boss.attackCooldown - boss.phase * 18) {
            boss.attackTimer = 0;
            const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
            boss.projectiles.push({
                x: boss.x + boss.w/2, y: boss.y + boss.h * 0.4,
                vx: Math.cos(angle) * 4.5, vy: Math.sin(angle) * 4.5,
                type: 'shadow', life: 110
            });
            if (boss.phase >= 1) {
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h * 0.4,
                    vx: Math.cos(angle - 0.35) * 4, vy: Math.sin(angle - 0.35) * 4,
                    type: 'shadow', life: 110
                });
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h * 0.4,
                    vx: Math.cos(angle + 0.35) * 4, vy: Math.sin(angle + 0.35) * 4,
                    type: 'shadow', life: 110
                });
            }
            if (boss.phase >= 2) {
                for (let i = 0; i < 5; i++) {
                    const spread = (i - 2) * 0.4;
                    boss.projectiles.push({
                        x: boss.x + boss.w/2, y: boss.y + boss.h * 0.4,
                        vx: Math.cos(angle + spread) * 4, vy: Math.sin(angle + spread) * 4,
                        type: 'shadow', life: 100
                    });
                }
            }
        }
        // Body collision
        if (rectCollision(player, {x: boss.x, y: boss.y, w: boss.w, h: boss.h})) {
            if (!(player.vy > 0 && player.y + player.h < boss.y + boss.h * 0.5)) {
                if (!isChicoInvisibleAndHidden()) damagePlayer(1);
            }
        }
    } else if (boss.type === 'maelado') {
        // Move slowly towards player
        const dist = player.x - boss.x;
        boss.x += Math.sign(dist) * boss.vx * speedMult * 0.6;
        
        // Shoot ice cream projectiles with gravity
        boss.attackTimer++;
        if (boss.attackTimer >= boss.attackCooldown - boss.phase * 12) {
            boss.attackTimer = 0;
            const angle = Math.atan2(player.y - boss.y - 50, player.x - boss.x);
            boss.projectiles.push({
                x: boss.x + boss.w/2, y: boss.y + boss.h * 0.3,
                vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 3 - 2,
                type: 'icecream', life: 120, gravity: true
            });
            if (boss.phase >= 1) {
                for (let i = -1; i <= 1; i++) {
                    boss.projectiles.push({
                        x: boss.x + boss.w/2, y: boss.y + boss.h * 0.3,
                        vx: Math.cos(angle + i * 0.3) * 3.5, vy: Math.sin(angle + i * 0.3) * 2.5 - 2,
                        type: 'icecream', life: 120, gravity: true
                    });
                }
            }
            if (boss.phase >= 2) {
                for (let i = 0; i < 5; i++) {
                    boss.projectiles.push({
                        x: boss.x + boss.w/2 + (i - 2) * 30, y: boss.y - 20,
                        vx: (Math.random() - 0.5) * 2, vy: 2,
                        type: 'icecream', life: 150, gravity: true
                    });
                }
            }
        }
    } else if (boss.type === 'timbroso') {
        // Bounces around erratically
        boss.x += boss.vx * speedMult * (Math.sin(boss.animTimer * 0.05) > 0 ? 1 : -1);
        boss.y += Math.sin(boss.animTimer * 0.08) * 2;
        
        // Shoot soundwave projectiles
        boss.attackTimer++;
        const cd = boss.attackCooldown - boss.phase * 14;
        if (boss.attackTimer >= cd) {
            boss.attackTimer = 0;
            const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
            boss.projectiles.push({
                x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5,
                type: 'soundwave', life: 60
            });
            if (boss.phase >= 1) {
                shakeTimer = 8;
                shakeIntensity = 4;
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                    vx: Math.cos(angle - 0.5) * 4.5, vy: Math.sin(angle - 0.5) * 4.5,
                    type: 'soundwave', life: 60
                });
                boss.projectiles.push({
                    x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                    vx: Math.cos(angle + 0.5) * 4.5, vy: Math.sin(angle + 0.5) * 4.5,
                    type: 'soundwave', life: 60
                });
            }
            if (boss.phase >= 2) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i;
                    boss.projectiles.push({
                        x: boss.x + boss.w/2, y: boss.y + boss.h/2,
                        vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5,
                        type: 'soundwave', life: 50
                    });
                }
                shakeTimer = 12;
                shakeIntensity = 6;
            }
        }
        // Body collision
        if (rectCollision(player, {x: boss.x, y: boss.y, w: boss.w, h: boss.h})) {
            if (!(player.vy > 0 && player.y + player.h < boss.y + boss.h * 0.5)) {
                if (!isChicoInvisibleAndHidden()) damagePlayer(1);
            }
        }
    }
    
    // Update projectiles
    for (let i = boss.projectiles.length - 1; i >= 0; i--) {
        const p = boss.projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.type === 'cloth') {
            p.vy += 0.15; // gravity for cloth
            p.angle += p.rotSpeed;
        }
        if (p.gravity) {
            p.vy += 0.12;
        }
        p.life--;
        if (p.life <= 0) {
            boss.projectiles.splice(i, 1);
            continue;
        }
        // Hit player
        if (!player.dead && !isChicoInvisibleAndHidden() && rectCollision({x:p.x-6,y:p.y-6,w:12,h:12}, player)) {
            damagePlayer(1);
            boss.projectiles.splice(i, 1);
        }
    }
    
    // Boss boundary
    boss.x = Math.max(level.bossZone, Math.min(boss.x, level.bossZone + 680 - boss.w));
    boss.y = Math.max(200, Math.min(boss.y, 500 - boss.h));
    
    // Player projectiles hit boss
    for (let pi = playerProjectiles.length - 1; pi >= 0; pi--) {
        const p = playerProjectiles[pi];
        if (!isChicoInvisibleAndHidden() && boss.invincible === 0 && rectCollision({x:p.x,y:p.y,w:p.w,h:p.h}, {x:boss.x,y:boss.y,w:boss.w,h:boss.h})) {
            boss.hp -= p.damage;
            boss.invincible = 15;
            sfxBossHit();
            shakeTimer = 5;
            shakeIntensity = 3;
            spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, p.type === 'laser' ? '#00ff00' : p.type === 'hammer' ? '#888' : p.type === 'fireRay' ? '#FF4500' : p.type === 'iceRay' ? '#00BFFF' : p.type === 'cookie' ? '#D2691E' : p.type === 'sodaLiquid' ? '#7CFC00' : p.type === 'teaCup' ? '#C0C0C0' : p.type === 'knife' ? '#C0C0C0' : p.type === 'stretchArm' ? '#FF0000' : p.type === 'paperSheet' ? '#f5f5f5' : '#FFD700', 6);
            score += 50;
            screenFlash = { timer: 4, color: '#FFD700' };
            playerProjectiles.splice(pi, 1);
            if (boss.hp <= 0) {
                boss.alive = false;
                score += 1000;
                sfxWin();
                spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#FFD700', 20, 5);
                shakeTimer = 30;
                shakeIntensity = 8;
                screenFlash = { timer: 15, color: '#fff' };
                gameState = 'levelComplete';
                levelCompleteTimer = 0;
                stopMusic();
            }
        }
    }
    
    // Jump on boss
    if (!player.dead && !isChicoInvisibleAndHidden() && player.vy > 0 && rectCollision(player, {x:boss.x,y:boss.y,w:boss.w,h:boss.h})) {
        if (player.y + player.h < boss.y + boss.h * 0.4 && boss.invincible === 0) {
            boss.hp -= 1;
            boss.invincible = 20;
            player.vy = -10;
            sfxBossHit();
            spawnParticles(boss.x + boss.w/2, boss.y, '#FFD700', 4);
            score += 50;
            screenFlash = { timer: 4, color: '#FFD700' };
            if (boss.hp <= 0) {
                boss.alive = false;
                score += 1000;
                sfxWin();
                spawnParticles(boss.x + boss.w/2, boss.y + boss.h/2, '#FFD700', 20, 5);
                shakeTimer = 30;
                shakeIntensity = 8;
                screenFlash = { timer: 15, color: '#fff' };
                gameState = 'levelComplete';
                levelCompleteTimer = 0;
                stopMusic();
            }
        }
    }
}

function updatePlayerProjectiles() {
    for (let i = playerProjectiles.length - 1; i >= 0; i--) {
        const p = playerProjectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.type === 'ninjaStar') {
            p.rotation = (p.rotation || 0) + 0.3;
        }
        if (p.type === 'hammer') {
            p.rotation = (p.rotation || 0) + 0.25;
        }
        if (p.type === 'cookie') {
            p.rotation = (p.rotation || 0) + 0.15;
        }
        if (p.type === 'knife' || p.type === 'paperSheet') {
            p.rotation = (p.rotation || 0) + 0.35;
        }
        p.life--;
        if (p.life <= 0 || p.x < camera.x - 50 || p.x > camera.x + canvas.width + 50 || p.y > 550) {
            playerProjectiles.splice(i, 1);
        }
    }
}

function drawPlayerProjectiles() {
    for (const p of playerProjectiles) {
        const sx = p.x - camera.x;
        if (p.type === 'laser') {
            // Green eye laser beam (no shadowBlur for performance)
            ctx.save();
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(sx - 2, p.y - 2, p.w + 4, p.h + 4);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.fillStyle = '#aaffaa';
            ctx.fillRect(sx + 2, p.y + 1, p.w - 4, 2);
            ctx.restore();
        } else if (p.type === 'ninjaStar') {
            // Yellow spinning ninja shuriken
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#FFD700';
            drawShuriken(0, 0, 10);
            ctx.fillStyle = '#FFA000';
            drawShuriken(0, 0, 4);
            ctx.restore();
        } else if (p.type === 'hammer') {
            // Spinning hammer projectile
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            const hw = p.w, hh = p.h;
            // Handle (brown)
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-hw*0.08, -hh*0.05, hw*0.16, hh*0.55);
            // Head (gray)
            ctx.fillStyle = '#888';
            ctx.fillRect(-hw*0.35, -hh*0.5, hw*0.7, hh*0.35);
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(-hw*0.2, -hh*0.45, hw*0.15, hh*0.2);
            ctx.restore();
        } else if (p.type === 'fireRay') {
            // Orange/red fire ray from hands
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#FF4500';
            ctx.fillRect(sx - 2, p.y - 3, p.w + 4, p.h + 6);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#FF6600';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.fillStyle = '#FFAA00';
            ctx.fillRect(sx + 2, p.y + 1, p.w - 4, Math.max(1, p.h - 2));
            // Flickering flame tips
            const flicker = Math.sin(Date.now() * 0.02) * 2;
            ctx.fillStyle = '#FF2200';
            ctx.fillRect(sx + p.w - 4, p.y - 1 + flicker, 4, p.h + 2);
            ctx.restore();
        } else if (p.type === 'iceRay') {
            // Blue/cyan ice ray from hands
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#00BFFF';
            ctx.fillRect(sx - 2, p.y - 3, p.w + 4, p.h + 6);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#00CED1';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.fillStyle = '#E0FFFF';
            ctx.fillRect(sx + 2, p.y + 1, p.w - 4, Math.max(1, p.h - 2));
            // Ice crystal sparkle
            ctx.fillStyle = '#fff';
            const sparkle = Math.sin(Date.now() * 0.03) > 0 ? 1 : 0;
            if (sparkle) {
                ctx.fillRect(sx + p.w * 0.3, p.y - 1, 2, 2);
                ctx.fillRect(sx + p.w * 0.7, p.y + p.h - 1, 2, 2);
            }
            ctx.restore();
        } else if (p.type === 'cookie') {
            // Brown cookie with chocolate chips
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#D2691E';
            ctx.beginPath();
            ctx.arc(0, 0, p.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#3E2723';
            ctx.fillRect(-3, -2, 3, 3);
            ctx.fillRect(2, 1, 3, 3);
            ctx.fillRect(-1, -5, 2, 2);
            ctx.restore();
        } else if (p.type === 'sodaLiquid') {
            // Fizzy green/brown liquid stream
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(sx - 2, p.y - 2, p.w + 4, p.h + 4);
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = '#7CFC00';
            ctx.fillRect(sx, p.y, p.w, p.h);
            // Bubbles
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.6;
            const bub = Math.sin(Date.now() * 0.05) * 2;
            ctx.beginPath();
            ctx.arc(sx + p.w * 0.3, p.y + bub, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sx + p.w * 0.7, p.y - bub + p.h, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
        } else if (p.type === 'teaCup') {
            // Metal tea cup
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            // Cup body (silver/gray)
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(-p.w/2, -p.h/3, p.w, p.h * 0.65);
            // Cup rim
            ctx.fillStyle = '#888';
            ctx.fillRect(-p.w/2 - 1, -p.h/3, p.w + 2, 2);
            // Handle
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(p.w/2 + 3, 0, 4, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            // Steam
            ctx.strokeStyle = 'rgba(200,200,200,0.5)';
            ctx.lineWidth = 1;
            const steam = Math.sin(Date.now() * 0.01) * 2;
            ctx.beginPath();
            ctx.moveTo(-2, -p.h/3 - 2);
            ctx.quadraticCurveTo(steam, -p.h/3 - 6, -1, -p.h/3 - 10);
            ctx.stroke();
            ctx.restore();
        } else if (p.type === 'knife') {
            // Silver throwing knife
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            // Blade
            ctx.fillStyle = '#C0C0C0';
            ctx.beginPath();
            ctx.moveTo(-p.w/2, 0);
            ctx.lineTo(0, -p.h/2);
            ctx.lineTo(p.w/2, 0);
            ctx.lineTo(0, p.h/2);
            ctx.closePath();
            ctx.fill();
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.moveTo(-p.w/4, 0);
            ctx.lineTo(0, -p.h/4);
            ctx.lineTo(p.w/4, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        } else if (p.type === 'stretchArm') {
            // Extending fist (yellow arm + red glove)
            ctx.save();
            // Arm trail (yellow)
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(sx, p.y + 1, p.w * 0.7, p.h - 2);
            // Fist (red glove)
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(sx + p.w, p.y + p.h/2, p.h * 0.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (p.type === 'paperSheet') {
            // White paper sheet with sharp edge
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            // Fold line
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-p.w/4, -p.h/2);
            ctx.lineTo(-p.w/4, p.h/2);
            ctx.stroke();
            // Sharp edge highlight
            ctx.fillStyle = '#ccc';
            ctx.fillRect(p.w/2 - 1, -p.h/2, 1, p.h);
            ctx.restore();
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateCamera() {
    const targetX = player.x - canvas.width / 3;
    camera.x += (targetX - camera.x) * 0.08;
    if (camera.x < 0) camera.x = 0;
    if (gameState === 'bossFight') {
        camera.x = level.bossZone - 20;
    } else {
        const maxCam = level.width - canvas.width;
        if (camera.x > maxCam) camera.x = maxCam;
    }
}

function drawTutorial() {
    // White sky background
    ctx.fillStyle = '#e8e8f0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Soft grid on background for depth
    ctx.strokeStyle = '#d0d0d8';
    ctx.lineWidth = 1;
    const gOffset = camera.x % 80;
    for (let gx = -gOffset; gx < canvas.width + 80; gx += 80) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
    }
    for (let gy = 0; gy < canvas.height; gy += 80) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
    }

    // Draw platforms
    for (const p of level.platforms) {
        const sx = p.x - camera.x;
        if (sx > canvas.width + 40 || sx < -80) continue;
        if (p.type === 'ground') {
            ctx.fillStyle = '#888';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.fillStyle = '#6b6';
            ctx.fillRect(sx, p.y, p.w, 6);
        } else {
            ctx.fillStyle = '#aaa';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.fillStyle = '#ccc';
            ctx.fillRect(sx, p.y, p.w, 4);
        }
    }

    // Draw power-up rings
    for (const pu of level.powerUps) {
        if (pu.collected) continue;
        const sx = pu.x - camera.x;
        if (sx < -40 || sx > canvas.width + 40) continue;
        const bob = Math.sin(pu.animTimer * 0.08) * 5;
        const ry = pu.y + bob;
        ctx.save();
        ctx.translate(sx, ry);
        if (pu.type === 'giant') {
            ctx.strokeStyle = '#1a237e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#283593';
            ctx.fillRect(-4, -4, 8, 8);
        } else {
            ctx.strokeStyle = '#9C27B0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#7B1FA2';
            const a = pu.animTimer * 0.1;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * 5, Math.sin(a) * 5, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Draw projectiles
    for (const p of playerProjectiles) {
        const sx = p.x - camera.x;
        if (p.type === 'laser') {
            ctx.fillStyle = '#00cc00';
            ctx.fillRect(sx, p.y, p.w, p.h);
        } else if (p.type === 'ninjaStar') {
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#FFD700';
            drawShuriken(0, 0, 8);
            ctx.fillStyle = '#FFA000';
            drawShuriken(0, 0, 3);
            ctx.restore();
        } else if (p.type === 'hammer') {
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-p.w*0.08, -p.h*0.05, p.w*0.16, p.h*0.55);
            ctx.fillStyle = '#888';
            ctx.fillRect(-p.w*0.35, -p.h*0.5, p.w*0.7, p.h*0.35);
            ctx.restore();
        } else if (p.type === 'fireRay') {
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#FF4500';
            ctx.fillRect(sx - 1, p.y - 2, p.w + 2, p.h + 4);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#FF6600';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.restore();
        } else if (p.type === 'iceRay') {
            ctx.save();
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = '#00BFFF';
            ctx.fillRect(sx - 1, p.y - 2, p.w + 2, p.h + 4);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#00CED1';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.restore();
        } else if (p.type === 'cookie') {
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#D2691E';
            ctx.beginPath();
            ctx.arc(0, 0, p.w/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#3E2723';
            ctx.fillRect(-2, -1, 2, 2);
            ctx.fillRect(1, 1, 2, 2);
            ctx.restore();
        } else if (p.type === 'sodaLiquid') {
            ctx.save();
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = '#7CFC00';
            ctx.fillRect(sx, p.y, p.w, p.h);
            ctx.globalAlpha = 1;
            ctx.restore();
        } else if (p.type === 'teaCup') {
            ctx.save();
            ctx.fillStyle = '#C0C0C0';
            ctx.fillRect(sx, p.y, p.w, p.h * 0.7);
            ctx.fillStyle = '#888';
            ctx.fillRect(sx, p.y, p.w, 2);
            ctx.restore();
        } else if (p.type === 'knife') {
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#C0C0C0';
            ctx.beginPath();
            ctx.moveTo(-p.w/2, 0);
            ctx.lineTo(0, -p.h/2);
            ctx.lineTo(p.w/2, 0);
            ctx.lineTo(0, p.h/2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        } else if (p.type === 'stretchArm') {
            ctx.save();
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(sx, p.y + 1, p.w * 0.7, p.h - 2);
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(sx + p.w, p.y + p.h/2, p.h * 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        } else if (p.type === 'paperSheet') {
            ctx.save();
            ctx.translate(sx + p.w/2, p.y + p.h/2);
            ctx.rotate(p.rotation);
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
        }
    }

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Draw player
    const px = player.x - camera.x;
    drawPlayerCharacter(px, player.y, player.w, player.h,
        player.facing, player.animTimer, player.attacking, player.invincible,
        false, player.isRunning);

    // Draw tutorial instruction sign
    const sign = getVisibleTutorialSign();
    if (sign) {
        const boxW = 320, boxH = 110;
        const boxX = canvas.width / 2 - boxW / 2;
        const boxY = 30;

        // Sign background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
        roundRect(ctx, boxX, boxY, boxW, boxH, 14, true, false);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        roundRect(ctx, boxX, boxY, boxW, boxH, 14, false, true);

        // Icon
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText(sign.icon, boxX + 30, boxY + 45);

        // Text
        ctx.font = 'bold 15px Arial';
        ctx.fillStyle = '#FFD700';
        ctx.textAlign = 'left';
        const lines = sign.text.split('\n');
        for (let i = 0; i < lines.length; i++) {
            const isLabel = !lines[i].startsWith('   ');
            ctx.fillStyle = isLabel ? '#FFD700' : '#fff';
            ctx.font = isLabel ? 'bold 15px Arial' : '14px Arial';
            ctx.fillText(lines[i], boxX + 56, boxY + 30 + i * 20);
        }
    }

    // HUD: power-up timers
    if (player.giantTimer > 0) {
        ctx.fillStyle = '#1a237e';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('💎 GIGANTE', 12, 170);
        ctx.fillStyle = '#333';
        ctx.fillRect(12, 175, 100, 12);
        ctx.fillStyle = '#283593';
        ctx.fillRect(12, 175, 100 * (player.giantTimer / 480), 12);
    }
    if (player.flyTimer > 0) {
        const fy = player.giantTimer > 0 ? 195 : 170;
        ctx.fillStyle = '#7B1FA2';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('🌀 VUELO', 12, fy);
        ctx.fillStyle = '#333';
        ctx.fillRect(12, fy + 5, 100, 12);
        ctx.fillStyle = '#9C27B0';
        ctx.fillRect(12, fy + 5, 100 * (player.flyTimer / 480), 12);
    }

    // Dash cooldown bar
    if (player.dashCooldown > 0) {
        ctx.fillStyle = '#333';
        ctx.fillRect(12, 155, 60, 8);
        ctx.fillStyle = '#00bcd4';
        ctx.fillRect(12, 155, 60 * (1 - player.dashCooldown / 45), 8);
    }

    // Label "NIVEL DE PRUEBA"
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('NIVEL DE PRUEBA — P para pausar', canvas.width / 2, canvas.height - 12);
    ctx.textAlign = 'left';
}

// ---- MAIN UPDATE ----
function update() {
    if (gameState === 'playing') {
        updateMovingPlatforms();
        updatePlayer();
        updateEnemies();
        updateCoins();
        updatePowerUps();
        updateBurgers();
        updateDrops();
        updateCheckpoints();
        updateCombo();
        updatePlayerProjectiles();
        updateCamera();
        updateParticles();
        if (screenFlash.timer > 0) screenFlash.timer--;
    } else if (gameState === 'bossFight') {
        updateMovingPlatforms();
        updatePlayer();
        updateBoss();
        updateBurgers();
        updateDrops();
        updateCombo();
        updatePlayerProjectiles();
        updateCamera();
        updateParticles();
        if (screenFlash.timer > 0) screenFlash.timer--;
    } else if (gameState === 'paused') {
        // do nothing, game is paused
    } else if (gameState === 'bonus') {
        updateBonus();
    } else if (gameState === 'tutorial') {
        updateTutorial();
    } else if (gameState === 'market') {
        updateMarket();
    } else if (gameState === 'levelComplete') {
        levelCompleteTimer++;
        updateParticles();
        if (levelCompleteTimer > 180 && transitionDir === 0) {
            if (currentLevel < 5) {
                if ((currentLevel + 1) % 3 === 0) {
                    fadeOut(() => {
                        initBonus();
                        gameState = 'bonus';
                        fadeIn();
                    });
                } else {
                    fadeOut(() => {
                        currentLevel++;
                        storyIndex = 0;
                        gameState = 'story';
                        fadeIn();
                    });
                }
            } else {
                fadeOut(() => {
                    initBonus();
                    gameState = 'bonus';
                    fadeIn();
                });
            }
        }
    } else if (gameState === 'gameOver') {
        gameOverTimer++;
    }
    
    // Screen shake
    if (shakeTimer > 0) shakeTimer--;
    
    // Update touch button layout for bonus vs normal
    updateTouchLayout();
    
    // Transitions
    if (transitionDir === 1) {
        transitionAlpha += 0.03;
        if (transitionAlpha >= 1) {
            transitionDir = 0;
            if (transitionCallback) { transitionCallback(); transitionCallback = null; }
        }
    } else if (transitionDir === -1) {
        transitionAlpha -= 0.03;
        if (transitionAlpha <= 0) { transitionAlpha = 0; transitionDir = 0; }
    }
}

// ---- MAIN DRAW ----
function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }
    
    if (gameState === 'title') {
        drawTitleScreen();
    } else if (gameState === 'settings') {
        drawSettingsScreen();
    } else if (gameState === 'story') {
        drawStoryScreen();
    } else if (gameState === 'playing' || gameState === 'bossFight') {
        drawGameplay();
    } else if (gameState === 'paused') {
        if (previousState === 'tutorial') {
            drawTutorial();
        } else if (previousState === 'bonus') {
            drawBonus();
        } else {
            drawGameplay();
        }
        drawPauseScreen();
    } else if (gameState === 'levelComplete') {
        drawGameplay();
        drawLevelComplete();
    } else if (gameState === 'gameOver') {
        drawGameOverScreen();
    } else if (gameState === 'victory') {
        drawVictoryScreen();
    } else if (gameState === 'bonus') {
        drawBonus();
    } else if (gameState === 'tutorial') {
        drawTutorial();
    } else if (gameState === 'market') {
        drawMarketScreen();
    }
    
    // Transition overlay
    if (transitionAlpha > 0) {
        ctx.fillStyle = `rgba(0,0,0,${transitionAlpha})`;
        ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);
    }
    
    ctx.restore();
}

function handleMarketAction() {
    const skinPrices = [0, 1000, 2000, 3000, 4000, 5000, 5000, 5000];
    const i = marketSelection;
    if (i >= SKIN_NAMES.length) return;
    if (unlockedSkins[i]) {
        selectedSkin = i;
        saveMarketData();
    } else if (totalCoins >= skinPrices[i]) {
        totalCoins -= skinPrices[i];
        unlockedSkins[i] = true;
        selectedSkin = i;
        saveMarketData();
    }
}

function updateMarket() {
    if (keys['ArrowLeft']) {
        keys['ArrowLeft'] = false;
        marketSelection = (marketSelection + 7) % 8;
    }
    if (keys['ArrowRight']) {
        keys['ArrowRight'] = false;
        marketSelection = (marketSelection + 1) % 8;
    }
    if (keys['Enter']) {
        keys['Enter'] = false;
        handleMarketAction();
    }
    if (keys['Escape']) {
        keys['Escape'] = false;
        fadeOut(() => { gameState = 'title'; fadeIn(); });
    }
}

// Rounded rectangle helper
function roundRect(ctx, x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

    }

}

function drawStoryScreen() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const story = getStoryForLevel(currentLevel);
    
    // Draw story text
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    
    if (storyIndex < story.length) {
        const lines = story[storyIndex].split('\n');
        lines.forEach((line, i) => {
            ctx.fillText(line, canvas.width/2, canvas.height/2 - 20 + i * 30);
        });
        
        // Skip prompt
        const blink = Math.sin(Date.now() * 0.005) > 0;
        if (blink) {
            ctx.fillStyle = '#FFD700';
            ctx.font = '14px Arial';
            ctx.fillText('ENTER para continuar', canvas.width/2, canvas.height - 50);
        }
        
        if (keys['Enter']) {
            keys['Enter'] = false;
            storyIndex++;
        }
    } else if (transitionDir === 0 && transitionAlpha === 0) {
        fadeOut(() => {
            startLevel(currentLevel);
            fadeIn();
        });
    }
    
    // Level indicator
    ctx.fillStyle = '#FFD700';
    ctx.font = '14px Arial';
    ctx.fillText(`Nivel ${currentLevel + 1}: ${LEVEL_THEMES[currentLevel].name}`, canvas.width/2, 30);
    
    ctx.textAlign = 'left';
}

function drawGameplay() {
    const theme = LEVEL_THEMES[currentLevel];
    
    // Background
    drawBackground(theme, currentLevel);
    
    // Boss arena background
    if (gameState === 'bossFight' || (gameState === 'paused' && previousState === 'bossFight')) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    
    // Platforms
    for (const p of level.platforms) {
        drawPlatform(p, theme);
    }
    
    // Coins
    for (const c of level.coins) {
        drawCoin(c);
    }
    
    // Power-ups
    for (const pu of level.powerUps) {
        drawPowerUp(pu);
    }
    
    // Hamburgers
    for (const b of level.burgers) {
        drawBurger(b);
    }
    
    // Checkpoints
    drawCheckpoints();
    
    // Enemy drops
    drawDrops();
    
    // Enemies
    for (const e of level.enemies) {
        drawEnemy(e);
    }
    
    // Boss
    if (boss && boss.alive) {
        if (boss.type === 'mocuson') drawMocuson(boss);
        else if (boss.type === 'romecio') drawRomecio(boss);
        else if (boss.type === 'cambiaformas') drawCambiaFormas(boss);
        else if (boss.type === 'monstruocama') drawMonstruoCama(boss);
        else if (boss.type === 'maelado') drawMaelado(boss);
        else if (boss.type === 'timbroso') drawTimbroso(boss);
        
        // Projectiles
        for (const p of boss.projectiles) {
            drawProjectile(p);
        }
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.globalAlpha = 1;
    }
    
    // Player projectiles
    drawPlayerProjectiles();
    
    // Player
    if (!player.dead || player.y < canvas.height + 50) {
        // Dash afterimage effect (skip on mobile for performance)
        if (player.isDashing && !isMobileEarly) {
            ctx.save();
            ctx.globalAlpha = 0.25;
            drawPlayerCharacter(
                player.x - camera.x - player.dashDir * 20, player.y,
                player.w, player.h,
                player.facing, player.animTimer,
                false, 0, false, false
            );
            ctx.globalAlpha = 0.12;
            drawPlayerCharacter(
                player.x - camera.x - player.dashDir * 40, player.y,
                player.w, player.h,
                player.facing, player.animTimer,
                false, 0, false, false
            );
            ctx.globalAlpha = 1;
            ctx.restore();
        }
        // Wall slide visual
        if (player.wallSliding) {
            const wallX = player.wallDir < 0 ? player.x + player.w : player.x;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 3; i++) {
                const sparkY = player.y + 10 + i * 15 + Math.random() * 5;
                ctx.fillRect(wallX - camera.x + (player.wallDir < 0 ? -3 : 0), sparkY, 3, 3);
            }
        }
        // Giant glow effect
        if (player.giantTimer > 0) {
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = '#4169E1';
            ctx.beginPath();
            ctx.ellipse(player.x - camera.x + player.w/2, player.y + player.h/2, player.w * 0.8, player.h * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
        }
        // Fly glow effect
        if (player.flyTimer > 0) {
            ctx.save();
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = '#9C27B0';
            ctx.beginPath();
            ctx.ellipse(player.x - camera.x + player.w/2, player.y + player.h, player.w * 0.5, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
        }
        drawPlayerCharacter(
            player.x - camera.x, player.y,
            player.w, player.h,
            player.facing, player.animTimer,
            player.attacking, player.invincible,
            false, player.isRunning
        );
    }
    
    // Boss zone indicator (arrow)
    if (gameState === 'playing') {
        const arrowX = level.bossZone - camera.x;
        if (arrowX > canvas.width - 60 && arrowX < canvas.width + 500) {
            ctx.fillStyle = '#f44336';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('BOSS →', canvas.width - 80, 80);
        }
    }
    
    // UI
    drawUI();
    
    // Combo display
    if (comboCount > 1) {
        ctx.save();
        ctx.textAlign = 'center';
        const comboAlpha = Math.min(1, comboTimer / 30);
        ctx.globalAlpha = comboAlpha;
        ctx.fillStyle = '#FFD700';
        ctx.font = `bold ${18 + comboCount * 2}px Arial`;
        ctx.fillText(`${comboCount}x COMBO!`, canvas.width / 2, 70);
        if (comboCount >= 3) {
            ctx.fillStyle = '#ff4444';
            ctx.font = 'bold 12px Arial';
            ctx.fillText(`+${comboCount * 25} bonus`, canvas.width / 2, 88);
        }
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
        ctx.restore();
    }
    
    // Screen flash effect
    if (screenFlash.timer > 0) {
        ctx.save();
        ctx.globalAlpha = screenFlash.timer * 0.06;
        ctx.fillStyle = screenFlash.color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        ctx.restore();
    }
}

let pauseButtons = [];
let pauseConfirm = null; // tracks which destructive action needs confirmation
let pauseConfirmBtns = []; // SÍ and NO button rects for touch

function drawPauseScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 42px Arial';
    ctx.fillText('PAUSA', canvas.width/2, canvas.height/2 - 110);
    
    // Tick down input delay
    if (pauseInputDelay > 0) pauseInputDelay--;
    
    // Confirmation dialog
    if (pauseConfirm) {
        const msg = pauseConfirm === 'title' ? '¿Volver al inicio?' : '¿Reiniciar nivel?';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(msg, canvas.width/2, canvas.height/2 - 10);
        ctx.fillStyle = '#aaa';
        ctx.font = '16px Arial';
        ctx.fillText('Se perderá el progreso del nivel actual', canvas.width/2, canvas.height/2 + 20);
        
        const btnW2 = 140, btnH2 = 42, gap2 = 20;
        const yBtn = canvas.height/2 + 50;

        // Store confirm button rects for touch
        pauseConfirmBtns = [
            { x: canvas.width/2 - btnW2 - gap2/2, y: yBtn, w: btnW2, h: btnH2, action: 'yes' },
            { x: canvas.width/2 + gap2/2, y: yBtn, w: btnW2, h: btnH2, action: 'no' }
        ];

        // SÍ button
        const hover1 = pauseSelection === 0;
        ctx.fillStyle = hover1 ? '#f44336' : '#333';
        ctx.strokeStyle = '#f44336';
        ctx.lineWidth = 2;
        roundRect(ctx, canvas.width/2 - btnW2 - gap2/2, yBtn, btnW2, btnH2, 10, true, true);
        ctx.fillStyle = hover1 ? '#fff' : '#f44336';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('SÍ', canvas.width/2 - btnW2/2 - gap2/2, yBtn + 28);
        
        // NO button
        const hover2 = pauseSelection === 1;
        ctx.fillStyle = hover2 ? '#4CAF50' : '#333';
        ctx.strokeStyle = '#4CAF50';
        ctx.lineWidth = 2;
        roundRect(ctx, canvas.width/2 + gap2/2, yBtn, btnW2, btnH2, 10, true, true);
        ctx.fillStyle = hover2 ? '#fff' : '#4CAF50';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('NO', canvas.width/2 + btnW2/2 + gap2/2, yBtn + 28);
        
        ctx.textAlign = 'left';
        
        if (pauseInputDelay > 0) return;
        
        if (keys['ArrowLeft'] || keys['ArrowRight']) {
            keys['ArrowLeft'] = false; keys['ArrowRight'] = false;
            pauseSelection = pauseSelection === 0 ? 1 : 0;
        }
        if (keys['Enter']) {
            keys['Enter'] = false;
            if (pauseSelection === 0) {
                executePauseAction(pauseConfirm);
            }
            pauseConfirm = null;
            pauseSelection = 0;
        }
        if (keys['Escape'] || keys['KeyP']) {
            keys['Escape'] = false; keys['KeyP'] = false;
            pauseConfirm = null;
            pauseSelection = 0;
        }
        return;
    }
    
    const btnW = 240, btnH = 45;
    const btnX = canvas.width/2 - btnW/2;
    const startY = canvas.height/2 - 55;
    const gap = 58;
    
    const labels = ['▶ REANUDAR', '⚙ AJUSTES', '🏠 INICIO', '🔄 REINICIAR'];
    pauseButtons = [];
    
    for (let i = 0; i < 4; i++) {
        const by = startY + i * gap;
        const hover = pauseSelection === i;
        ctx.fillStyle = hover ? '#FFD700' : '#333';
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 2;
        roundRect(ctx, btnX, by, btnW, btnH, 12, true, true);
        ctx.fillStyle = hover ? '#000' : '#FFD700';
        ctx.font = 'bold 22px Arial';
        ctx.fillText(labels[i], canvas.width/2, by + 31);
        pauseButtons.push({ x: btnX, y: by, w: btnW, h: btnH, action: ['resume','settings','title','restart'][i] });
    }
    
    // Selection indicator
    const selY = startY + pauseSelection * gap;
    const blink = Math.sin(Date.now() * 0.006) > 0;
    if (blink) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 20px Arial';
        ctx.fillText('▸', canvas.width/2 - btnW/2 - 20, selY + 30);
    }
    
    ctx.fillStyle = '#aaa';
    ctx.font = '13px Arial';
    ctx.fillText('Z = Rayo  |  X = Estrella  |  Mayús = Dash  |  ESPACIO = Saltar (x2)', canvas.width/2, startY + 4 * gap + 20);
    
    ctx.textAlign = 'left';
    
    // Don't accept input during delay
    if (pauseInputDelay > 0) return;
    
    // Keyboard navigation
    if (keys['ArrowUp']) {
        keys['ArrowUp'] = false;
        pauseSelection = (pauseSelection - 1 + 4) % 4;
    }
    if (keys['ArrowDown']) {
        keys['ArrowDown'] = false;
        pauseSelection = (pauseSelection + 1) % 4;
    }
    if (keys['Enter']) {
        keys['Enter'] = false;
        const action = pauseButtons[pauseSelection].action;
        if (action === 'title' || action === 'restart') {
            pauseConfirm = action;
            pauseSelection = 1; // default to NO
            pauseInputDelay = 10;
        } else {
            executePauseAction(action);
        }
    }
}

function executePauseAction(action) {
    if (action === 'resume') {
        gameState = previousState;
        startMusic();
    } else if (action === 'settings') {
        settingsReturnState = 'paused';
        gameState = 'settings';
    } else if (action === 'title') {
        stopMusic();
        fadeOut(() => {
            gameState = 'title';
            currentLevel = 0;
            score = 0;
            lives = 5;
            fadeIn();
        });
    } else if (action === 'restart') {
        if (previousState === 'tutorial') {
            startTutorial();
        } else {
            startLevel(currentLevel);
        }
    }
}

// ---- BONUS FLYING LEVEL ----
function initBonus() {
    bonusScrollX = 0;
    bonusTimer = 0;
    bonusPlayerY = canvas.height / 2 - 30;
    bonusShowTitle = 120;
    bonusCoins = [];
    bonusStars = [];
    // Generate background stars
    for (let i = 0; i < 100; i++) {
        bonusStars.push({
            x: Math.random() * canvas.width * 2,
            y: Math.random() * canvas.height,
            size: Math.random() * 2.5 + 0.5,
            speed: Math.random() * 1.5 + 0.5
        });
    }
    // Generate coins spread across a wide scrolling area
    const totalWidth = 3.5 * canvas.width;
    const numCoins = 65;
    for (let i = 0; i < numCoins; i++) {
        bonusCoins.push({
            x: canvas.width + Math.random() * totalWidth,
            y: 40 + Math.random() * (canvas.height - 100),
            collected: false,
            radius: 10
        });
    }
    startMusic();
}

function updateBonus() {
    bonusTimer++;
    bonusScrollX += 3.5;
    if (bonusShowTitle > 0) bonusShowTitle--;

    // Player movement
    const speed = 4.5;
    if (isKeyDown('ArrowUp')) bonusPlayerY -= speed;
    if (isKeyDown('ArrowDown')) bonusPlayerY += speed;
    if (bonusPlayerY < 10) bonusPlayerY = 10;
    if (bonusPlayerY > canvas.height - 70) bonusPlayerY = canvas.height - 70;

    // Check coin collection
    const px = 150, pw = 40, ph = 60;
    for (const coin of bonusCoins) {
        if (coin.collected) continue;
        const coinScreenX = coin.x - bonusScrollX;
        const dx = (px + pw / 2) - coinScreenX;
        const dy = (bonusPlayerY + ph / 2) - coin.y;
        if (Math.sqrt(dx * dx + dy * dy) < coin.radius + 20) {
            coin.collected = true;
            score += 50;
            totalCoins += 50;
            saveMarketData();
            sfxCoin();
            spawnParticles(coinScreenX, coin.y, '#FFD700', 6, 2);
        }
    }

    updateParticles();

    // End after ~30 seconds
    if (bonusTimer > 1800 && transitionDir === 0) {
        if (currentLevel >= 5) {
            fadeOut(() => {
                gameState = 'victory';
                for (const k in keys) keys[k] = false;
                // Go directly to victory screen
                fadeIn();
            });
        } else {
            fadeOut(() => {
                currentLevel++;
                storyIndex = 0;
                gameState = 'story';
                fadeIn();
            });
        }
    }
}

function drawBonus() {
    const t = Date.now() * 0.001;
    // Space background
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#000022');
    grad.addColorStop(0.5, '#0a0040');
    grad.addColorStop(1, '#000011');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Scrolling stars
    ctx.fillStyle = '#fff';
    for (const star of bonusStars) {
        const sx = (star.x - bonusScrollX * star.speed) % (canvas.width + 50);
        const drawX = sx < 0 ? sx + canvas.width + 50 : sx;
        ctx.globalAlpha = 0.5 + star.size * 0.2;
        ctx.fillRect(drawX, star.y, star.size, star.size);
    }
    ctx.globalAlpha = 1;

    // Draw coins
    for (const coin of bonusCoins) {
        if (coin.collected) continue;
        const coinScreenX = coin.x - bonusScrollX;
        if (coinScreenX < -20 || coinScreenX > canvas.width + 20) continue;
        ctx.fillStyle = '#FFD700';
        ctx.globalAlpha = 0.8 + Math.sin(t * 4 + coin.x) * 0.2;
        drawStar(coinScreenX, coin.y, coin.radius, coin.radius * 0.4, 5);
        ctx.globalAlpha = 1;
    }

    // Draw particles
    for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Draw player (flying Chico Estrella)
    drawPlayerCharacter(130, bonusPlayerY, 40, 60, 1, bonusTimer * 0.3, false, 0);

    // UI - Score
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`⭐ ${score}`, 15, 30);

    // Timer bar
    const remaining = Math.max(0, 1 - bonusTimer / 1800);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(canvas.width / 2 - 150, 12, 300, 14);
    ctx.fillStyle = '#00d4ff';
    ctx.fillRect(canvas.width / 2 - 150, 12, 300 * remaining, 14);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(canvas.width / 2 - 150, 12, 300, 14);

    // Bonus title text
    if (bonusShowTitle > 0) {
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.min(1, bonusShowTitle / 30);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 48px Arial';
        ctx.fillText('¡NIVEL BONUS!', canvas.width / 2, canvas.height / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '22px Arial';
        ctx.fillText('¡Recolectá todas las monedas!', canvas.width / 2, canvas.height / 2 + 10);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
    }
}

function drawVictoryScreen() {
    // Cosmic celebration background
    const t = Date.now() * 0.001;
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#000033');
    grad.addColorStop(0.5, '#1a0a4e');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Fireworks/stars
    ctx.fillStyle = '#FFD700';
    for (let i = 0; i < 30; i++) {
        const fx = (i * 137 + t * 50) % canvas.width;
        const fy = (i * 97 + Math.sin(t * 2 + i) * 50) % canvas.height;
        const size = Math.sin(t * 3 + i) * 3 + 3;
        ctx.globalAlpha = Math.sin(t * 2 + i) * 0.5 + 0.5;
        drawStar(fx, fy, size, size * 0.4, 5);
    }
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'center';
    
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 44px Arial';
    ctx.fillText('¡¡¡VICTORIA!!!', canvas.width/2, 65);
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText(`Puntuación Final: ${score}`, canvas.width/2, 100);
    
    {
        // Normal victory celebration
        drawPlayerCharacter(canvas.width/2 - 40, canvas.height/2 - 20, 80, 120, 1, t * 15, false, 0);
        
        const heroName = SKIN_NAMES[selectedSkin];
        ctx.fillStyle = '#00d4ff';
        ctx.font = '22px Arial';
        ctx.fillText('¡' + heroName + ' salvó a la Tierra!', canvas.width/2, canvas.height/2 + 120);
        
        ctx.fillStyle = '#fff';
        ctx.font = '16px Arial';
        ctx.fillText('Los villanos fueron derrotados y la paz reina de nuevo.', canvas.width/2, canvas.height/2 + 150);
        if (selectedSkin === 0) {
            ctx.fillText('El héroe del planeta Crux protege Argentina y el mundo entero.', canvas.width/2, canvas.height/2 + 175);
        } else {
            ctx.fillText(heroName + ' demostró ser un verdadero héroe para Argentina y el mundo.', canvas.width/2, canvas.height/2 + 175);
        }
        
        const blink = Math.sin(t * 4) > 0;
        if (blink) {
            ctx.fillStyle = '#FFD700';
            ctx.font = '16px Arial';
            ctx.fillText('Presioná ENTER para volver al inicio', canvas.width/2, canvas.height - 50);
        }
        
        if (keys['Enter']) {
            keys['Enter'] = false;
            fadeOut(() => {
                gameState = 'title';
                fadeIn();
            });
        }
    }
    
    ctx.textAlign = 'left';
}

// ---- CANVAS TOUCH (for title/story/settings screens) ----
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    ensureAudio();
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const tx = (e.touches[0].clientX - rect.left) * scaleX;
    const ty = (e.touches[0].clientY - rect.top) * scaleY;
    
    if (gameState === 'title') {
        for (const btn of titleButtons) {
            if (tx >= btn.x && tx <= btn.x + btn.w && ty >= btn.y && ty <= btn.y + btn.h) {
                if (btn.action === 'play') titleSelection = 0;
                else if (btn.action === 'tutorial') titleSelection = 1;
                else if (btn.action === 'settings') titleSelection = 2;
                else if (btn.action === 'market') titleSelection = 3;
                keys['Enter'] = true;
                setTimeout(() => keys['Enter'] = false, 100);
                return;
            }
        }
    } else if (gameState === 'market') {
        for (const btn of marketButtons) {
            if (tx >= btn.x && tx <= btn.x + btn.w && ty >= btn.y && ty <= btn.y + btn.h) {
                if (btn.action === 'back') {
                    fadeOut(() => { gameState = 'title'; fadeIn(); });
                } else if (btn.action.startsWith('card')) {
                    const cardIdx = parseInt(btn.action.replace('card', ''));
                    marketSelection = cardIdx;
                    handleMarketAction();
                }
                return;
            }
        }
    } else if (gameState === 'settings') {
        for (const btn of settingsButtons) {
            if (tx >= btn.x && tx <= btn.x + btn.w && ty >= btn.y && ty <= btn.y + btn.h) {
                if (btn.action === 'music') {
                    musicEnabled = !musicEnabled;
                    if (!musicEnabled) stopMusic();
                } else if (btn.action === 'sfx') {
                    sfxEnabled = !sfxEnabled;
                } else if (btn.action === 'back') {
                    fadeOut(() => { gameState = settingsReturnState; fadeIn(); });
                }
                return;
            }
        }
    } else if (gameState === 'paused') {
        if (pauseInputDelay > 0) return;
        if (pauseConfirm) {
            // Check which confirm button was touched (SÍ or NO)
            for (const btn of pauseConfirmBtns) {
                if (tx >= btn.x && tx <= btn.x + btn.w && ty >= btn.y && ty <= btn.y + btn.h) {
                    if (btn.action === 'yes') {
                        executePauseAction(pauseConfirm);
                    }
                    pauseConfirm = null;
                    pauseSelection = 0;
                    return;
                }
            }
            return;
        }
        for (const btn of pauseButtons) {
            if (tx >= btn.x && tx <= btn.x + btn.w && ty >= btn.y && ty <= btn.y + btn.h) {
                if (btn.action === 'title' || btn.action === 'restart') {
                    pauseConfirm = btn.action;
                    pauseSelection = 1; // default to NO
                    pauseInputDelay = 10;
                } else {
                    executePauseAction(btn.action);
                }
                return;
            }
        }
    } else if (gameState === 'story') {
        keys['Enter'] = true;
        setTimeout(() => keys['Enter'] = false, 100);
    } else if (gameState === 'gameOver') {
        if (gameOverTimer > 60) {
            keys['Enter'] = true;
            setTimeout(() => keys['Enter'] = false, 100);
        }
    } else if (gameState === 'victory') {
        keys['Enter'] = true;
        setTimeout(() => keys['Enter'] = false, 100);
    }
}, {passive: false});
